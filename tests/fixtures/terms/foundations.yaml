terms:
  - id: alpha
    name: 알파
    short: 테스트용 알파 용어예요.
    doc: foundations/alpha
  - id: snmp
    name: SNMP
    en: Simple Network Management Protocol
    short: 장비의 상태를 묻고 답하는 표준 규약이에요.
    analogy: 관리 서버가 장비마다 놓인 문진표를 돌며 읽는 것과 같아요.
  - id: switch
    name: 스위치
    short: 같은 네트워크 안에서 데이터를 넘겨 주는 장비예요.
  - id: icmp
    name: ICMP
    short: 장비가 살아 있는지 확인할 때 쓰는 규약이에요.
