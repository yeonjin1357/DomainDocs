name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      # 실제 글로 글 검사·빌드·검색 색인까지 확인한다. 화면 테스트는 그 뒤에 테스트 전용 글로 dist를 다시 만든다.
      - run: npm run build
      - run: npm run test:e2e
