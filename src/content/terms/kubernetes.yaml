terms:
  - id: cluster
    name: 클러스터
    en: Kubernetes cluster
    aliases: [cluster, k8s cluster, 쿠버네티스 클러스터]
    short: 컨트롤 플레인 하나와 일하는 노드 여러 대를 묶은, 쿠버네티스의 전체 단위예요.
    analogy: 관제탑과 배 여러 척을 함께 부르는 항구 전체와 같아요.
    doc: kubernetes/overview
  - id: control-plane
    name: 컨트롤 플레인
    en: Control plane
    aliases: [control plane, 마스터, master node, 마스터 노드]
    short: 클러스터 전체를 관리하는 구성 요소 묶음이에요. API 서버, etcd, 스케줄러가 여기 있어요.
    analogy: 어느 배에 무엇을 실을지 정하는 항구 관제탑과 같아요.
    doc: kubernetes/overview
  - id: desired-state
    name: 원하는 상태
    en: Desired state
    aliases: [desired state, spec, 스펙, 선언형]
    short: 사용자가 바라는 모습을 적어 둔 거예요. 쿠버네티스는 지금 상태를 여기에 계속 맞춰요.
    doc: kubernetes/overview
  - id: api-server
    name: API 서버
    en: kube-apiserver
    aliases: [kube-apiserver, apiserver, API server]
    short: 쿠버네티스 API를 내놓는 중심 서버예요. 다른 구성 요소는 이 서버를 거쳐 움직여요.
    doc: kubernetes/overview
  - id: etcd
    name: etcd
    en: etcd
    aliases: [etcd, 엣시디]
    short: API 서버의 모든 데이터를 담는 키-값 저장소예요. 클러스터의 원하는 상태가 여기 있어요.
    doc: kubernetes/overview
  - id: scheduler
    name: 스케줄러
    en: kube-scheduler
    aliases: [kube-scheduler, scheduler, 스케줄링]
    short: 아직 노드가 정해지지 않은 파드를 찾아, 알맞은 노드에 배정하는 구성 요소예요.
    analogy: 화물 묶음을 어느 배에 실을지 정하는 배정 담당과 같아요.
    doc: kubernetes/pods-and-nodes
  - id: kubelet
    name: kubelet
    en: kubelet
    aliases: [kubelet, 큐블릿]
    short: 노드마다 도는 에이전트예요. 그 노드에 배정된 파드의 컨테이너가 잘 돌고 있는지 지켜요.
    analogy: 배마다 있으면서 실린 화물을 챙기는 선원과 같아요.
    doc: kubernetes/pods-and-nodes
  - id: node
    name: 노드
    en: Node
    aliases: [node, worker node, 워커 노드]
    short: 파드가 실제로 도는 서버예요. 물리 서버일 수도, 가상 머신일 수도 있어요.
    analogy: 화물 묶음을 싣고 다니는 배와 같아요.
    doc: kubernetes/pods-and-nodes
  - id: pod
    name: 파드
    en: Pod
    aliases: [pod, pods, 포드]
    short: 쿠버네티스의 가장 작은 실행 단위예요. 컨테이너 하나 이상이 IP와 저장소를 함께 써요.
    analogy: 늘 같은 배에 함께 실리는 컨테이너 묶음과 같아요.
    doc: kubernetes/pods-and-nodes
  - id: container
    name: 컨테이너
    en: Container
    aliases: [container, containers, 도커 컨테이너]
    short: 이미지를 실행한 것이에요. 서버의 커널을 함께 쓰면서 자기만의 프로세스·파일 시스템을 가져요.
    analogy: 안에 무엇이 들었든 같은 크레인과 배로 옮기는 표준 화물 컨테이너와 같아요.
    doc: kubernetes/containers
  - id: container-image
    name: 컨테이너 이미지
    en: Container image
    aliases: [image, 이미지, docker image, 도커 이미지, tag, 태그, digest, 다이제스트]
    short: 앱과 그 앱이 쓰는 모든 것을 묶은 파일이에요. 이름과 태그, 또는 다이제스트로 가리켜요.
    doc: kubernetes/containers
  - id: linux-namespace
    name: 네임스페이스(리눅스)
    en: Linux namespace
    aliases: [namespace, 네임스페이스, PID namespace, network namespace]
    short: 서버 전체의 자원을 그 안의 프로세스에게 자기만의 것처럼 보이게 감싸는 커널 기능이에요.
    doc: kubernetes/containers
  - id: cgroup
    name: cgroup
    en: Control groups
    aliases: [cgroup, cgroups, control group, 컨트롤 그룹]
    short: 프로세스를 묶어, 그 묶음이 쓰는 CPU·메모리 같은 자원을 제한하고 재는 커널 기능이에요.
    doc: kubernetes/containers
  - id: workload
    name: 워크로드
    en: Workload
    aliases: [workload, workloads, 워크로드 리소스, controller, 컨트롤러]
    short: 파드를 어떻게 몇 개 띄울지 적어 두면, 대신 파드를 만들고 지켜 주는 객체예요.
    analogy: 늘 몇 개를 실어 둘지 정해 둔 항구 운송 계약서와 같아요.
    doc: kubernetes/workloads
  - id: deployment
    name: Deployment
    en: Deployment
    aliases: [deployment, 디플로이먼트, ReplicaSet, 레플리카셋, replicas]
    short: 상태 없는 앱의 파드를 원하는 개수만큼 유지하고, 버전을 조금씩 바꿔 끼우는 워크로드예요.
    doc: kubernetes/workloads
  - id: rolling-update
    name: 롤링 업데이트
    en: Rolling update
    aliases: [rolling update, 롤링 배포, maxSurge, maxUnavailable]
    short: 새 버전 파드를 조금씩 띄우고 옛 파드를 조금씩 내려, 앱을 멈추지 않고 바꾸는 방식이에요.
    doc: kubernetes/workloads
  - id: daemonset
    name: DaemonSet
    en: DaemonSet
    aliases: [daemonset, 데몬셋]
    short: 모든 노드(또는 고른 노드)에 파드를 하나씩 띄우는 워크로드예요. 로그 수집기나 에이전트에 써요.
    doc: kubernetes/workloads
  - id: statefulset
    name: StatefulSet
    en: StatefulSet
    aliases: [statefulset, 스테이트풀셋]
    short: 파드마다 번호 붙은 이름과 자기 저장소를 고정해 주는 워크로드예요. 데이터베이스에 써요.
    doc: kubernetes/workloads
  - id: job
    name: Job
    en: Job
    aliases: [job, 잡, CronJob, 크론잡, cronjob, backoffLimit]
    short: 끝까지 돌고 멈추는 일을 맡는 워크로드예요. CronJob은 일정마다 Job을 만들어요.
    doc: kubernetes/workloads
  - id: resource-request
    name: 요청
    en: Resource request
    aliases: [requests, request, 리소스 요청, CPU request, memory request]
    short: 컨테이너가 쓸 CPU·메모리로 미리 잡아 두는 양이에요. 스케줄러가 이걸 보고 노드를 골라요.
    analogy: 배에 싣기 전에 미리 잡아 두는 자리 예약과 같아요.
    doc: kubernetes/requests-and-limits
  - id: resource-limit
    name: 한도
    en: Resource limit
    aliases: [limits, limit, 리소스 한도, CPU limit, memory limit, 리밋]
    short: 컨테이너가 넘지 못하는 CPU·메모리 선이에요. CPU는 느려지고, 메모리는 넘으면 프로세스가 끝나요.
    doc: kubernetes/requests-and-limits
  - id: cpu-throttling
    name: 스로틀링
    en: CPU throttling
    aliases: [throttling, CPU throttling, 쓰로틀링, nr_throttled, CFS quota]
    short: CPU 한도의 몫을 주기 안에 다 써서, 다음 주기까지 실행이 멈추는 일이에요.
    doc: kubernetes/requests-and-limits
  - id: oomkilled
    name: OOMKilled
    en: OOMKilled
    aliases: [oomkilled, OOM killed, OOM, 오오엠]
    short: 컨테이너가 메모리 한도를 넘게 쓰려 해서, 커널이 프로세스를 끝냈다는 종료 이유예요.
    doc: kubernetes/requests-and-limits
  - id: qos-class
    name: QoS 등급
    en: Quality of Service class
    aliases: [QoS, QoS class, Guaranteed, Burstable, BestEffort]
    short: 요청·한도를 적은 방식으로 정해지는 파드 등급이에요. 노드 자원이 모자랄 때 쫓겨나는 순서를 정해요.
    doc: kubernetes/requests-and-limits
  - id: pod-phase
    name: 파드 단계
    en: Pod phase
    aliases: [pod phase, phase, Pending, Running, Succeeded, Failed, Unknown, 파드 상태]
    short: 파드가 생애의 어디쯤인지 보여 주는 값이에요. Pending, Running 등 다섯 가지예요.
    doc: kubernetes/pod-status
  - id: crashloopbackoff
    name: CrashLoopBackOff
    en: CrashLoopBackOff
    aliases: [crashloopbackoff, 크래시루프, crash loop, back-off, 백오프]
    short: 컨테이너가 죽고 다시 뜨기를 되풀이해, 다음 재시작까지 기다리는 시간이 걸린 상태예요.
    doc: kubernetes/pod-status
  - id: probe
    name: 프로브
    en: Probe
    aliases: [probe, liveness probe, readiness probe, startup probe, 헬스 체크, health check]
    short: kubelet이 컨테이너를 주기적으로 찔러 보는 검사예요. 결과에 따라 다시 시작하거나 요청을 끊어요.
    doc: kubernetes/pod-status
  - id: service
    name: 서비스
    en: Service
    aliases: [service, svc, ClusterIP, NodePort, LoadBalancer, 쿠버네티스 서비스]
    short: 같은 일을 하는 파드 묶음 앞에 두는 고정 주소예요. 요청을 지금 떠 있는 파드로 넘겨요.
    analogy: 어느 배가 떠 있든 화물을 받아 넘겨주는 항구 접수처와 같아요.
    doc: kubernetes/services-and-ingress
  - id: label
    name: 레이블
    en: Label
    aliases: [label, labels, selector, 셀렉터, label selector]
    short: 파드 같은 객체에 붙이는 키-값 이름표예요. 서비스와 워크로드가 이걸로 파드를 골라요.
    doc: kubernetes/services-and-ingress
  - id: ingress
    name: 인그레스
    en: Ingress
    aliases: [ingress, ingress controller, 인그레스 컨트롤러, Gateway API, 게이트웨이]
    short: 바깥에서 온 HTTP 요청을 호스트 이름과 경로에 따라 서비스로 넘기는 규칙이에요.
    doc: kubernetes/services-and-ingress
  - id: configmap
    name: ConfigMap
    en: ConfigMap
    aliases: [configmap, 컨피그맵, config map]
    short: 비밀이 아닌 설정을 키-값으로 담아, 이미지 밖에서 파드에 넣어 주는 객체예요.
    doc: kubernetes/config-and-storage
  - id: secret
    name: Secret
    en: Secret
    aliases: [secret, 시크릿, secrets]
    short: 비밀번호·토큰 같은 민감한 값을 담는 객체예요. 기본 설정에서는 암호화 없이 저장돼요.
    doc: kubernetes/config-and-storage
  - id: persistent-volume
    name: PV
    en: PersistentVolume
    aliases: [PV, persistent volume, 퍼시스턴트 볼륨, StorageClass, 스토리지 클래스]
    short: 클러스터에 있는 저장소 한 조각이에요. 파드와 따로 살아서, 파드가 바뀌어도 데이터가 남아요.
    analogy: 항구에서 빌려 쓰는 창고 한 칸과 같아요.
    doc: kubernetes/config-and-storage
  - id: pvc
    name: PVC
    en: PersistentVolumeClaim
    aliases: [PVC, persistent volume claim, 볼륨 클레임]
    short: 크기와 접근 모드를 적어 내는 저장소 요청서예요. 조건이 맞는 PV에 묶여요.
    doc: kubernetes/config-and-storage
  - id: hpa
    name: HPA
    en: HorizontalPodAutoscaler
    aliases: [HPA, horizontal pod autoscaler, 오토스케일러, autoscaler, 자동 확장]
    short: 사용률 같은 지표를 보고 워크로드의 파드 수를 자동으로 늘리고 줄이는 객체예요.
    doc: kubernetes/autoscaling
