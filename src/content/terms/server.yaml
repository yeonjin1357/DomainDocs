terms:
  - id: process
    name: 프로세스
    en: Process
    aliases: [process, 프로그램 실행 단위]
    short: 실행 중인 프로그램이에요. 자기만의 메모리 공간과 번호(PID)를 가져요.
    analogy: 자기 방과 서류함을 가진 팀과 같아요.
    doc: server/processes-and-threads
  - id: thread
    name: 스레드
    en: Thread
    aliases: [thread, 쓰레드]
    short: 프로세스 안의 실행 흐름이에요. 같은 프로세스의 스레드는 메모리를 함께 써요.
    analogy: 같은 방의 서류를 함께 보는 팀원과 같아요.
    doc: server/processes-and-threads
  - id: pid
    name: PID
    en: Process ID
    aliases: [프로세스 ID, process id]
    short: 운영체제가 프로세스마다 붙이는 번호예요.
    doc: server/processes-and-threads
  - id: kernel
    name: 커널
    en: Kernel
    aliases: [kernel, 운영체제 커널, OS 커널]
    short: 운영체제의 핵심이에요. CPU·메모리·입출력을 프로세스들에게 나눠 줘요.
    analogy: 누가 언제 어느 책상을 쓸지 정하는 사무실 관리자와 같아요.
    doc: server/overview
  - id: logical-cpu
    name: 논리 CPU
    en: Logical CPU
    aliases: [logical CPU, 논리 코어, logical core, 하드웨어 스레드, hardware thread]
    short: 운영체제가 CPU 하나로 보는 실행 흐름이에요. SMT를 쓰면 물리 코어 하나가 둘로 보여요.
    analogy: 직원 한 명이 두 가지 일을 틈틈이 번갈아 붙잡는 것과 같아요.
    doc: server/cpu-usage
  - id: system-call
    name: 시스템 콜
    en: System call
    aliases: [system call, syscall, 시스템 호출]
    short: 앱이 파일 읽기 같은 일을 커널에 부탁하는 통로예요.
    doc: server/overview
  - id: proc-fs
    name: /proc
    en: proc filesystem
    aliases: [proc, procfs, 프록 파일 시스템]
    short: 리눅스 커널이 자기 상태를 파일처럼 내놓는 가상 파일 시스템이에요.
    doc: server/overview
  - id: scheduler
    name: 스케줄러
    en: Scheduler
    aliases: [scheduler, CPU 스케줄러]
    short: 실행할 준비가 된 스레드 중 다음에 CPU에서 돌릴 스레드를 고르는 커널 기능이에요.
    doc: server/processes-and-threads
  - id: cpu-core
    name: CPU 코어
    en: CPU core
    aliases: [core, 코어, vCPU, 논리 CPU]
    short: 한 번에 스레드 하나를 실행하는 CPU의 일꾼 단위예요.
    analogy: 사무실의 직원 한 명과 같아요.
    doc: server/cpu-usage
  - id: cpu-usage
    name: CPU 사용률
    en: CPU utilization
    aliases: [CPU usage, CPU utilization, CPU 사용량]
    short: 일정 시간 동안 CPU가 쉬지 않고 일한 시간의 비율이에요.
    doc: server/cpu-usage
  - id: load-average
    name: 부하
    en: Load average
    aliases: [load average, 로드 애버리지, load, 시스템 부하]
    short: 실행 중이거나 차례를 기다리는 일의 평균 수예요. 리눅스는 디스크를 기다리는 일도 세요.
    analogy: 일하는 직원과 책상을 기다리며 줄 선 사람을 합친 수와 같아요.
    doc: server/cpu-usage
  - id: iowait
    name: iowait
    en: I/O wait
    aliases: [wa, IO wait, 입출력 대기]
    short: CPU가 쉬는 동안 입출력 완료를 기다린 일이 있던 시간이에요. 믿기 어려운 값이에요.
    doc: server/cpu-usage
  - id: steal
    name: steal
    en: Steal time
    aliases: [st, steal time, 스틸 타임]
    short: 가상 머신에서 다른 가상 머신에게 CPU를 빼앗긴 시간이에요.
    doc: server/cpu-usage
  - id: zombie
    name: 좀비 프로세스
    en: Zombie process
    aliases: [zombie, defunct, 좀비]
    short: 끝났지만 부모 프로세스가 아직 거두지 않은 프로세스예요.
    doc: server/processes-and-threads
  - id: uninterruptible-sleep
    name: D 상태
    en: Uninterruptible sleep
    aliases: [uninterruptible sleep, 깨울 수 없는 잠, D state]
    short: 보통 디스크 입출력을 기다리며 깨울 수 없게 잠든 상태예요. 리눅스 부하에 들어가요.
    doc: server/processes-and-threads
  - id: page-cache
    name: 페이지 캐시
    en: Page cache
    aliases: [page cache, 파일 캐시, buff/cache, Cached]
    short: 디스크에서 읽은 파일 내용을 메모리에 담아 두는 곳이에요. 필요하면 비워 내줘요.
    analogy: 빈 책상에 펼쳐 둔 자주 보는 서류 사본과 같아요.
    doc: server/memory
  - id: available-memory
    name: available
    en: Available memory
    aliases: [MemAvailable, 가용 메모리, 사용 가능 메모리]
    short: 스왑 없이 새 프로그램에 줄 수 있는 메모리의 추정값이에요.
    doc: server/memory
  - id: rss
    name: RSS
    en: Resident set size
    aliases: [VmRSS, 상주 메모리, resident memory]
    short: 프로세스의 메모리 중 실제 메모리에 올라와 있는 양이에요.
    doc: server/memory
  - id: virtual-memory
    name: 가상 메모리
    en: Virtual memory
    aliases: [virtual memory, VmSize, VSZ, 주소 공간]
    short: 프로세스마다 받는 자기만의 주소 공간이에요. 잡아 둔 크기라 실제 사용량보다 커요.
    doc: server/memory
  - id: swap
    name: 스왑
    en: Swap
    aliases: [swap, 스왑 공간, swap space]
    short: 메모리 내용을 잠시 디스크에 내보내는 공간이에요. 자주 오가면 서버가 느려져요.
    analogy: 책상이 모자랄 때 덜 보는 서류를 캐비닛에 잠시 넣어 두는 것과 같아요.
    doc: server/memory
  - id: oom-killer
    name: OOM killer
    en: Out-of-memory killer
    aliases: [OOM, out of memory, 메모리 부족 종료]
    short: 메모리가 끝내 모자랄 때 커널이 점수가 높은 프로세스를 골라 끝내는 기능이에요.
    doc: server/memory
  - id: iops
    name: IOPS
    en: I/O operations per second
    aliases: [초당 입출력 수, r/s, w/s]
    short: 디스크가 초당 끝낸 읽기·쓰기 요청 수예요.
    doc: server/disk-io
  - id: disk-throughput
    name: 디스크 처리량
    en: Disk throughput
    aliases: [throughput, 대역폭, bandwidth, MB/s]
    short: 디스크가 초당 읽고 쓴 데이터의 양이에요. 요청 수 × 요청 크기예요.
    doc: server/disk-io
  - id: io-latency
    name: 입출력 지연
    en: I/O latency
    aliases: [await, r_await, w_await, 디스크 지연, disk latency]
    short: 디스크 요청 하나가 끝나기까지 걸린 시간이에요. 줄에서 기다린 시간도 들어가요.
    doc: server/disk-io
  - id: disk-util
    name: "%util"
    en: Device utilization
    aliases: [util, 디스크 사용률, disk utilization]
    short: 디스크에 요청이 하나라도 걸려 있던 시간의 비율이에요. SSD에서는 한계를 뜻하지 않아요.
    doc: server/disk-io
  - id: file-system
    name: 파일 시스템
    en: File system
    aliases: [filesystem, 파일시스템, ext4, xfs]
    short: 디스크에 파일을 정리해 두는 방식이에요. 데이터 블록과 inode를 따로 관리해요.
    doc: server/filesystem-and-capacity
  - id: inode
    name: inode
    en: Index node
    aliases: [아이노드, i-node]
    short: 파일마다 하나씩 있는 정보 묶음이에요. 크기, 권한, 시각, 내용의 위치를 담아요.
    analogy: 서류마다 위치와 정보를 적어 둔 색인 카드와 같아요.
    doc: server/filesystem-and-capacity
  - id: mount
    name: 마운트
    en: Mount
    aliases: [mount, mount point, 마운트 지점]
    short: 파일 시스템을 디렉터리 하나에 붙여 쓰는 일이에요. 예를 들어 /var에 디스크 하나를 붙여요.
    doc: server/filesystem-and-capacity
  - id: service
    name: 서비스
    en: Service
    aliases: [데몬, daemon, 서비스 유닛]
    short: 화면 없이 뒤에서 계속 도는 프로그램이에요. 웹 서버나 DB 같은 것들이에요.
    analogy: 출근해서 하루 종일 자리를 지키는 상주 팀과 같아요.
    doc: server/services-and-logs
  - id: systemd
    name: systemd
    aliases: [시스템디, 시스템 매니저, init]
    short: 부팅 때 가장 먼저 떠서 다른 서비스를 띄우고 지켜보는 프로그램이에요.
    analogy: 아침에 팀들을 출근시키고, 쓰러지면 다시 부르는 총무와 같아요.
    doc: server/services-and-logs
  - id: journald
    name: journald
    en: systemd-journald
    aliases: [저널, journal, systemd-journald]
    short: 서비스의 출력과 커널 메시지 같은 로그를 한곳에 모아 두는 서비스예요.
    analogy: 모든 팀의 업무 일지를 모아 두는 보관함과 같아요.
    doc: server/services-and-logs
  - id: kernel-log
    name: 커널 로그
    en: Kernel log
    aliases: [dmesg, kernel log, 커널 메시지, 커널 링 버퍼, kernel ring buffer]
    short: 커널이 남기는 메시지예요. 메모리 안의 정해진 크기 공간에 쌓여요.
    analogy: 관리자가 따로 쓰는 관리 일지와 같아요.
    doc: server/services-and-logs
  - id: file-descriptor
    name: 파일 디스크립터
    en: File descriptor
    aliases: [fd, file descriptor, 파일 기술자, FD]
    short: 프로세스가 연 파일·소켓·파이프마다 커널이 붙여 주는 번호예요.
    analogy: 창구에서 서류를 맡기면 받는 번호표와 같아요.
    doc: server/too-many-open-files
  - id: performance-counter
    name: 성능 카운터
    en: Performance counter
    aliases: [performance counter, perfmon, 퍼포먼스 카운터, Get-Counter]
    short: 윈도우가 CPU, 메모리, 디스크 같은 상태를 내놓는 값이에요. \객체(인스턴스)\카운터 경로로 읽어요.
    doc: server/windows
  - id: event-log
    name: 이벤트 로그
    en: Windows Event Log
    aliases: [Windows Event Log, event log, 이벤트 뷰어, Event Viewer]
    short: 윈도우의 기록이 모이는 곳이에요. 기록마다 수준과 이벤트 ID가 붙어요.
    doc: server/windows
  - id: gpu
    name: GPU
    en: Graphics Processing Unit
    aliases: [그래픽 처리 장치, 그래픽 카드, gpu]
    short: 작은 코어 수천 개로 같은 계산을 한꺼번에 하는 장치예요.
    analogy: 똑같은 작업대가 수천 개 늘어선 공장과 같아요.
    doc: server/gpu
  - id: sm
    name: SM
    en: Streaming Multiprocessor
    aliases: [스트리밍 멀티프로세서]
    short: GPU 코어를 묶은 단위예요. 계산은 SM들에 나뉘어 돌아요.
    doc: server/gpu
  - id: gpu-memory
    name: GPU 메모리
    en: GPU memory
    aliases: [VRAM, 비디오 메모리, 프레임 버퍼, framebuffer]
    short: GPU 카드에 붙은 따로 된 메모리예요. 계산할 데이터와 모델이 여기 올라가요.
    doc: server/gpu
  - id: xid
    name: XID
    en: Xid error
    aliases: [Xid 에러, XID 에러]
    short: NVIDIA 드라이버가 GPU 에러를 커널 로그에 남기는 번호 붙은 메시지예요.
    doc: server/gpu
  - id: smart
    name: SMART
    en: Self-Monitoring, Analysis and Reporting Technology
    aliases: [S.M.A.R.T., smartctl, 스마트]
    short: 디스크가 스스로 상태와 에러 수를 세어 두는 기능이에요.
    analogy: 엔진이 멈추기 전에 켜지는 자동차 계기판의 경고등과 같아요.
    doc: server/disk-health
  - id: raid
    name: RAID
    en: Redundant Array of Independent Disks
    aliases: [레이드, mdadm, 소프트웨어 RAID]
    short: 디스크 여러 개를 하나처럼 묶어, 하나가 고장 나도 데이터를 지키는 방식이에요.
    analogy: 예비 타이어를 달고 다니는 것과 같아요.
    doc: server/disk-health
  - id: uid
    name: UID
    en: User ID
    aliases: [사용자 ID, user ID, 사용자 번호]
    short: 리눅스가 사용자를 구별하는 번호예요. root는 0이에요.
    analogy: 사원 번호와 같아요. 이름이 아니라 번호로 출입을 검사해요.
    doc: server/users-and-permissions
  - id: file-permission
    name: 파일 권한
    en: File permission
    aliases: [권한, permission, rwx, chmod, 퍼미션, 파일 모드]
    short: 파일마다 주인·그룹·나머지가 읽고 쓰고 실행할 수 있는지 정한 값이에요.
    analogy: 방문마다 붙은 '주인, 같은 팀, 나머지'의 출입 규칙과 같아요.
    doc: server/users-and-permissions
  - id: root
    name: root
    aliases: [루트, superuser, 슈퍼유저, UID 0]
    short: UID가 0인 사용자예요. 커널의 권한 검사를 거의 건너뛰어요.
    analogy: 모든 문을 여는 마스터키를 가진 사람과 같아요.
    doc: server/users-and-permissions
  - id: sudo
    name: sudo
    aliases: [수도, sudoers]
    short: 허락받은 사용자가 명령 하나를 root나 다른 사용자로 실행하게 해 줘요.
    analogy: 필요할 때만 마스터키를 빌려 쓰고, 빌린 기록을 대장에 남기는 것과 같아요.
    doc: server/users-and-permissions
  - id: capability
    name: capability
    en: Linux capabilities
    aliases: [케이퍼빌리티, 리눅스 capability, setcap, CAP_NET_RAW]
    short: root의 힘을 조각으로 나눠, 프로세스에 하나씩 줄 수 있게 한 거예요.
    analogy: 마스터키 대신 필요한 문의 열쇠 하나만 주는 것과 같아요.
    doc: server/users-and-permissions
  - id: ebpf-verifier
    name: 검사기(verifier)
    en: eBPF verifier
    aliases: [verifier, 베리파이어, BPF verifier]
    short: eBPF 프로그램이 반드시 끝나고 허락된 메모리만 읽는지 올리기 전에 따져 보는 커널 기능이에요.
    analogy: 새 장비를 현장에 들이기 전에 안전 검사를 통과해야 하는 것과 같아요.
    doc: server/ebpf
  - id: tracepoint
    name: tracepoint
    aliases: [트레이스포인트, 추적점]
    short: 커널 개발자가 코드에 미리 박아 둔 관찰 지점이에요.
    analogy: 건물을 지을 때 미리 뚫어 둔 점검구와 같아요.
    doc: server/ebpf
  - id: kprobe
    name: kprobe
    en: Kernel probe
    aliases: [케이프로브, kretprobe]
    short: 커널 함수 아무 곳에나 붙여 그 함수가 불릴 때 프로그램을 돌리는 방법이에요.
    analogy: 점검구가 없는 벽에 구멍을 내 센서를 다는 것과 같아요.
    doc: server/ebpf
  - id: uprobe
    name: uprobe
    en: User-space probe
    aliases: [유프로브, uretprobe]
    short: 사용자 프로그램이나 라이브러리의 함수에 붙여 그 함수가 불릴 때 프로그램을 돌리는 방법이에요.
    analogy: 팀 사무실 문 앞에 센서를 달아 드나드는 서류를 보는 것과 같아요.
    doc: server/ebpf
  - id: hypervisor
    name: 하이퍼바이저
    en: Hypervisor
    aliases: [hypervisor, VMM, 가상 머신 모니터]
    short: 물리 서버의 CPU·메모리·디스크를 나눠 여러 가상 머신을 돌리는 소프트웨어예요.
    analogy: 건물의 직원과 공간을 여러 사무실에 나눠 주는 관리 회사와 같아요.
    doc: server/virtualization
  - id: vcpu
    name: vCPU
    en: Virtual CPU
    aliases: [가상 CPU, virtual CPU]
    short: 가상 머신이 받은 CPU 자리로, 실제로는 물리 코어를 시간으로 나눠 써요.
    analogy: 사무실이 계약한 직원 수지만, 실제 직원은 관리 회사가 돌려 보내요.
    doc: server/virtualization
  - id: overcommit
    name: 오버커밋
    en: Overcommit
    aliases: [overcommit, 과할당, 오버커밋먼트]
    short: 가상 머신에 준 CPU나 메모리의 합이 호스트가 가진 것보다 많은 상태예요.
    doc: server/virtualization
  - id: cpu-ready
    name: CPU Ready
    en: CPU Ready time
    aliases: [Ready time, "%RDY", 레디 타임]
    short: vCPU가 일할 준비가 됐는데 물리 코어가 비지 않아 기다린 시간이에요.
    analogy: 직원을 불렀는데 다른 사무실 일을 하느라 오지 않아 기다린 시간이에요.
    doc: server/virtualization
  - id: memory-balloon
    name: 메모리 풍선
    en: Memory ballooning
    aliases: [balloon, ballooning, 풍선, 벌루닝, vmmemctl]
    short: 게스트 안의 드라이버가 메모리를 잡아 두고, 그만큼을 호스트에 돌려주는 방법이에요.
    analogy: 관리 회사가 사무실 안에 짐을 들여 그 자리만큼 공간을 돌려받는 것과 같아요.
    doc: server/virtualization
  - id: signal
    name: 신호
    en: Signal
    aliases: [signal, 시그널, SIGTERM, SIGKILL]
    short: 커널이나 다른 프로세스가 프로세스에 보내는 짧은 알림으로, 번호와 이름이 있어요.
    analogy: 관리자가 팀에 건네는 짧은 쪽지와 같아요.
    doc: server/process-exit
  - id: exit-code
    name: 종료 코드
    en: Exit code
    aliases: [exit code, exit status, 종료 상태, 리턴 코드]
    short: 프로세스가 끝나며 남기는 0~255의 숫자로, 0은 성공이에요.
    analogy: 팀이 퇴근하며 문에 붙여 두는 결과 쪽지와 같아요.
    doc: server/process-exit
  - id: core-dump
    name: 코어 덤프
    en: Core dump
    aliases: [core dump, core file, 코어 파일]
    short: 프로세스가 비정상으로 끝나는 순간의 메모리를 그대로 담은 파일이에요.
    doc: server/process-exit
  - id: utc
    name: UTC
    en: Coordinated Universal Time
    aliases: [협정 세계시, 세계 표준시, GMT, Zulu]
    short: 세계가 함께 쓰는 기준 시각이에요. 한국 표준시는 UTC보다 9시간 빨라요.
    analogy: 지사가 많은 회사가 회의 시각을 적을 때 쓰는 본사 시계와 같아요.
    doc: foundations/time-and-timezones
  - id: epoch
    name: epoch 시각
    en: Unix time
    aliases: [epoch, Unix time, 유닉스 시간, 타임스탬프, timestamp]
    short: 1970-01-01 00:00 UTC부터 센 시간을 숫자 하나로 적은 시각이에요.
    analogy: 회사가 문을 연 날부터 센 날수로 날짜를 적는 것과 같아요.
    doc: foundations/time-and-timezones
