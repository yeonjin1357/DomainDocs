terms:
  - id: connection
    name: 연결
    en: Connection
    aliases: [커넥션, DB 연결]
    short: 앱과 DB 서버 사이에 열어 둔 통신 통로예요.
    analogy: 식당에서 손님이 앉은 테이블 하나와 같아요.
    doc: database/connections-and-sessions
  - id: session
    name: 세션
    en: Session
    aliases: [DB 세션]
    short: DB가 접속 하나마다 기억하는 상태예요. 누가 무엇을 하는 중인지 담아요.
    analogy: 테이블마다 놓인 주문서와 같아요.
    doc: database/connections-and-sessions
  - id: server-process
    name: 서버 프로세스
    en: Server process
    aliases: [백엔드 프로세스, backend process, 전용 서버 프로세스]
    short: DB 서버 안에서 연결 하나의 일을 맡아 처리하는 프로세스예요.
    analogy: 테이블 하나만 맡는 전담 웨이터와 같아요.
    doc: database/connections-and-sessions
  - id: worker-thread
    name: 작업 스레드
    en: Worker thread
    aliases: [worker, 워커 스레드]
    short: 여러 요청이 나눠 쓰는 일꾼 스레드예요. SQL Server가 이 방식을 써요.
    analogy: 몇 명이 여러 테이블을 돌아가며 맡는 웨이터와 같아요.
    doc: database/connections-and-sessions
  - id: connection-pool
    name: 커넥션 풀
    en: Connection pool
    aliases: [연결 풀, 풀]
    short: 앱이 연결을 미리 열어 두고 돌려 쓰는 묶음이에요.
    doc: apm/connection-pool
  - id: active-session
    name: 액티브 세션
    en: Active session
    aliases: [활성 세션]
    short: 지금 SQL을 실행하거나 무언가를 기다리는 세션이에요.
    doc: database/active-sessions
  - id: parser
    name: 파서
    en: Parser
    aliases: [파싱, 해석, parse]
    short: SQL의 문법과 뜻을 확인해 DB가 다룰 수 있는 구조로 바꾸는 단계예요.
    analogy: 주문서를 읽고 메뉴에 있는 음식인지 확인하는 일과 같아요.
    doc: database/query-processing
  - id: optimizer
    name: 옵티마이저
    en: Optimizer
    aliases: [플래너, planner, 최적화기, 쿼리 옵티마이저]
    short: 같은 결과를 내는 여러 방법의 비용을 어림해 가장 싼 계획을 고르는 단계예요.
    analogy: 재료 위치와 양을 보고 조리 순서를 정하는 주방장과 같아요.
    doc: database/query-processing
  - id: execution-plan
    name: 실행 계획
    en: Execution plan
    aliases: [플랜, plan, query plan, 쿼리 플랜]
    short: DB가 데이터를 찾고 합치는 순서를 적은 계획이에요.
    doc: database/execution-plans
  - id: statistics
    name: 통계
    en: Optimizer statistics
    aliases: [통계 정보, optimizer statistics]
    short: 테이블의 행 수와 값 분포를 미리 모아 둔 요약이에요.
    analogy: 창고 재고를 지난주에 세어 둔 장부와 같아요.
    doc: database/query-processing
  - id: plan-cache
    name: 실행 계획 캐시
    en: Plan cache
    aliases: [plan cache, 라이브러리 캐시, library cache, 공유 풀, shared pool]
    short: 한 번 만든 실행 계획을 담아 두고 다시 쓰는 메모리예요.
    analogy: 자주 나오는 주문의 조리 순서를 적어 둔 카드와 같아요.
    doc: database/query-processing
  - id: hard-parse
    name: 하드 파스
    en: Hard parse
    aliases: [hard parse, 라이브러리 캐시 미스, library cache miss]
    short: 다시 쓸 계획이 없어 해석부터 계획까지 새로 하는 일이에요. Oracle 용어예요.
    doc: database/query-processing
  - id: bind-variable
    name: 바인드 변수
    en: Bind variable
    aliases: [bind variable, 파라미터, parameter, 자리 표시자, placeholder]
    short: SQL에 값 대신 자리만 두고, 값은 따로 넘기는 방식이에요.
    analogy: 주문서 양식은 그대로 두고 수량 칸만 바꿔 쓰는 것과 같아요.
    doc: database/query-processing
  - id: block
    name: 블록
    en: Block
    aliases: [페이지, page, 데이터 블록]
    short: DB가 데이터를 읽고 쓰는 고정 크기 단위예요.
    analogy: 재료를 하나씩이 아니라 상자째 옮기는 것과 같아요.
    doc: database/memory-and-disk
  - id: buffer-cache
    name: 버퍼 캐시
    en: Buffer cache
    aliases: [buffer pool, 버퍼 풀, shared_buffers]
    short: 디스크에서 읽은 블록을 메모리에 담아 두는 곳이에요.
    analogy: 자주 쓰는 재료를 꺼내 두는 조리대와 같아요.
    doc: database/memory-and-disk
  - id: wal
    name: WAL
    en: Write-Ahead Log
    aliases: [redo, 리두 로그, redo log, 트랜잭션 로그]
    short: 바꾼 내용을 데이터 파일보다 먼저 적는 기록이에요. 장애 뒤 이 기록으로 되살려요.
    analogy: 요리를 내기 전에 주문 장부에 먼저 적어 두는 것과 같아요.
    doc: database/logs-and-recovery
  - id: transaction
    name: 트랜잭션
    en: Transaction
    aliases: [tx]
    short: 함께 성공하거나 함께 취소되는 작업 묶음이에요.
    analogy: 열 접시를 한 주문으로 넣고, 다 내거나 통째로 취소하는 단체 주문과 같아요.
    doc: database/transactions
  - id: commit
    name: 커밋
    en: Commit
    aliases: [commit]
    short: 트랜잭션의 변경을 확정하는 일이에요.
    doc: database/transactions
  - id: rollback
    name: 롤백
    en: Rollback
    aliases: [rollback, 되돌리기]
    short: 트랜잭션에서 바꾼 내용을 모두 원래대로 되돌리는 일이에요.
    doc: database/transactions
  - id: autocommit
    name: 자동 커밋
    en: Autocommit
    aliases: [autocommit, 오토커밋]
    short: 트랜잭션을 따로 열지 않으면 SQL 한 문장마다 커밋하는 방식이에요.
    doc: database/transactions
  - id: isolation-level
    name: 격리 수준
    en: Isolation level
    aliases: [isolation level, READ COMMITTED, REPEATABLE READ, READ UNCOMMITTED]
    short: 다른 트랜잭션의 변경이 언제부터 보이는지 정하는 단계예요.
    doc: database/transactions
  - id: index
    name: 인덱스
    en: Index
    aliases: [색인]
    short: 열 값을 정렬해 두고 값마다 행 위치를 적어 둔 구조예요.
    analogy: 책 뒤의 찾아보기와 같아요.
    doc: database/indexes
  - id: b-tree
    name: B-tree
    en: Balanced tree
    aliases: [B트리, 비트리, btree, B+ tree]
    short: 값을 정렬해 나무 모양으로 쌓은 구조예요. 대부분 DB의 기본 인덱스예요.
    doc: database/indexes
  - id: full-scan
    name: 전체 스캔
    en: Full table scan
    aliases: [풀 스캔, full scan, seq scan, sequential scan, table scan, 테이블 스캔]
    short: 테이블을 처음부터 끝까지 한 행씩 읽는 방법이에요.
    analogy: 찾아보기 없이 책을 첫 쪽부터 넘기는 것과 같아요.
    doc: database/indexes
  - id: composite-index
    name: 복합 인덱스
    en: Composite index
    aliases: [multicolumn index, 다중 열 인덱스, 결합 인덱스]
    short: 여러 열을 묶어 만든 인덱스예요. 앞 열부터 차례로 정렬돼요.
    analogy: 성으로 먼저, 같은 성 안에서 이름으로 정렬한 전화번호부와 같아요.
    doc: database/indexes
  - id: clustered-index
    name: 클러스터형 인덱스
    en: Clustered index
    aliases: [clustered index, 클러스터드 인덱스]
    short: 행 자체를 인덱스 키 순서로 저장하는 인덱스예요. 테이블마다 하나예요.
    doc: database/indexes
  - id: dirty-block
    name: 더티 블록
    en: Dirty block
    aliases: [dirty page, 더티 페이지, dirty buffer]
    short: 메모리에서만 바뀌고 아직 디스크에 쓰지 않은 블록이에요.
    doc: database/memory-and-disk
  - id: checkpoint
    name: 체크포인트
    en: Checkpoint
    aliases: [checkpoint]
    short: 메모리의 더티 블록을 데이터 파일에 몰아 쓰는 때예요.
    doc: database/memory-and-disk
  - id: row-lock
    name: 행 잠금
    en: Row lock
    aliases: [row lock, row-level lock, 로우 락]
    short: 행을 바꾸는 동안 다른 세션이 같은 행을 바꾸지 못하게 거는 잠금이에요.
    doc: database/concurrency
  - id: mvcc
    name: MVCC
    en: Multi-Version Concurrency Control
    aliases: [다중 버전 동시성 제어, 다중 버전]
    short: 한 행의 여러 버전을 두어 읽기와 쓰기가 서로를 기다리지 않게 하는 방식이에요.
    analogy: 고치는 중인 문서 대신 마지막 저장본을 읽게 하는 것과 같아요.
    doc: database/concurrency
  - id: snapshot
    name: 스냅숏
    en: Snapshot
    aliases: [snapshot, 스냅샷]
    short: 한 시점에 커밋돼 있던 데이터로 고정해 보는 모습이에요.
    doc: database/concurrency
  - id: undo
    name: 언두
    en: Undo
    aliases: [undo, 롤백 세그먼트, rollback segment, 언두 로그]
    short: 바꾸기 전의 옛 값을 담아 두는 곳이에요. 롤백과 옛 버전 읽기에 써요.
    doc: database/concurrency
  - id: vacuum
    name: VACUUM
    en: Vacuum
    aliases: [vacuum, 배큠, autovacuum]
    short: PostgreSQL에서 아무도 보지 않는 옛 행 버전을 치워 자리를 다시 쓰게 하는 작업이에요.
    doc: database/concurrency
  - id: deadlock
    name: 교착
    en: Deadlock
    aliases: [deadlock, 데드락, 교착 상태]
    short: 두 트랜잭션이 서로 상대가 쥔 잠금을 기다려 둘 다 못 나아가는 상태예요.
    doc: database/locks-and-blocking
  - id: replication
    name: 복제
    en: Replication
    aliases: [replication, 리플리케이션]
    short: 주 서버의 변경 로그를 다른 서버로 보내 같은 데이터를 한 벌 더 두는 일이에요.
    analogy: 본점 장부를 분점이 그대로 따라 적는 것과 같아요.
    doc: database/replication
  - id: standby
    name: 복제 서버
    en: Standby / Replica
    aliases: [standby, replica, 레플리카, 스탠바이, 대기 서버, 슬레이브]
    short: 주 서버의 로그를 받아 같은 데이터를 유지하는 서버예요. 보통 읽기만 해요.
    doc: database/replication
  - id: failover
    name: 장애 조치
    en: Failover
    aliases: [failover, 페일오버]
    short: 주 서버가 죽었을 때 복제 서버가 주 서버 역할을 넘겨받는 일이에요.
    doc: database/replication
  - id: sync-replication
    name: 동기 복제
    en: Synchronous replication
    aliases: [synchronous replication, synchronous commit, 동기 커밋]
    short: 복제 서버가 로그를 적었다고 확인해 줘야 커밋을 끝내는 복제예요.
    doc: database/replication
  - id: async-replication
    name: 비동기 복제
    en: Asynchronous replication
    aliases: [asynchronous replication, 비동기 커밋]
    short: 주 서버가 로그를 적으면 바로 커밋을 끝내고, 복제 서버에는 나중에 보내는 복제예요.
    doc: database/replication
  - id: generic-plan
    name: 범용 계획
    en: Generic plan
    aliases: [generic plan, 제네릭 플랜, 일반 계획, custom plan, 맞춤 계획]
    short: 바인드 값을 보지 않고 세워 두고 다시 쓰는 실행 계획이에요.
    analogy: 손님마다 묻지 않고 늘 같은 길로 가는 배달 경로와 같아요.
    doc: database/plan-changed
