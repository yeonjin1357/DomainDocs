terms:
  - id: http
    name: HTTP
    en: Hypertext Transfer Protocol
    aliases: [http, HTTPS, 에이치티티피]
    short: 요청 하나에 응답 하나가 짝을 이루는 웹의 통신 약속이에요. 요청마다 따로라 상태를 기억하지 않아요.
    analogy: 업무 종류와 계좌를 적어 내는 은행 신청서와 같아요.
    doc: apm/http-basics
  - id: status-code
    name: 상태 코드
    en: HTTP status code
    aliases: [status code, 응답 코드, 2xx, 4xx, 5xx]
    short: 응답 첫 줄의 세 자리 숫자예요. 첫 숫자가 성공(2), 요청 쪽 잘못(4), 서버 쪽 잘못(5)을 나눠요.
    doc: apm/http-basics
  - id: idempotent
    name: 멱등
    en: Idempotent
    aliases: [idempotent, idempotency, 멱등성]
    short: 같은 요청을 여러 번 보내도 한 번 보낸 것과 결과가 같은 성질이에요. GET·PUT·DELETE가 그래요.
    doc: apm/http-basics
  - id: load-balancer
    name: 로드 밸런서
    en: Load balancer
    aliases: [load balancer, LB, L4, L7, 부하 분산기]
    short: 같은 일을 하는 서버 여러 대에 들어온 요청을 나눠 주는 장비나 프로그램이에요.
    doc: apm/overview
  - id: web-server
    name: 웹 서버
    en: Web server
    aliases: [web server, nginx, Apache, httpd, IIS]
    short: 정적 파일을 바로 돌려주고, 앱 코드가 필요한 요청은 뒤의 WAS로 넘기는 서버예요.
    analogy: 안내 책자는 바로 건네고 업무는 창구로 보내는 은행 안내 데스크와 같아요.
    doc: apm/web-server-and-was
  - id: reverse-proxy
    name: 리버스 프록시
    en: Reverse proxy
    aliases: [reverse proxy, 프록시, proxy, 게이트웨이]
    short: 앞에서 요청을 받아 뒤의 서버로 넘겨 주는 역할이에요. 뒤의 서버가 여럿이면 나눠 줄 수도 있어요.
    doc: apm/web-server-and-was
  - id: was
    name: WAS
    en: Web Application Server
    aliases: [웹 애플리케이션 서버, Tomcat, JEUS, WebLogic, 앱 서버]
    short: 앱 코드를 실행해 요청에 맞는 응답을 만드는 서버예요.
    analogy: 손님의 업무를 실제로 처리하는 은행 창구와 같아요.
    doc: apm/web-server-and-was
  - id: thread-pool
    name: 스레드 풀
    en: Thread pool
    aliases: [thread pool, worker pool, maxThreads, 작업 스레드 풀]
    short: 요청을 처리할 스레드를 정해 둔 수만큼 묶어 두고 돌려 쓰는 방식이에요.
    analogy: 정해진 수의 창구 직원이 손님을 번갈아 맡는 것과 같아요.
    doc: apm/web-server-and-was
  - id: request-queue
    name: 대기열
    en: Request queue
    aliases: [queue, 큐, 작업 대기열, task queue, backlog]
    short: 빈 스레드가 없을 때 요청이 차례를 기다리는 줄이에요. 가득 차면 요청을 거부해요.
    analogy: 창구 직원이 모두 바쁠 때 손님이 앉는 대기석과 같아요.
    doc: apm/thread-pools
  - id: jvm
    name: JVM
    en: Java Virtual Machine
    aliases: [자바 가상 머신, HotSpot, java]
    short: 자바 코드를 실행하는 프로그램이에요. 서버에서는 프로세스 하나로 보여요.
    doc: apm/jvm-memory
  - id: heap
    name: 힙
    en: Heap
    aliases: [heap, 자바 힙, Java heap, Xmx]
    short: 자바 코드가 만든 객체가 담기는 메모리예요. 최대 크기는 -Xmx로 정해요.
    analogy: 지점의 서류 보관실과 같아요.
    doc: apm/jvm-memory
  - id: gc
    name: GC
    en: Garbage collection
    aliases: [garbage collection, 가비지 컬렉션, 가비지 컬렉터, G1]
    short: 더는 아무도 쓰지 않는 객체를 찾아 치워 힙에 자리를 만드는 일이에요.
    analogy: 아무도 찾지 않는 서류를 치우는 정리 담당과 같아요.
    doc: apm/jvm-memory
  - id: metaspace
    name: 메타스페이스
    en: Metaspace
    aliases: [metaspace, MaxMetaspaceSize]
    short: 클래스 정보를 담는 힙 밖 메모리예요. 기본으로 크기 제한이 없어요.
    doc: apm/jvm-memory
  - id: out-of-memory-error
    name: OutOfMemoryError
    en: OutOfMemoryError
    aliases: [OOM, OOME, Java heap space, 메모리 부족 오류]
    short: JVM이 새 객체를 담을 자리를 못 찾을 때 나는 오류예요. 꼭 누수를 뜻하지는 않아요.
    doc: apm/jvm-memory
  - id: thread-dump
    name: 스레드 덤프
    en: Thread dump
    aliases: [thread dump, jstack, Thread.print]
    short: 한순간 JVM의 모든 스레드가 어떤 상태로 어디서 무엇을 하는지 찍은 기록이에요.
    analogy: 지점 CCTV로 한순간을 찍은 사진과 같아요.
    doc: apm/thread-dumps
  - id: stack-trace
    name: 스택 트레이스
    en: Stack trace
    aliases: [stack trace, 스택, call stack, 호출 스택]
    short: 스레드가 어떤 코드를 거쳐 지금 어디를 실행 중인지 차례로 적은 목록이에요.
    doc: apm/thread-dumps
  - id: thread-state
    name: 스레드 상태
    en: Thread state
    aliases: [Thread.State, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING]
    short: 자바 스레드가 실행 중인지, 잠금을 기다리는지, 무엇을 기다리는지 나눈 이름이에요.
    doc: apm/thread-dumps
  - id: ttfb
    name: TTFB
    en: Time to First Byte
    aliases: [첫 바이트까지 시간, time to first byte, responseStart]
    short: 요청을 시작해 응답의 첫 바이트를 받기까지 걸린 시간이에요. 서버 처리와 네트워크 왕복이 함께 들어 있어요.
    doc: apm/page-load
  - id: rum
    name: RUM
    en: Real User Monitoring
    aliases: [실제 사용자 모니터링, 필드 데이터, field data]
    short: 실제 사용자의 브라우저에서 페이지 속도와 오류를 재서 모으는 모니터링이에요.
    doc: apm/rum
  - id: core-web-vitals
    name: Core Web Vitals
    en: Core Web Vitals
    aliases: [코어 웹 바이탈, Web Vitals, LCP, INP, CLS]
    short: 사용자 체감에 가까운 세 숫자 LCP(로딩), INP(반응), CLS(화면 안정)를 묶은 기준이에요.
    doc: apm/page-load
  - id: synthetic-monitoring
    name: 외부 감시
    en: Synthetic monitoring
    aliases: [synthetic monitoring, URL 모니터링, 랩 데이터, lab data, 신세틱 모니터링]
    short: 정해 둔 곳에서 주기적으로 주소를 열어 보며 속도와 정상 여부를 재는 감시예요.
    doc: apm/synthetic-monitoring
  - id: cache
    name: 캐시
    en: Cache
    aliases: [cache, 캐싱, caching, Redis, Memcached]
    short: 느린 곳에서 가져온 결과를 가까운 메모리에 잠시 두고 다시 쓰는 저장소예요.
    analogy: 창구 직원이 자주 묻는 환율표를 책상에 꺼내 두는 것과 같아요.
    doc: apm/cache
  - id: cache-hit-ratio
    name: 캐시 적중률
    en: Cache hit ratio
    aliases: [hit ratio, hit rate, 히트율, 적중률, cache hit, cache miss]
    short: 캐시에서 찾은 요청이 전체 요청 가운데 몇 퍼센트인지예요.
    doc: apm/cache
  - id: ttl
    name: TTL
    en: Time to live
    aliases: [time to live, 만료 시간, expire, 유효 시간]
    short: 저장한 값을 얼마 동안 쓸지 정한 시간이에요. 지나면 지워져요.
    doc: apm/cache
  - id: eviction
    name: 축출
    en: Eviction
    aliases: [eviction, evict, 쫓아내기, 퇴출, LRU]
    short: 캐시 메모리가 차면 덜 쓰는 값을 골라 지우는 일이에요.
    doc: apm/cache
  - id: memory-leak
    name: 메모리 누수
    en: Memory leak
    aliases: [memory leak, 누수, leak]
    short: 더는 쓰지 않는 객체를 계속 붙잡고 있어 메모리가 줄지 않고 쌓이는 일이에요.
    analogy: 다 본 서류를 버리지 않고 책상에 계속 쌓아 두는 것과 같아요.
    doc: apm/memory-growing
  - id: heap-dump
    name: 힙 덤프
    en: Heap dump
    aliases: [heap dump, hprof, GC.heap_dump, HeapDumpOnOutOfMemoryError]
    short: 그 순간 힙에 있던 객체를 모두 파일로 쏟아 낸 거예요. 누수를 찾는 핵심 자료예요.
    doc: apm/memory-growing
  - id: connection-leak
    name: 커넥션 누수
    en: Connection leak
    aliases: [connection leak, leakDetectionThreshold, 커넥션 반납 누락]
    short: 빌린 DB 커넥션을 닫지 않아 풀로 돌아오지 않는 일이에요.
    analogy: 빌려 간 우산을 돌려주지 않아 우산꽂이가 비는 것과 같아요.
    doc: apm/pool-exhausted
  - id: source-map
    name: 소스 맵
    en: Source map
    aliases: [source map, sourcemap, sourceMappingURL, .map]
    short: 줄이고 합친 자바스크립트의 위치를 원래 파일과 줄로 되돌리는 대응표예요.
    doc: apm/rum
  - id: n-plus-one
    name: N+1
    en: N+1 query problem
    aliases: [N+1 query, N+1 select, N+1 문제, 엔 플러스 원]
    short: 목록을 한 번 가져온 뒤 항목마다 SQL을 하나씩 더 보내는 모양이에요.
    analogy: 장보기 목록을 받고 물건 하나마다 마트를 따로 다녀오는 것과 같아요.
    doc: apm/n-plus-one
  - id: lazy-loading
    name: 지연 로딩
    en: Lazy loading
    aliases: [lazy loading, LAZY, FetchType.LAZY, 지연 가져오기]
    short: 연관 객체를 처음 읽는 순간에야 DB에서 가져오는 ORM의 방식이에요.
    doc: apm/n-plus-one
  - id: circuit-breaker
    name: 서킷 브레이커
    en: Circuit breaker
    aliases: [circuit breaker, 회로 차단기, Resilience4j, CallNotPermittedException]
    short: 바깥 호출의 실패가 쌓이면 한동안 호출을 끊고 바로 실패시키는 장치예요.
    analogy: 이상 전류가 흐르면 내려가는 집의 누전 차단기와 같아요.
    doc: apm/circuit-breaker
  - id: canary
    name: 카나리 배포
    en: Canary release
    aliases: [canary, canarying, 카나리, 카나리 릴리스]
    short: 새 버전을 일부 트래픽에만 먼저 내보내 기존 버전과 견주는 배포 방식이에요.
    analogy: 광부가 탄광에 카나리아를 먼저 들여보내 위험을 살피던 데서 온 말이에요.
    doc: apm/slow-after-deploy
  - id: resource-error
    name: 자원 불러오기 실패
    en: Resource loading error
    aliases: [resource error, 리소스 오류, 이미지 404, 스크립트 로드 실패]
    short: 이미지나 스크립트 같은 파일을 브라우저가 불러오지 못한 오류예요.
    doc: apm/browser-errors
  - id: error-grouping
    name: 오류 묶음
    en: Error grouping
    aliases: [issue, 이슈, fingerprint, 지문, 오류 묶기, grouping]
    short: 같은 원인의 오류 이벤트를 하나로 묶은 단위예요.
    doc: apm/browser-errors
  - id: gc-log
    name: GC 로그
    en: GC log
    aliases: [gc log, -Xlog:gc, Xlog, gc.log, PrintGCDetails]
    short: JVM이 GC마다 종류, 전후 힙 크기, 멈춘 시간을 남기는 기록이에요.
    doc: apm/gc-logs
  - id: young-gc
    name: young 수집
    en: Young collection
    aliases: [Pause Young, young GC, minor GC, 마이너 GC]
    short: 새로 만든 객체가 있는 영역만 치우는 GC예요.
    doc: apm/gc-logs
  - id: mixed-gc
    name: mixed 수집
    en: Mixed collection
    aliases: [Mixed GC, Pause Young (Mixed)]
    short: G1이 young 영역과 함께 old 영역 일부도 치우는 GC예요.
    doc: apm/gc-logs
  - id: full-gc
    name: Full GC
    en: Full GC
    aliases: [full gc, 풀 GC, Pause Full, 전체 GC]
    short: 힙 전체를 치우고 압축해서 가장 오래 멈추는 GC예요.
    doc: apm/gc-logs
  - id: evacuation-failure
    name: Evacuation Failure
    en: Evacuation failure
    aliases: [evacuation failure, to-space exhausted, 옮기기 실패]
    short: G1이 살아 있는 객체를 옮길 빈 자리를 찾지 못한 상태예요.
    doc: apm/gc-logs
