terms:
  - id: http
    name: HTTP
    en: Hypertext Transfer Protocol
    aliases: [http, HTTPS, 에이치티티피]
    short: 요청 하나에 응답 하나가 짝을 이루는 웹의 통신 약속이에요. 요청마다 따로라 상태를 기억하지 않아요.
    analogy: 업무 종류와 계좌를 적어 내는 은행 신청서와 같아요.
    doc: apm/http-basics
  - id: status-code
    name: 상태 코드
    en: HTTP status code
    aliases: [status code, 응답 코드, 2xx, 4xx, 5xx]
    short: 응답 첫 줄의 세 자리 숫자예요. 첫 숫자가 성공(2), 요청 쪽 잘못(4), 서버 쪽 잘못(5)을 나눠요.
    doc: apm/http-basics
  - id: idempotent
    name: 멱등
    en: Idempotent
    aliases: [idempotent, idempotency, 멱등성]
    short: 같은 요청을 여러 번 보내도 한 번 보낸 것과 결과가 같은 성질이에요. GET·PUT·DELETE가 그래요.
    doc: apm/http-basics
  - id: load-balancer
    name: 로드 밸런서
    en: Load balancer
    aliases: [load balancer, LB, L4, L7, 부하 분산기]
    short: 같은 일을 하는 서버 여러 대에 들어온 요청을 나눠 주는 장비나 프로그램이에요.
    doc: apm/overview
  - id: web-server
    name: 웹 서버
    en: Web server
    aliases: [web server, nginx, Apache, httpd, IIS]
    short: 정적 파일을 바로 돌려주고, 앱 코드가 필요한 요청은 뒤의 WAS로 넘기는 서버예요.
    analogy: 안내 책자는 바로 건네고 업무는 창구로 보내는 은행 안내 데스크와 같아요.
    doc: apm/web-server-and-was
  - id: reverse-proxy
    name: 리버스 프록시
    en: Reverse proxy
    aliases: [reverse proxy, 프록시, proxy, 게이트웨이]
    short: 앞에서 요청을 받아 뒤의 서버로 넘겨 주는 역할이에요. 뒤의 서버가 여럿이면 나눠 줄 수도 있어요.
    doc: apm/web-server-and-was
  - id: was
    name: WAS
    en: Web Application Server
    aliases: [웹 애플리케이션 서버, Tomcat, JEUS, WebLogic, 앱 서버]
    short: 앱 코드를 실행해 요청에 맞는 응답을 만드는 서버예요.
    analogy: 손님의 업무를 실제로 처리하는 은행 창구와 같아요.
    doc: apm/web-server-and-was
  - id: thread-pool
    name: 스레드 풀
    en: Thread pool
    aliases: [thread pool, worker pool, maxThreads, 작업 스레드 풀]
    short: 요청을 처리할 스레드를 정해 둔 수만큼 묶어 두고 돌려 쓰는 방식이에요.
    analogy: 정해진 수의 창구 직원이 손님을 번갈아 맡는 것과 같아요.
    doc: apm/web-server-and-was
  - id: request-queue
    name: 대기열
    en: Request queue
    aliases: [queue, 큐, 작업 대기열, task queue, backlog]
    short: 빈 스레드가 없을 때 요청이 차례를 기다리는 줄이에요. 가득 차면 요청을 거부해요.
    analogy: 창구 직원이 모두 바쁠 때 손님이 앉는 대기석과 같아요.
    doc: apm/thread-pools
  - id: jvm
    name: JVM
    en: Java Virtual Machine
    aliases: [자바 가상 머신, HotSpot, java]
    short: 자바 코드를 실행하는 프로그램이에요. 서버에서는 프로세스 하나로 보여요.
    doc: apm/jvm-memory
  - id: heap
    name: 힙
    en: Heap
    aliases: [heap, 자바 힙, Java heap, Xmx]
    short: 자바 코드가 만든 객체가 담기는 메모리예요. 최대 크기는 -Xmx로 정해요.
    analogy: 지점의 서류 보관실과 같아요.
    doc: apm/jvm-memory
  - id: gc
    name: GC
    en: Garbage collection
    aliases: [garbage collection, 가비지 컬렉션, 가비지 컬렉터, G1]
    short: 더는 아무도 쓰지 않는 객체를 찾아 치워 힙에 자리를 만드는 일이에요.
    analogy: 아무도 찾지 않는 서류를 치우는 정리 담당과 같아요.
    doc: apm/jvm-memory
  - id: metaspace
    name: 메타스페이스
    en: Metaspace
    aliases: [metaspace, MaxMetaspaceSize]
    short: 클래스 정보를 담는 힙 밖 메모리예요. 기본으로 크기 제한이 없어요.
    doc: apm/jvm-memory
  - id: out-of-memory-error
    name: OutOfMemoryError
    en: OutOfMemoryError
    aliases: [OOM, OOME, Java heap space, 메모리 부족 오류]
    short: JVM이 새 객체를 담을 자리를 못 찾을 때 나는 오류예요. 꼭 누수를 뜻하지는 않아요.
    doc: apm/jvm-memory
  - id: thread-dump
    name: 스레드 덤프
    en: Thread dump
    aliases: [thread dump, jstack, Thread.print]
    short: 한순간 JVM의 모든 스레드가 어떤 상태로 어디서 무엇을 하는지 찍은 기록이에요.
    analogy: 지점 CCTV로 한순간을 찍은 사진과 같아요.
    doc: apm/thread-dumps
  - id: stack-trace
    name: 스택 트레이스
    en: Stack trace
    aliases: [stack trace, 스택, call stack, 호출 스택]
    short: 스레드가 어떤 코드를 거쳐 지금 어디를 실행 중인지 차례로 적은 목록이에요.
    doc: apm/thread-dumps
  - id: thread-state
    name: 스레드 상태
    en: Thread state
    aliases: [Thread.State, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING]
    short: 자바 스레드가 실행 중인지, 잠금을 기다리는지, 무엇을 기다리는지 나눈 이름이에요.
    doc: apm/thread-dumps
  - id: ttfb
    name: TTFB
    en: Time to First Byte
    aliases: [첫 바이트까지 시간, time to first byte, responseStart]
    short: 요청을 시작해 응답의 첫 바이트를 받기까지 걸린 시간이에요. 서버 처리와 네트워크 왕복이 함께 들어 있어요.
    doc: apm/page-load
  - id: rum
    name: RUM
    en: Real User Monitoring
    aliases: [실제 사용자 모니터링, 필드 데이터, field data]
    short: 실제 사용자의 브라우저에서 페이지 속도와 오류를 재서 모으는 모니터링이에요.
    doc: apm/page-load
  - id: core-web-vitals
    name: Core Web Vitals
    en: Core Web Vitals
    aliases: [코어 웹 바이탈, Web Vitals, LCP, INP, CLS]
    short: 사용자 체감에 가까운 세 숫자 LCP(로딩), INP(반응), CLS(화면 안정)를 묶은 기준이에요.
    doc: apm/page-load
  - id: synthetic-monitoring
    name: 외부 감시
    en: Synthetic monitoring
    aliases: [synthetic monitoring, URL 모니터링, 랩 데이터, lab data, 신세틱 모니터링]
    short: 정해 둔 곳에서 주기적으로 주소를 열어 보며 속도와 정상 여부를 재는 감시예요.
    doc: apm/page-load
  - id: cache
    name: 캐시
    en: Cache
    aliases: [cache, 캐싱, caching, Redis, Memcached]
    short: 느린 곳에서 가져온 결과를 가까운 메모리에 잠시 두고 다시 쓰는 저장소예요.
    analogy: 창구 직원이 자주 묻는 환율표를 책상에 꺼내 두는 것과 같아요.
    doc: apm/cache
  - id: cache-hit-ratio
    name: 캐시 적중률
    en: Cache hit ratio
    aliases: [hit ratio, hit rate, 히트율, 적중률, cache hit, cache miss]
    short: 캐시에서 찾은 요청이 전체 요청 가운데 몇 퍼센트인지예요.
    doc: apm/cache
  - id: ttl
    name: TTL
    en: Time to live
    aliases: [time to live, 만료 시간, expire, 유효 시간]
    short: 저장한 값을 얼마 동안 쓸지 정한 시간이에요. 지나면 지워져요.
    doc: apm/cache
  - id: eviction
    name: 축출
    en: Eviction
    aliases: [eviction, evict, 쫓아내기, 퇴출, LRU]
    short: 캐시 메모리가 차면 덜 쓰는 값을 골라 지우는 일이에요.
    doc: apm/cache
