terms:
  - id: cloud-computing
    name: 클라우드
    en: Cloud computing
    aliases: [cloud, 클라우드 컴퓨팅, public cloud, 퍼블릭 클라우드]
    short: 서버·저장소·네트워크를 네트워크로 필요할 때 빌리고, 쓴 만큼 내는 방식이에요.
    analogy: 건물을 짓지 않고 필요한 크기의 사무실을 빌려 쓰는 것과 같아요.
    doc: cloud/overview
  - id: iaas
    name: IaaS
    en: Infrastructure as a Service
    aliases: [IaaS, PaaS, SaaS, 서비스형 인프라]
    short: 가상 서버·저장소·네트워크를 빌리는 형태예요. 운영체제부터 위는 내가 맡아요.
    doc: cloud/overview
  - id: shared-responsibility
    name: 책임 공유 모델
    en: Shared responsibility model
    aliases: [shared responsibility, 공동 책임 모델, 책임 공유]
    short: 클라우드 자체의 보안은 사업자가, 클라우드 안에 올린 것의 보안은 고객이 맡는다는 약속이에요.
    analogy: 건물 보안은 빌딩이, 사무실 안 살림은 입주사가 챙기는 것과 같아요.
    doc: cloud/overview
  - id: region
    name: 리전
    en: Region
    aliases: [region, regions, 지역]
    short: 클라우드 사업자가 데이터센터를 둔 지리적 지역이에요. 리전끼리는 서로 격리돼요.
    analogy: 빌딩들이 모여 있는 도시와 같아요.
    doc: cloud/regions-and-zones
  - id: availability-zone
    name: 가용 영역
    en: Availability zone
    aliases: [AZ, availability zone, 가용영역, Multi-AZ, 다중 AZ]
    short: 리전 안에서 전력·냉방·네트워크를 따로 가진, 서로 떨어진 데이터센터 묶음이에요.
    analogy: 같은 도시 안에서 몇 km씩 떨어진 빌딩과 같아요.
    doc: cloud/regions-and-zones
  - id: instance
    name: 인스턴스
    en: Instance
    aliases: [instance, EC2, VM, 가상 머신, virtual machine, AMI]
    short: 클라우드에서 빌린 가상 서버예요. 이미지로 운영체제와 기본 소프트웨어를 골라 띄워요.
    analogy: 빌딩에서 빌린 사무실 한 칸과 같아요.
    doc: cloud/virtual-machines
  - id: instance-type
    name: 인스턴스 유형
    en: Instance type
    aliases: [instance type, 인스턴스 타입, VM size, VM 크기, vCPU]
    short: 가상 서버의 CPU·메모리·네트워크·저장소 조합이에요. 이름에 용도와 크기가 들어 있어요.
    doc: cloud/virtual-machines
  - id: burstable-instance
    name: 버스트형 인스턴스
    en: Burstable performance instance
    aliases: [burstable, T 시리즈, CPU credit, CPU 크레딧, 크레딧, CPUCreditBalance]
    short: 평소엔 기준선만큼 쓰다가 모아 둔 CPU 크레딧으로 잠깐 더 쓰는 인스턴스예요.
    doc: cloud/virtual-machines
  - id: vpc
    name: VPC
    en: Virtual Private Cloud
    aliases: [VPC, VNet, Virtual Network, 가상 네트워크, 가상 사설 클라우드]
    short: 내 계정 안에 만드는, 다른 고객과 논리적으로 떨어진 가상 네트워크예요.
    analogy: 빌딩에서 우리 회사만 쓰는 층과 같아요.
    doc: cloud/networking
  - id: subnet
    name: 서브넷
    en: Subnet
    aliases: [subnet, public subnet, private subnet, 공개 서브넷, 비공개 서브넷, 라우팅 테이블]
    short: VPC의 IP 범위를 나눈 조각이에요. 가용 영역 하나에 있고, 경로에 따라 공개·비공개로 나뉘어요.
    doc: cloud/networking
  - id: security-group
    name: 보안 그룹
    en: Security group
    aliases: [security group, SG, NSG, 네트워크 보안 그룹, NACL, 네트워크 ACL]
    short: 서버 같은 자원에 붙는 방화벽이에요. 허용한 트래픽만 통과시키고, 응답은 알아서 통과시켜요.
    analogy: 방문 앞에 붙은 출입 명단과 같아요.
    doc: cloud/networking
  - id: block-storage
    name: 블록 저장소
    en: Block storage
    aliases: [block storage, EBS, Managed Disks, 볼륨, volume, gp3]
    short: 서버 한 대에 붙여 하드디스크처럼 쓰는 가상 디스크예요. 서버와 같은 가용 영역에 있어야 해요.
    analogy: 내 방에 들여놓은 캐비닛과 같아요.
    doc: cloud/storage
  - id: file-storage
    name: 파일 저장소
    en: File storage
    aliases: [file storage, EFS, Azure Files, NFS, 공유 폴더]
    short: 여러 서버가 네트워크로 함께 붙여 쓰는 공유 폴더예요.
    analogy: 층 사람들이 함께 쓰는 공용 캐비닛과 같아요.
    doc: cloud/storage
  - id: object-storage
    name: 오브젝트 저장소
    en: Object storage
    aliases: [object storage, S3, Blob Storage, bucket, 버킷, 객체]
    short: 파일을 통째로 키를 붙여 HTTP로 넣고 꺼내는 저장소예요. 용량이 거의 끝없이 늘어나요.
    analogy: 상자째 맡기고 번호표로 찾는 보관 창고와 같아요.
    doc: cloud/storage
  - id: managed-database
    name: 관리형 데이터베이스
    en: Managed database
    aliases: [RDS, managed database, 관리형 DB, Azure SQL Database, DBaaS, Multi-AZ, read replica, 읽기 복제본]
    short: 설치·패치·백업·고가용성을 사업자가 맡는 DB 서비스예요. 쿼리 튜닝은 여전히 내 몫이에요.
    analogy: 설비 점검은 빌딩이 맡는 공용 주방을 빌려 쓰는 것과 같아요.
    doc: cloud/managed-databases
  - id: serverless
    name: 서버리스 함수
    en: Serverless function
    aliases: [serverless, Lambda, Azure Functions, FaaS, 서버리스]
    short: 서버 없이 코드만 올려, 이벤트가 올 때 실행하고 쓴 만큼 내는 방식이에요.
    analogy: 전화가 올 때만 상담원을 불러 앉히는 콜센터와 같아요.
    doc: cloud/serverless
  - id: cold-start
    name: 콜드 스타트
    en: Cold start
    aliases: [cold start, 웜 스타트, warm start, Provisioned Concurrency, 초기화]
    short: 실행 환경이 없어 새로 띄우고 초기화하느라 첫 요청이 늦어지는 일이에요.
    doc: cloud/serverless
  - id: concurrency
    name: 동시성
    en: Concurrency
    aliases: [concurrency, 동시 실행, ConcurrentExecutions, Throttles, 스로틀, throttle]
    short: 함수가 같은 시각에 처리 중인 요청 수예요. 한도를 넘으면 넘친 요청이 거절돼요.
    doc: cloud/serverless
  - id: cloud-metric
    name: 클라우드 지표
    en: Cloud metric
    aliases: [CloudWatch, Azure Monitor, namespace, 네임스페이스, dimension, 차원, custom metric, 사용자 지정 지표]
    short: 사업자가 서비스마다 자동으로 모으는 지표예요. 네임스페이스·이름·차원으로 구분해요.
    doc: cloud/cloud-metrics
  - id: data-transfer-cost
    name: 데이터 전송 요금
    en: Data transfer cost
    aliases: [data transfer, egress, 이그레스, 송신 요금, 전송 비용, cross-AZ]
    short: 클라우드 밖이나 다른 AZ·리전으로 옮긴 데이터 양만큼 내는 요금이에요.
    analogy: 빌딩 밖으로 보내는 택배에만 붙는 운송비와 같아요.
    doc: cloud/costs
  - id: cost-allocation-tag
    name: 비용 할당 태그
    en: Cost allocation tag
    aliases: [cost allocation tag, 태그, tag, 비용 태그]
    short: 자원에 붙인 이름표로 요금을 팀이나 서비스별로 나눠 보는 기능이에요.
    doc: cloud/costs
  - id: throttling
    name: 스로틀링
    en: Throttling
    aliases: [throttling, throttle, 쓰로틀링, rate limiting, 속도 제한, ThrottlingException, RequestLimitExceeded, "429"]
    short: 정해 둔 속도보다 요청이 많으면 넘친 요청을 거절하는 일이에요.
    analogy: 창구가 몰리면 잠시 뒤 다시 오라고 돌려보내는 것과 같아요.
    doc: cloud/throttling
  - id: service-quota
    name: 할당량
    en: Service quota
    aliases: [quota, limit, 서비스 할당량, Service Quotas, 한도, 쿼터]
    short: 계정과 리전마다 만들거나 부를 수 있는 양에 사업자가 정해 둔 상한이에요.
    doc: cloud/throttling
  - id: iam
    name: IAM
    en: Identity and Access Management
    aliases: [identity and access management, 권한 관리]
    short: 누가 어떤 클라우드 자원에 무엇을 할 수 있는지 정하는 서비스예요.
    analogy: 빌딩의 출입증 제도와 같아요.
    doc: cloud/iam
  - id: iam-policy
    name: IAM 정책
    en: IAM policy
    aliases: [IAM policy, 권한 정책]
    short: 허락하거나 거부할 동작과 자원을 적은 JSON 문서예요. 사용자나 역할에 붙여요.
    doc: cloud/iam
  - id: iam-role
    name: 역할
    en: IAM role
    aliases: [IAM role, IAM 역할, role]
    short: 서버, 앱, 다른 계정이 맡아 정해진 시간만 쓰는 임시 자격 증명을 받는 IAM 신원이에요.
    analogy: 그날만 쓰는 방문증과 같아요.
    doc: cloud/iam
  - id: managed-identity
    name: 관리 ID
    en: Managed identity
    aliases: [managed identity, 관리 아이디, 관리되는 ID]
    short: Azure 자원에 붙여, 앱이 자격 증명을 따로 두지 않고 토큰을 받게 하는 ID예요.
    doc: cloud/iam
  - id: cdn
    name: CDN
    en: Content Delivery Network
    aliases: [콘텐츠 전송 네트워크, CloudFront, 엣지, edge, PoP]
    short: 세계 곳곳의 엣지 서버가 원본의 응답을 담아 두었다가 대신 주는 서비스예요.
    analogy: 자주 찾는 물건을 미리 둔 동네 편의점과 같아요.
    doc: cloud/cdn
  - id: auto-scaling-group
    name: 자동 확장 그룹
    en: Auto Scaling group
    aliases: [ASG, Auto Scaling group, EC2 Auto Scaling, 오토 스케일링 그룹, Virtual Machine Scale Sets, VMSS, 확장 집합]
    short: 같은 모양의 가상 머신을 묶어 대수를 늘리고 줄이며 지켜 주는 단위예요.
    analogy: 평소 인원을 정해 두고 바쁘면 더 부르는 콜센터 배치표와 같아요.
    doc: cloud/auto-scaling
  - id: launch-template
    name: 시작 템플릿
    en: Launch template
    aliases: [launch template, 시작 구성, launch configuration]
    short: 새 가상 머신을 어떤 이미지·유형·보안 그룹으로 띄울지 적은 설계도예요.
    doc: cloud/auto-scaling
  - id: desired-capacity
    name: 원하는 대수
    en: Desired capacity
    aliases: [desired capacity, 희망 용량, 원하는 용량, GroupDesiredCapacity]
    short: 자동 확장 그룹이 지금 유지하려는 서버 대수예요.
    doc: cloud/auto-scaling
  - id: target-tracking
    name: 목표 추적
    en: Target tracking scaling
    aliases: [target tracking, 대상 추적, 목표 추적 조정]
    short: 평균 CPU 50%처럼 목표값을 정하면 그 값에 맞게 대수를 바꾸는 확장 규칙이에요.
    analogy: 정한 온도를 지키는 온도 조절기와 같아요.
    doc: cloud/auto-scaling
  - id: lifecycle-hook
    name: 수명 주기 훅
    en: Lifecycle hook
    aliases: [lifecycle hook, 라이프사이클 훅, 수명 주기 후크]
    short: 그룹이 서버를 띄우거나 지울 때 잠시 멈춰 세우고 할 일을 끼워 넣는 장치예요.
    doc: cloud/auto-scaling
  - id: on-demand
    name: 온디맨드
    en: On-Demand
    aliases: [On-Demand, 온디맨드 인스턴스, 종량제, pay-as-you-go]
    short: 약속 없이 켠 만큼 내는 가장 기본적인 요금 방식이에요.
    analogy: 갈 때마다 내는 헬스장 일일권과 같아요.
    doc: cloud/pricing-models
  - id: savings-plans
    name: Savings Plans
    en: Savings Plans
    aliases: [절감형 플랜, 세이빙스 플랜, Compute Savings Plans, EC2 Instance Savings Plans]
    short: 1년이나 3년 동안 시간당 사용 금액을 약정하고 할인받는 AWS 요금제예요.
    doc: cloud/pricing-models
  - id: reserved-instance
    name: 예약 인스턴스
    en: Reserved Instances
    aliases: [RI, Reserved Instances, 예약, Azure Reservations, Azure 예약]
    short: 인스턴스 구성을 정해 1년이나 3년을 약정하고 받는 청구 할인이에요.
    analogy: 안 가도 매달 나가는 1년 회원권과 같아요.
    doc: cloud/pricing-models
  - id: spot-instance
    name: 스팟 인스턴스
    en: Spot Instances
    aliases: [Spot, 스팟, Azure Spot, 스팟 VM]
    short: 사업자의 남는 서버를 싸게 빌리되, 사업자가 필요하면 회수해 가는 서버예요.
    analogy: 예약 손님이 오면 비켜야 하는 마감 할인 자리와 같아요.
    doc: cloud/pricing-models
  - id: sp-utilization
    name: 약정 활용률
    en: Utilization
    aliases: [utilization, 활용률, 사용률, 약정 사용률]
    short: 산 약정 금액 중 실제로 쓴 몫의 비율이에요.
    doc: cloud/pricing-models
  - id: sp-coverage
    name: 약정 커버리지
    en: Coverage
    aliases: [coverage, 커버리지, 적용률, 약정 적용률]
    short: 할인 대상이 되는 사용 비용 중 약정이 덮은 몫의 비율이에요.
    doc: cloud/pricing-models
  - id: replication-instance
    name: 복제 인스턴스
    en: Replication instance
    aliases: [replication instance, DMS 인스턴스]
    short: DMS에서 데이터를 읽어 옮기는 일을 실제로 하는 관리형 서버예요.
    doc: cloud/database-migration
  - id: full-load
    name: 전체 적재
    en: Full load
    aliases: [full load, 풀 로드, 초기 적재]
    short: 원본 테이블의 데이터를 한꺼번에 읽어 대상에 넣는 단계예요.
    doc: cloud/database-migration
  - id: cdc
    name: 변경 데이터 캡처
    en: Change data capture
    aliases: [CDC, change data capture, 변경 캡처]
    short: 원본 DB의 변경 로그를 읽어 같은 변경을 다른 곳에 계속 옮기는 방식이에요.
    analogy: 이사 중 옛집에 온 택배를 적어 두었다가 새집으로 다시 보내는 일과 같아요.
    doc: cloud/database-migration
  - id: replication-slot
    name: 복제 슬롯
    en: Replication slot
    aliases: [replication slot, 논리 복제 슬롯, logical replication slot]
    short: 읽어 갈 쪽이 가져갈 때까지 PostgreSQL이 WAL을 지우지 않고 붙잡아 두는 표시예요.
    doc: cloud/database-migration
  - id: audit-log
    name: 감사 로그
    en: Audit log
    aliases: [audit log, CloudTrail, 감사 기록, 감사 추적]
    short: 클라우드 API를 누가, 언제, 어디서 불렀는지 남긴 기록이에요.
    analogy: 누가 몇 시에 어느 문으로 들어왔는지 적힌 출입 기록부와 같아요.
    doc: cloud/audit-logs
  - id: management-event
    name: 관리 이벤트
    en: Management event
    aliases: [management event, control plane event, 컨트롤 플레인 이벤트]
    short: 자원을 만들고 바꾸는 API 호출의 기록이에요. CloudTrail에 기본으로 남아요.
    doc: cloud/audit-logs
  - id: data-event
    name: 데이터 이벤트
    en: Data event
    aliases: [data event, data plane event, 데이터 플레인 이벤트]
    short: S3 객체 읽기처럼 자원 안의 데이터를 다루는 호출의 기록이에요. 켜야 남아요.
    doc: cloud/audit-logs
  - id: trail
    name: trail
    en: CloudTrail trail
    aliases: [트레일, 추적, CloudTrail trail]
    short: CloudTrail 기록을 S3 버킷 같은 곳으로 계속 내보내는 설정이에요.
    doc: cloud/audit-logs
  - id: activity-log
