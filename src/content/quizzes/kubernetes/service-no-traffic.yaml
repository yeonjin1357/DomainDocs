questions:
  - id: empty-endpoints
    type: choice
    prompt: 서비스 pay의 EndpointSlice를 봤더니 대상 파드 IP가 하나도 없어요. 먼저 볼 두 가지는?
    choices:
      - 셀렉터 오타와 준비 상태
      - targetPort와 containerPort
      - kube-proxy와 NetworkPolicy
      - 클러스터 DNS와 검색 도메인
    answer: 0
    explain: 셀렉터와 레이블이 조금만 달라도 대상이 0개가 돼요. readiness 프로브가 실패한 파드도 대상에서 빠져요.
  - id: target-port
    type: choice
    prompt: 이름도 풀리고 EndpointSlice에 파드 IP도 있는데 연결이 안 돼요. 다음에 볼 것은?
    choices:
      - 서비스의 targetPort
      - 클러스터 DNS의 처리 시간
      - 파드에 붙은 레이블 값
      - 노드의 Ready 조건
    answer: 0
    explain: targetPort가 앱이 실제로 듣는 포트와 다르면 요청이 파드에 닿아도 받을 곳이 없어요.
  - id: name-not-resolving
    type: choice
    prompt: 주문 파드 안에서 nslookup pay를 했더니 주소가 나오지 않아요. 어느 쪽을 먼저 볼까요?
    choices:
      - 서비스 이름과 클러스터 DNS
      - EndpointSlice의 파드 IP
      - 서비스의 targetPort
      - 노드의 kube-proxy
    answer: 0
    explain: 이름이 IP로 풀리지 않으면 뒤 단계는 볼 필요가 없어요. 같은 네임스페이스에 그 서비스가 있는지, 다른 이름도 안 풀리면 클러스터 DNS를 봐요.
  - id: direct-ok-service-fails
    type: choice
    prompt: EndpointSlice에 파드 IP가 있고, 그 IP와 포트로 직접 요청하면 돼요. 그런데 서비스 IP로는 안 돼요. 의심할 것은?
    choices:
      - 노드의 kube-proxy
      - 서비스 셀렉터와 레이블
      - 앱이 실제로 듣는 포트
      - 클러스터 DNS 서버
    answer: 0
    explain: 파드까지는 닿으니 앱과 포트는 괜찮고, 서비스 IP를 썼으니 DNS도 아니에요. 서비스 IP를 파드로 이어 주는 kube-proxy의 규칙 쪽이에요.
  - id: target-port-meaning
    type: ox
    prompt: 서비스의 port가 80이고 targetPort가 8080이에요. 파드 안의 앱은 8080에서 듣고 있어야 하나요?
    answer: true
    explain: port는 서비스가 받는 포트이고, targetPort는 파드로 넘길 때 쓰는 포트예요. 앱이 다른 포트에서 들으면 요청이 닿아도 받을 곳이 없어요.
