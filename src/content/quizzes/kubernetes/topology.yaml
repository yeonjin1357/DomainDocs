questions:
  - id: owner-edge
    type: choice
    prompt: 토폴로지 화면에서 ReplicaSet과 파드를 잇는 선의 근거가 되는 필드는?
    choices:
      - 파드의 ownerReferences
      - ReplicaSet의 selector
      - 파드의 spec.nodeName
      - EndpointSlice의 끝점
    answer: 0
    explain: ReplicaSet이 파드를 만들면 쿠버네티스가 파드의 ownerReferences에 주인을 적어요. 셀렉터는 레이블이 바뀌면 고르는 대상도 바뀌지만, 소유 관계는 파드에 적힌 연결이에요.
  - id: not-ready-edge
    type: ox
    prompt: 서비스와 파드 사이 선을 셀렉터만으로 그리면, 준비되지 않은 파드에도 선이 그어지나요?
    answer: true
    explain: 셀렉터는 레이블만 보고 골라서, 준비되지 않은 파드도 걸려요. 요청을 받는지는 EndpointSlice의 준비 상태로 그려야 해요.
  - id: endpointslice-split
    type: choice
    prompt: 끝점이 250개인 서비스에서, EndpointSlice를 하나만 읽어 서비스와 파드 사이 선을 그었어요. 화면은 어떻게 보일까요?
    choices:
      - 일부 파드로 가는 선이 빠져요
      - 모든 파드로 선이 그어져요
      - 선이 하나도 그어지지 않아요
      - 같은 파드에 선이 두 번 그어져요
    answer: 0
    explain: 슬라이스 하나에는 기본으로 끝점 100개까지 담겨서, 250개면 적어도 세 슬라이스에 나뉘어요. 서비스의 슬라이스를 모두 읽어야 해요.
  - id: two-replicasets
    type: choice
    prompt: 배포 중에 Deployment 하나 아래 ReplicaSet이 두 개 보여요. 왜일까요?
    choices:
      - 옛 버전과 새 버전이 함께 있어요
      - ReplicaSet이 두 번 잘못 만들어졌어요
      - 노드마다 ReplicaSet이 하나씩 생겨요
      - 서비스마다 ReplicaSet이 하나씩 생겨요
    answer: 0
    explain: 롤링 업데이트는 새 ReplicaSet을 늘리면서 옛 것을 줄여요. 배포가 끝나면 옛 ReplicaSet의 파드 수는 0이 돼요.
  - id: endpointslice-name
    type: input
    prompt: 서비스가 고른 파드의 주소와 준비 상태를 적어 두는 객체는?
    answer: [EndpointSlice, 엔드포인트슬라이스, endpoint slice]
    explain: 슬라이스 하나에는 기본으로 끝점 100개까지 담겨요. 파드가 많으면 슬라이스가 여러 개예요.
