questions:
  - id: insufficient-cpu-idle-node
    type: choice
    prompt: 노드 CPU 사용률은 30%로 한가한데, 새 파드가 insufficient cpu로 Pending이에요. 왜일까요?
    choices:
      - 요청 합계로 자리를 따져서
      - CPU 한도 합계로 자리를 따져서
      - 최근 5분 최대 사용량으로 따져서
      - 노드 CPU가 스로틀링돼서
    answer: 0
    explain: 스케줄러는 실제 사용량이 아니라 요청 합계로 자리를 따져요. 요청을 실제 사용량에 맞게 줄이는 것도 방법이에요.
  - id: taint-blocks
    type: choice
    prompt: 자리는 남는데, 특정 노드에만 파드가 놓이지 않아요. 먼저 볼 것은?
    choices:
      - 그 노드의 taint
      - 그 노드의 디스크 사용률
      - 파드의 재시작 횟수
      - 파드의 이미지 태그
    answer: 0
    explain: taint가 있는 노드에는 맞는 toleration이 없는 파드가 놓이지 않아요. nodeSelector의 레이블 오타도 함께 봐요.
  - id: pvc-not-bound
    type: choice
    prompt: 파드가 100Gi PVC를 쓰는데, 자동으로 만들어 주는 저장소 설정 없이 50Gi짜리 PV만 있어요. 어떻게 될까요?
    choices:
      - 파드가 Pending으로 기다려요
      - 50Gi만 붙여서 시작해요
      - PV가 저절로 100Gi로 커져요
      - 저장소 없이 먼저 시작해요
    answer: 0
    explain: 맞는 볼륨이 없으면 PVC가 PV에 묶이지 않은 채로 남고, 파드도 기다려요. kubectl get pvc의 STATUS가 Pending인지 봐요.
  - id: selector-typo
    type: ox
    prompt: 파드의 nodeSelector에 적은 레이블 값에 오타가 있으면, 자리가 남는 노드가 있어도 파드는 Pending에 머무나요?
    answer: true
    explain: 그 레이블이 붙은 노드가 없으니 놓을 곳이 없어요. 노드의 Labels와 파드의 nodeSelector를 견줘 봐요.
  - id: image-pull-waiting
    type: choice
    prompt: 노드는 정해졌는데 컨테이너가 Waiting에 머물러 있어요. 가장 흔한 원인은?
    choices:
      - 이미지를 받지 못했어요
      - 노드 요청 합계가 꽉 찼어요
      - 노드에 taint가 있어요
      - 서비스 셀렉터가 틀렸어요
    answer: 0
    explain: 노드가 정해진 뒤라 자리 문제는 아니에요. 이미지 이름과 태그, 사설 레지스트리 인증 정보를 봐요.
