questions:
  - id: drain-retries
    type: ox
    prompt: kubectl drain은 PDB 때문에 축출이 거절되면, 그 파드를 지우지 않고 잠시 뒤 다시 요청하나요?
    answer: true
    explain: API 서버는 PDB 여유가 없으면 429로 거절해요. drain은 그 응답을 받으면 잠시 뒤 다시 요청하며 기다려요.
  - id: rolling-update-pdb
    type: ox
    prompt: Deployment의 롤링 업데이트는 PDB가 허락하는 수만큼만 파드를 내리나요?
    answer: false
    explain: 롤링 업데이트로 빠진 파드도 PDB의 셈에는 들어가지만, 롤링 업데이트 자체는 PDB에 막히지 않아요. 속도는 Deployment의 설정이 정해요.
  - id: single-replica
    type: choice
    prompt: 복제본이 1개인 Deployment에 minAvailable 1인 PDB가 있어요. 그 파드가 있는 노드를 drain하면?
    choices: [drain이 끝나지 않아요, 파드가 다른 노드로 옮겨요, PDB가 저절로 풀려요, 노드가 NotReady가 돼요]
    answer: 0
    explain: 하나도 내보낼 수 없는 PDB라 축출이 계속 거절돼요. 복제본을 늘리거나, PDB를 두지 않고 점검 때 잠깐 멈추는 것을 받아들여요.
  - id: daemonset-flag
    type: choice
    prompt: drain이 DaemonSet 파드 때문에 진행되지 않아요. 보통 붙이는 옵션은?
    choices: [--ignore-daemonsets, --delete-emptydir-data, --disable-eviction, --force]
    answer: 0
    explain: DaemonSet 파드는 지워도 바로 다시 만들어져서, 남겨 두고 넘어가는 --ignore-daemonsets를 붙여요.
  - id: cordon-name
    type: input
    prompt: 이미 도는 파드는 그대로 두고, 노드에 새 파드만 오지 않게 막는 kubectl 명령은?
    answer: [cordon, kubectl cordon]
    explain: cordon을 하면 노드 상태에 SchedulingDisabled가 붙어요. 점검이 끝나면 uncordon으로 되돌려요.
