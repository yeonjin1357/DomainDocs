questions:
  - id: which-source-restarts
    type: choice
    prompt: 파드가 몇 번 다시 시작했는지, Deployment의 준비된 복제 수가 몇인지 같은 지표는 어디서 올까요?
    choices:
      - kube-state-metrics
      - kubelet의 cAdvisor
      - Metrics Server
      - node_exporter
    answer: 0
    explain: kube-state-metrics는 API 서버에 적힌 객체의 상태를 지표로 바꿔요. 실제 사용량은 재지 않아요.
  - id: working-set
    type: ox
    prompt: container_memory_usage_bytes는 kubectl top이 보여 주는 메모리와 같은 값인가요?
    answer: false
    explain: usage는 캐시까지 넣어 세서 더 크게 나와요. kubectl top과 자동 확장은 working set을 봐요.
  - id: metrics-server-storage
    type: ox
    prompt: Metrics Server를 모니터링 화면의 데이터 저장소로 써서 지난 일주일 그래프를 그려도 되나요?
    answer: false
    explain: Metrics Server는 자동 확장용 최근 값만 들고 있어요. README도 모니터링에는 kubelet에서 직접 모으라고 해요.
  - id: double-count
    type: choice
    prompt: 파드별 메모리를 cAdvisor 지표로 그대로 더했더니 실제의 두 배 가까이 나와요. 무엇을 의심할까요?
    choices:
      - 컨테이너 줄과 함께 파드 전체를 합친 줄도 더해졌어요
      - 메모리 단위가 KiB와 KB로 섞였어요
      - kube-state-metrics가 값을 두 번 보냈어요
      - 노드의 스왑이 켜져 있어요
    answer: 0
    explain: cAdvisor에는 이미지가 없는 상위 cgroup 줄도 있어요. image!="" 같은 조건으로 컨테이너 줄만 골라 더해요.
  - id: cpu-usage-meaning
    type: choice
    prompt: rate(container_cpu_usage_seconds_total[5m])의 값이 0.5예요. 무슨 뜻일까요?
    choices:
      - 그 컨테이너가 코어 반 개만큼 CPU를 쓰고 있어요
      - CPU 사용률이 0.5%예요
      - 5분 동안 0.5초만 실행됐어요
      - CPU 요청의 절반을 쓰고 있어요
    answer: 0
    explain: 쓴 CPU 시간(초)의 초당 증가량이라, 1초에 0.5초씩 썼다는 뜻이에요. 요청과 견주려면 요청 값으로 나눠요.
