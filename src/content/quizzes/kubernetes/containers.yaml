questions:
  - id: shared-kernel
    type: ox
    prompt: 한 서버에서 컨테이너 10개가 돌면, 10개가 그 서버의 커널 하나를 함께 쓰나요?
    answer: true
    explain: 컨테이너는 서버의 커널을 함께 쓰고, 보이는 것만 나눠요. 그래서 가볍지만, 저마다 운영체제를 돌리는 가상 머신보다 격리가 느슨해요.
  - id: namespace-isolation
    type: choice
    prompt: 컨테이너 안의 프로세스가 서버의 다른 프로세스를 보지 못하는 건 무엇 덕분일까요?
    choices:
      - 리눅스 네임스페이스
      - cgroup
      - 쿠버네티스 네임스페이스
      - 하이퍼바이저
    answer: 0
    explain: 리눅스 네임스페이스가 프로세스 번호 같은 자원을 따로 보이게 감싸요. 쿠버네티스 네임스페이스는 객체를 나누는 이름 묶음이고, cgroup은 자원을 제한해요.
  - id: cgroup-name
    type: input
    prompt: 컨테이너가 쓸 수 있는 CPU와 메모리를 묶어 제한하고 재는 리눅스 커널 기능은?
    answer: [cgroup]
    term: kubernetes/cgroup
    explain: 그래서 컨테이너의 CPU·메모리 숫자는 서버 전체가 아니라 그 컨테이너의 cgroup이 센 값으로 봐요.
  - id: latest-risk
    type: choice
    prompt: 운영 배포가 app:latest를 가리켜요. 지난주에 뜬 파드와 오늘 뜬 파드가 서로 다른 코드를 돌려요. 왜 그럴까요?
    choices:
      - 그사이 latest가 새 이미지를 가리키게 됐어요
      - latest는 노드마다 마지막에 받은 이미지예요
      - 파드가 뜰 때마다 이미지를 다시 빌드해요
      - 다이제스트는 띄울 때마다 새로 정해져요
    answer: 0
    explain: 태그는 옮길 수 있는 이름표라, 같은 latest가 다른 이미지를 가리킬 수 있어요. 정확히 같은 이미지를 원하면 내용의 지문인 다이제스트로 가리켜요.
  - id: xmx-equals-limit
    type: ox
    prompt: 컨테이너 메모리 한도와 자바의 -Xmx를 똑같이 2GiB로 잡으면, JVM 프로세스 전체도 2GiB 안에서 도나요?
    answer: false
    explain: -Xmx는 힙의 한도예요. JVM은 스레드 스택처럼 힙 밖에서도 메모리를 써서, 프로세스 전체로는 한도를 넘길 수 있어요.
