questions:
  - id: progress-deadline
    type: choice
    prompt: Deployment가 진전이 없을 때 멈췄다고 표시하기까지, 기본으로 얼마나 기다릴까요?
    choices:
      - 10분
      - 1분
      - 5분
      - 1시간
    answer: 0
    explain: progressDeadlineSeconds 기본값은 600초예요. 넘으면 Progressing 조건이 False, 이유는 ProgressDeadlineExceeded가 돼요.
  - id: no-auto-rollback
    type: ox
    prompt: 배포가 멈췄다고 표시되면, 쿠버네티스가 저절로 이전 버전으로 되돌리나요?
    answer: false
    explain: 쿠버네티스는 멈췄다고 표시만 하고 계속 다시 시도해요. 되돌리기는 사람이나 배포 파이프라인이 해요.
  - id: running-not-ready-rollout
    type: choice
    prompt: 새 버전 파드가 Running인데 READY가 0/1이라 배포가 멈췄어요. 먼저 볼 것은?
    choices:
      - readiness 실패 이유
      - 노드에 남은 요청 자리
      - 이미지를 받는 데 걸린 시간
      - HPA의 최대 파드 수
    answer: 0
    explain: 준비되지 않은 파드는 요청을 받지 않고, Deployment도 다음 파드로 넘어가지 않아요. 이번 배포에서 바뀐 프로브 경로·포트·설정부터 봐요.
  - id: undo-first
    type: choice
    prompt: 원인을 찾는 동안 사용자 영향을 줄이고 싶어요. 먼저 할 일은?
    choices:
      - 이전 버전으로 되돌려요
      - 옛 버전 파드를 지워요
      - 파드 수를 0으로 줄여요
      - 새 파드를 계속 기다려요
    answer: 0
    explain: kubectl rollout undo로 되돌려요. 되돌리기도 롤링 업데이트라 준비된 옛 파드를 늘리고 새 파드를 줄여요.
  - id: apply-not-done
    type: ox
    prompt: kubectl apply로 Deployment의 이미지를 바꾸면, 명령은 새 파드가 모두 준비될 때까지 기다렸다가 끝나나요?
    answer: false
    explain: 명령은 원하는 상태를 적고 바로 끝나요. 새 파드가 모두 준비됐는지는 kubectl rollout status로 확인해요.
