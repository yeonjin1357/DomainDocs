questions:
  - id: running-may-restart
    type: ox
    prompt: 파드 단계가 Running이면, 컨테이너가 재시작을 되풀이하고 있지 않다고 볼 수 있나요?
    answer: false
    explain: Running에는 재시작 중인 경우도 들어가요. 재시작 횟수와 Ready를 함께 봐요.
  - id: backoff-doubling
    type: choice
    prompt: 계속 죽는 컨테이너를 다시 띄우기 전에 기다리는 시간은 어떻게 늘어날까요?
    choices:
      - 10초, 20초, 40초처럼 두 배씩 늘어 최대 5분까지
      - 매번 10초로 같아요
      - 1분씩 늘어 끝없이 길어져요
      - 기다리지 않고 바로 다시 띄워요
    answer: 0
    explain: 바로 계속 띄우면 노드에 부담이 커서 간격을 늘려요. 10분 동안 문제없이 돌면 처음 간격으로 돌아가요.
  - id: readiness-fails
    type: choice
    prompt: readiness 프로브가 실패하면 어떻게 될까요?
    choices:
      - 서비스가 그 파드로 요청을 보내지 않아요
      - 컨테이너를 다시 시작해요
      - 파드를 지우고 새로 만들어요
      - 파드를 다른 노드로 옮겨요
    answer: 0
    explain: readiness는 요청을 받을 준비가 됐는지 보는 검사라, 실패해도 다시 시작하지는 않아요. 다시 시작하는 건 liveness예요.
  - id: liveness-external-dep
    type: ox
    prompt: liveness 프로브가 데이터베이스까지 확인하게 해 두면, DB가 잠깐 아플 때 멀쩡한 파드까지 한꺼번에 다시 시작될 수 있나요?
    answer: true
    explain: liveness는 앱 자신이 건강한지만 봐요. 바깥 서비스 확인은 readiness에 맡겨요.
  - id: crashloop-logs
    type: choice
    prompt: CrashLoopBackOff 상태인 컨테이너의 원인을 찾으려면 무엇부터 볼까요?
    choices:
      - kubectl logs --previous로 본 이전 실행의 로그
      - 노드의 디스크 사용률
      - 서비스의 셀렉터
      - 인그레스 규칙
    answer: 0
    explain: CrashLoopBackOff는 계속 죽고 있다는 표시일 뿐이에요. 원인은 이미 죽은 이전 실행의 로그와 종료 코드에 있어요.
