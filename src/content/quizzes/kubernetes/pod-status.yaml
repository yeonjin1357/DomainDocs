questions:
  - id: running-may-restart
    type: choice
    prompt: Deployment의 파드에서 컨테이너가 죽었다 다시 뜨기를 몇 분째 되풀이해요. 이 파드의 단계(phase)는?
    choices:
      - Running
      - Failed
      - Pending
      - Unknown
    answer: 0
    explain: Running에는 재시작 중인 경우도 들어가요. 그래서 단계만 보지 말고 재시작 횟수와 Ready를 함께 봐요.
  - id: backoff-doubling
    type: choice
    prompt: 계속 죽는 컨테이너를 다시 띄우기 전에 기다리는 시간은 어떻게 늘어날까요?
    choices:
      - 두 배씩 늘어 최대 5분까지
      - 두 배씩 늘어 끝없이 길어져요
      - 10초씩 늘어 최대 1분까지
      - 늘 10초로 같아요
    answer: 0
    explain: 10초, 20초, 40초처럼 두 배씩 늘고 5분에서 멈춰요. 10분 동안 문제없이 돌면 처음 간격으로 돌아가요.
  - id: readiness-fails
    type: ox
    prompt: readiness 프로브가 계속 실패해도, kubelet은 그 컨테이너를 다시 시작하지 않나요?
    answer: true
    explain: readiness가 실패하면 서비스 대상에서 빠질 뿐이에요. 컨테이너를 다시 시작하는 건 liveness 프로브예요.
  - id: liveness-external-dep
    type: choice
    prompt: liveness 프로브가 앱의 DB 연결까지 확인해요. DB가 몇 분 멈추면 어떻게 될까요?
    choices:
      - 멀쩡한 파드까지 모두 다시 시작돼요
      - DB를 쓰는 파드만 서비스에서 빠져요
      - 프로브가 DB 문제는 따로 무시해요
      - DB가 저절로 다시 시작돼요
    answer: 0
    explain: 모든 파드의 liveness가 함께 실패해서 한꺼번에 다시 시작돼요. 바깥 의존성은 readiness로 보고, liveness는 앱 자신만 봐요.
  - id: crashloop-logs
    type: choice
    prompt: CrashLoopBackOff 상태인 컨테이너의 원인을 찾으려면 무엇부터 볼까요?
    choices:
      - 이전 실행의 로그와 종료 이유
      - 파드의 재시작 횟수 그래프
      - 노드의 CPU·메모리 사용률
      - 서비스의 엔드포인트 목록
    answer: 0
    explain: CrashLoopBackOff는 계속 죽고 있다는 표시일 뿐이에요. 원인은 이미 죽은 실행에 남아서, kubectl logs --previous로 봐요.
