questions:
  - id: events-expire
    type: ox
    prompt: 이벤트를 따로 모으지 않는 기본 설정의 클러스터예요. 새벽 2시에 생긴 이벤트는 3시 반이면 이미 지워지고 없나요?
    answer: true
    explain: 이벤트는 기본 1시간 뒤 지워져요. 그래서 운영에서는 이벤트를 모니터링 시스템이나 로그 저장소로 옮겨 둬요.
  - id: warnings-first
    type: choice
    prompt: 이벤트가 너무 많아서 원인이 보이지 않아요. 먼저 할 일은?
    choices:
      - Warning만 골라 봐요
      - Normal만 골라 봐요
      - 가장 최근 것만 봐요
      - 대상별로 개수를 세요
    answer: 0
    explain: 이벤트 대부분은 정상 기록이에요. 경고만 골라 시간 순서로 봐야 원인 쪽 기록이 묻히지 않아요.
  - id: failed-scheduling-next
    type: choice
    prompt: 경고 이벤트의 이유가 FailedScheduling이에요. 다음에 볼 곳은?
    choices:
      - 노드 요청 합계와 taint
      - 이전 실행의 컨테이너 로그
      - 볼륨을 붙이는 설정
      - readiness 프로브 설정
    answer: 0
    explain: FailedScheduling은 스케줄러가 놓을 노드를 못 찾았다는 뜻이에요. 메시지에 노드 몇 개가 왜 안 되는지 적혀 있어요.
  - id: alert-on-reason
    type: choice
    prompt: 이벤트로 알림을 건다면 무엇을 기준으로 거는 게 나을까요?
    choices:
      - 이유와 대상
      - 메시지의 문구
      - 이벤트의 개수
      - 이벤트의 시각
    answer: 0
    explain: 쿠버네티스 문서는 이벤트의 문구와 계기가 바뀔 수 있다고 해요. 그래서 문구보다 이유(reason)와 대상으로 거는 편이 나아요.
  - id: backoff-message
    type: choice
    prompt: 이유가 BackOff인 경고 이벤트의 메시지에 pulling image가 들어 있어요. 다음에 볼 곳은?
    choices:
      - 이미지 이름·태그와 인증 정보
      - 이전 실행의 컨테이너 로그
      - 노드 요청 합계와 taint
      - readiness 프로브 설정
    answer: 0
    explain: BackOff는 재시작과 이미지 받기 두 곳에서 함께 써요. pulling image가 있으면 이미지를 받지 못해 다시 받기를 미루는 중이에요.
