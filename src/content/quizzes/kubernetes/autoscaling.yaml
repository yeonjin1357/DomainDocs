questions:
  - id: hpa-calc
    type: choice
    prompt: 파드 4개의 평균 CPU 사용률이 90%이고, HPA 목표는 60%예요. HPA가 원하는 파드 수는?
    choices:
      - 6개
      - 5개
      - 4개
      - 8개
    answer: 0
    explain: 원하는 파드 수는 올림(지금 파드 수 × 지금 값 ÷ 목표 값)이에요. 4 × 90 ÷ 60 = 6개예요.
  - id: utilization-of-request
    type: ox
    prompt: HPA의 CPU 사용률 60%는 노드 CPU의 60%를 뜻하나요?
    answer: false
    explain: 컨테이너가 요청한 CPU 대비 퍼센트예요. 요청이 0.5코어인데 0.3코어를 쓰면 60%예요.
  - id: hpa-not-moving
    type: choice
    prompt: HPA를 만들었는데 파드 수가 전혀 바뀌지 않아요. 먼저 볼 것은?
    choices:
      - 컨테이너에 CPU 요청이 있는지와 Metrics Server가 도는지
      - 노드의 디스크 사용률
      - 서비스의 셀렉터
      - 이미지 태그
    answer: 0
    explain: 요청이 없으면 사용률을 계산하지 못해요. CPU·메모리 사용량은 따로 설치하는 Metrics Server가 HPA에 줘요.
  - id: slow-scale-down
    type: choice
    prompt: 부하가 끝났는데도 파드 수가 한동안 그대로예요. 기본 설정에서 그 이유는?
    choices:
      - 줄일 때는 5분 동안 지켜본 뒤에 줄여서
      - HPA가 고장 나서
      - 한 번 늘린 파드는 줄일 수 없어서
      - 늘릴 때와 줄일 때 계산식이 달라서
    answer: 0
    explain: 줄일 때는 지난 5분 동안 계산한 값 중 가장 큰 값을 따라요. 부하가 잠깐 내려갔다 오를 때 출렁이지 않게 하려는 거예요.
  - id: scaled-but-pending
    type: choice
    prompt: HPA가 파드를 늘렸는데 새 파드가 Pending이에요. 먼저 의심할 것은?
    choices:
      - 노드에 자리가 없어요
      - HPA 목표 값이 너무 낮아요
      - Metrics Server가 멈췄어요
      - 서비스가 새 파드를 몰라요
    answer: 0
    explain: HPA는 파드만 늘려요. 놓을 자리가 없으면 노드 자동 확장이 노드를 붙일 때까지 기다려요.
