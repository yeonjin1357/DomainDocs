questions:
  - id: cronjob-ok-job-failed
    type: ox
    prompt: CronJob에 에러 표시가 없으면, 그 일정의 일도 성공했다고 봐도 되나요?
    answer: false
    explain: CronJob은 일정마다 Job을 만들 뿐이에요. 일이 성공했는지는 그 시각에 만들어진 Job의 조건을 봐야 해요.
  - id: deadline-vs-backoff
    type: choice
    prompt: backoffLimit은 6, activeDeadlineSeconds는 600인 Job이 3번 실패한 채 10분이 지났어요. 어떻게 될까요?
    choices:
      - 재시도가 남았어도 DeadlineExceeded로 실패해요
      - 재시도를 마저 다 한 뒤 실패해요
      - 시간 한도는 무시하고 계속 재시도해요
      - 처음부터 다시 6번 재시도해요
    answer: 0
    explain: 시간 한도가 재시도 한도보다 먼저예요. 시간 한도에 닿으면 돌던 파드를 멈추고 실패로 끝내요.
  - id: timezone
    type: choice
    prompt: schedule이 0 2 * * *인 CronJob이 한국 시간 오전 11시에 돌아요. 가장 그럴듯한 이유는?
    choices:
      - timeZone을 적지 않아 UTC로 도는 컨트롤러의 시간대를 따랐어요
      - 앞 Job이 9시간 동안 돌아서 밀렸어요
      - backoffLimit을 다 써서 늦게 시작했어요
      - 일정 문자열을 잘못 읽어 9시간 뒤로 밀렸어요
    answer: 0
    explain: 시간대를 적지 않으면 kube-controller-manager의 시간대로 해석해요. UTC 2시는 한국 시간 11시라, timeZone에 Asia/Seoul을 적어요.
  - id: forbid-skip
    type: choice
    prompt: 매시간 도는 일이 90분 걸리는데, 두 실행이 겹치지 않게 하려면 concurrencyPolicy를 무엇으로 둘까요?
    choices:
      - Forbid
      - Allow
      - Replace
      - Never
    answer: 0
    explain: Forbid는 앞 Job이 돌고 있으면 새 실행을 건너뛰어요. 기본값 Allow는 겹쳐 돌리고, Replace는 앞 Job을 멈춰요.
  - id: last-success-metric
    type: input
    prompt: kube-state-metrics에서 CronJob이 마지막으로 성공한 시각을 담은 지표 이름은?
    answer: [kube_cronjob_status_last_successful_time]
    explain: 이 시각이 일정 간격보다 오래되면 알리면, 실패한 날과 아예 안 돈 날을 함께 잡아요.
