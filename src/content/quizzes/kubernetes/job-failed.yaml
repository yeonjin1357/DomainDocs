questions:
  - id: job-not-created
    type: choice
    prompt: 새벽 2시 CronJob의 결과가 없어요. 확인해 보니 그 시각의 Job이 아예 만들어지지 않았어요. 다음에 볼 곳은?
    choices:
      - CronJob의 일정과 이벤트
      - 실패한 파드의 로그
      - Job의 backoffLimit
      - Job의 실패 이유
    answer: 0
    explain: Job이 없으면 CronJob 쪽이에요. 시간대, suspend, 겹침 설정 때문에 건너뛴 이유가 CronJob의 이벤트에 남아요.
  - id: deadline-vs-backoff
    type: choice
    prompt: backoffLimit은 6, activeDeadlineSeconds는 600인 Job이 3번 실패한 채 10분이 지났어요. 어떻게 될까요?
    choices:
      - DeadlineExceeded로 실패해요
      - BackoffLimitExceeded로 실패해요
      - 남은 3번을 마저 시도해요
      - 처음부터 6번을 다시 시도해요
    answer: 0
    explain: 시간 한도가 재시도 한도보다 먼저예요. 재시도가 남았어도 시간 한도에 닿으면 돌던 파드를 멈추고 실패로 끝내요.
  - id: timezone
    type: choice
    prompt: schedule이 0 2 * * *인 CronJob이 한국 시간 오전 11시에 돌아요. 가장 그럴듯한 이유는?
    choices:
      - timeZone이 비어 UTC로 해석돼서
      - 앞 Job이 9시간 동안 돌아서 밀려서
      - startingDeadlineSeconds를 넘겨 밀려서
      - 노드의 시계가 9시간 틀려 있어서
    answer: 0
    explain: 시간대를 적지 않으면 kube-controller-manager의 시간대로 해석해요. UTC 2시는 한국 시간 11시라, timeZone에 Asia/Seoul을 적어요.
  - id: forbid-skip
    type: choice
    prompt: 매시간 도는 일이 90분 걸리는데, 두 실행이 겹치지 않게 하려면 concurrencyPolicy를 무엇으로 둘까요?
    choices:
      - Forbid
      - Allow
      - Replace
      - Never
    answer: 0
    explain: Forbid는 앞 Job이 돌고 있으면 새 실행을 건너뛰어요. 기본값 Allow는 겹쳐 돌리고, Replace는 앞 Job을 멈춰요.
  - id: last-success-alert
    type: choice
    prompt: 하루 한 번 도는 CronJob에서, 일이 실패한 날과 아예 안 돈 날을 함께 잡는 알림은?
    choices:
      - 마지막 성공 시각이 26시간보다 오래되면
      - Job에 Failed 조건이 하나라도 생기면
      - CronJob 상태가 에러로 바뀌면
      - 파드의 재시작 횟수가 늘면
    answer: 0
    explain: 실패 알림만 걸면 Job이 안 만들어진 날을 놓쳐요. kube-state-metrics의 kube_cronjob_status_last_successful_time으로 마지막 성공 시각을 봐요.
