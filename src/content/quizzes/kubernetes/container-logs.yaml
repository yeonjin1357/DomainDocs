questions:
  - id: file-not-collected
    type: ox
    prompt: 앱이 컨테이너 안의 /app/logs/app.log 파일에만 로그를 쓰면, kubectl logs로 그 내용을 볼 수 있나요?
    answer: false
    explain: kubectl logs는 앱이 stdout과 stderr로 내보낸 것만 보여 줘요. 컨테이너 안 파일은 노드의 로그 파일로 옮겨지지 않아요.
  - id: pod-deleted
    type: ox
    prompt: 파드가 지워지면, 그 파드의 컨테이너 로그 파일도 노드에서 함께 지워지나요?
    answer: true
    explain: 파드가 지워지거나 축출되면 컨테이너와 로그도 함께 지워져요. 노드 밖으로 보내 둔 로그만 남아요.
  - id: window
    type: choice
    prompt: 초당 1MB씩 로그를 쓰는 컨테이너가 있어요. kubelet 기본 설정이면 노드에 남는 로그는 최대 몇 초 치일까요?
    choices: [약 50초, 약 10초, 약 8분, 약 1시간]
    answer: 0
    explain: 기본은 10Mi 파일 5개라 약 50MiB예요. 초당 1MB면 50초 남짓이면 가장 오래된 것부터 지워져요.
  - id: previous
    type: choice
    prompt: 컨테이너가 두 번 재시작했어요. kubectl logs --previous가 보여 주는 것은?
    choices: [바로 전 컨테이너의 로그, 처음 컨테이너의 로그, 세 컨테이너의 로그 모두, 노드 kubelet의 로그]
    answer: 0
    explain: kubelet은 끝난 컨테이너를 하나만 남겨서, --previous는 바로 전 것만 보여 줘요. 그보다 앞은 노드 밖에 모아 둔 로그에서 봐요.
  - id: daemonset-agent
    type: input
    prompt: 노드마다 하나씩 떠서 그 노드의 로그 파일을 읽어 보내는 에이전트를 띄울 때 쓰는 워크로드 종류는?
    answer: [DaemonSet, 데몬셋]
    term: kubernetes/daemonset
    explain: DaemonSet은 노드마다 파드를 하나씩 띄워요. 노드가 늘어도 에이전트가 저절로 따라 떠요.
