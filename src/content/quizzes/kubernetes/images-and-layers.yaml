questions:
  - id: delete-later-layer
    type: ox
    prompt: Dockerfile에서 50MB 파일을 만드는 RUN과 그 파일을 지우는 RUN을 따로 두면, 이미지에 50MB가 그대로 남나요?
    answer: true
    explain: 지우는 레이어에는 '없음' 표시만 담기고, 50MB를 만든 레이어는 그대로 남아요. 만든 RUN 안에서 함께 지워야 작아져요.
  - id: shared-base
    type: choice
    prompt: 같은 alpine 베이스로 만든 이미지 두 개를 한 노드에 받으면, 베이스 레이어는 한 번만 받아요. 무엇이 같아서일까요?
    choices:
      - 레이어의 다이제스트
      - 베이스 이미지의 태그
      - 이미지를 만든 Dockerfile
      - 이미지를 받은 레지스트리
    answer: 0
    explain: 레이어는 내용으로 만든 지문인 다이제스트로 가리켜요. 내용이 같으면 지문도 같아서, 노드에 이미 있는 레이어는 다시 받지 않아요.
  - id: cow-where
    type: choice
    prompt: 실행 중인 컨테이너가 이미지에 있던 /etc/motd를 고치면, 고친 파일은 어디에 남을까요?
    choices:
      - 그 컨테이너의 쓰기 레이어
      - 이미지의 맨 위 레이어
      - /etc/motd가 담긴 원래 레이어
      - 같은 이미지의 컨테이너가 함께 쓰는 레이어
    answer: 0
    explain: 고칠 때 파일을 쓰기 레이어로 복사한 뒤 고쳐요. 이미지 레이어는 읽기 전용이라 그대로고, 다른 컨테이너에 영향이 없어요.
  - id: pull-policy-default
    type: choice
    prompt: app:1.4를 고쳐 같은 태그로 레지스트리에 다시 올렸어요. imagePullPolicy를 적지 않았다면, 옛 이미지가 있는 노드에서 새 파드는 무엇으로 뜰까요?
    choices:
      - 노드에 있던 옛 이미지
      - 레지스트리의 새 이미지
      - 바뀐 레이어만 새것인 이미지
      - 아무것도 못 뜨고 ImagePullBackOff
    answer: 0
    explain: latest가 아닌 태그는 기본 정책이 IfNotPresent라, 노드에 있으면 다시 받지 않아요. 그래서 같은 태그를 덮어쓰지 말고 새 태그를 붙여요.
  - id: cow-name
    type: input
    prompt: 아래 층의 파일을 고칠 때 위 층으로 복사한 뒤 고치는 방식을 무엇이라고 할까요?
    answer: [쓸 때 복사, copy-on-write, CoW, 카피 온 라이트]
    term: kubernetes/copy-on-write
    explain: 그래서 같은 이미지로 띄운 컨테이너들이 읽기 전용 레이어를 함께 써도 서로 영향을 주지 않아요.
