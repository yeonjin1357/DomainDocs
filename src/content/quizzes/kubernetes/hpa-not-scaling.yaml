questions:
  - id: unknown-target
    type: choice
    prompt: TARGETS가 unknown인 HPA의 이벤트에 missing request for cpu in container app이 나와요. 알맞은 조치는?
    choices:
      - app 컨테이너에 CPU 요청을 적어요
      - Metrics Server를 다시 설치해요
      - maxReplicas를 늘려요
      - 목표 사용률을 낮춰요
    answer: 0
    explain: 사용률은 요청 대비라, 컨테이너 하나라도 CPU 요청이 없으면 계산할 수 없어요. 메시지가 어느 컨테이너인지 알려 줘요.
  - id: too-many-replicas
    type: choice
    prompt: 파드 4개의 평균 CPU 사용률이 90%, 목표가 60%, maxReplicas가 4예요. ScalingLimited 조건의 이유는?
    choices:
      - TooManyReplicas
      - FailedGetResourceMetric
      - ScaleDownStabilized
      - BackoffLimitExceeded
    answer: 0
    explain: 계산하면 6개가 필요하지만 최대값이 4라서 막혀요. 계산한 수가 최대값보다 크면 TooManyReplicas예요.
  - id: hpa-did-its-job
    type: choice
    prompt: HPA가 원하는 파드 수를 8로 올렸는데, 준비된 파드는 4개 그대로예요. 먼저 볼 것은?
    choices:
      - 새 파드가 Pending인지
      - HPA의 목표 사용률
      - Metrics Server가 도는지
      - HPA의 maxReplicas
    answer: 0
    explain: HPA는 할 일을 했어요. 새 파드가 자리가 없어 Pending인지, 할당량에 막혀 아예 안 만들어졌는지를 봐요.
  - id: big-request
    type: choice
    prompt: CPU 요청을 2코어로 잡은 앱이 0.8코어를 쓰며 느려졌어요. 목표 사용률 60%인 HPA가 안 늘리는 이유는?
    choices:
      - 사용률이 40%라 목표보다 낮아서
      - Metrics Server가 사용량을 못 읽어서
      - maxReplicas에 이미 닿아서
      - 허용 범위 0.1 안이라 그대로 둬서
    answer: 0
    explain: 사용률은 요청 대비예요. 요청을 실제보다 크게 잡으면 사용률이 낮게 나와 HPA가 늦게 늘려요.
  - id: replicas-in-manifest
    type: ox
    prompt: HPA를 쓰는 Deployment 매니페스트에 replicas 3을 남겨 두면, kubectl apply할 때마다 파드 수가 3으로 돌아가나요?
    answer: true
    explain: apply가 replicas를 매니페스트 값으로 되돌려요. 쿠버네티스 문서는 HPA를 쓰면 이 값을 매니페스트에서 빼라고 권해요.
