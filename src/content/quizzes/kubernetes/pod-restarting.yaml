questions:
  - id: exit-137
    type: choice
    prompt: 직전 종료 이유가 OOMKilled이고 종료 코드가 137이에요. 137은 흔히 어떻게 읽을까요?
    choices:
      - 128에 신호 9를 더한 값
      - 메모리를 137MiB 쓴 값
      - 137번째 재시작이라는 뜻
      - 앱이 직접 정한 에러 코드
    answer: 0
    explain: 신호를 받아 끝난 프로세스의 종료 코드는 흔히 128 + 신호 번호로 읽어요. 9는 강제 종료 신호예요.
  - id: same-size-oom
    type: choice
    prompt: 컨테이너가 매번 같은 메모리 크기에서 OOMKilled로 끝나요. 알맞은 조치는?
    choices:
      - 한도를 필요한 만큼 늘려요
      - 메모리 누수부터 찾아요
      - liveness 프로브를 꺼요
      - 노드를 더 붙여요
    answer: 0
    explain: 매번 같은 크기라면 앱이 원래 그만큼 필요한 거예요. 한도를 늘리거나 앱의 메모리 설정을 줄이고, 실행할수록 바닥이 높아질 때 누수를 의심해요.
  - id: oom-with-free-node
    type: ox
    prompt: 노드 메모리가 넉넉히 남아 있어도, 컨테이너가 자기 메모리 한도를 넘으면 OOMKilled로 끝나나요?
    answer: true
    explain: 컨테이너 메모리 한도는 노드 여유와 상관없이 걸려요. 그래서 노드를 늘려도 OOMKilled는 그대로예요.
  - id: all-pods-restart
    type: choice
    prompt: 같은 Deployment의 파드가 모두 함께 재시작하기 시작했어요. 먼저 볼 것은?
    choices:
      - 모두에게 함께 일어난 변화
      - 가장 많이 재시작한 파드의 로그
      - 노드 하나의 디스크 사용률
      - 파드마다 받은 IP 주소
    answer: 0
    explain: 모두 함께라면 새 배포, 설정 변경, 바깥 의존성 같은 공통 원인일 가능성이 커요. 배포 시각과 재시작 시각을 맞춰 봐요.
  - id: probe-killing
    type: choice
    prompt: 파드 이벤트에 Unhealthy와 Killing이 되풀이돼요. 무엇이 컨테이너를 다시 시작시키고 있을까요?
    choices:
      - liveness 프로브 실패
      - readiness 프로브 실패
      - 메모리 한도를 넘은 OOM
      - 노드 압박에 따른 축출
    answer: 0
    explain: Unhealthy는 readiness 실패에도 남지만, 컨테이너를 끝내는 Killing이 함께 되풀이되면 liveness예요. 시작이 느린 앱이라면 startup 프로브를 둬요.
