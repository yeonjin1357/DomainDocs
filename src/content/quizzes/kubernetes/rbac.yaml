questions:
  - id: no-deny-rules
    type: ox
    prompt: RBAC에서 '이 계정은 Secret을 읽지 못한다'는 금지 규칙을 따로 만들어 권한을 막을 수 있나요?
    answer: false
    explain: RBAC에는 금지 규칙이 없고 허락을 더하기만 해요. 권한을 빼려면 그 권한을 준 바인딩을 찾아 고쳐요.
  - id: role-scope
    type: choice
    prompt: 파드와 노드를 읽는 ClusterRole을 만들고, mon 네임스페이스의 RoleBinding으로 에이전트에 묶었어요. 에이전트가 읽을 수 있는 건?
    choices:
      - mon 네임스페이스의 파드만
      - 모든 네임스페이스의 파드와 노드
      - 모든 네임스페이스의 파드만
      - mon의 파드와 모든 노드
    answer: 0
    explain: RoleBinding은 ClusterRole을 묶어도 그 네임스페이스 안에서만 권한을 줘요. 모든 네임스페이스와 노드를 읽으려면 ClusterRoleBinding으로 묶어요.
  - id: default-sa-permissions
    type: ox
    prompt: 서비스 계정을 따로 정하지 않은 파드가 API로 자기 네임스페이스의 파드 목록을 읽으려 해요. 기본 RBAC 정책에서는 403 Forbidden으로 막히나요?
    answer: true
    explain: 이 파드는 default 서비스 계정을 쓰는데, 기본 RBAC 정책은 kube-system 밖의 서비스 계정에 권한을 주지 않아요. 필요한 역할을 따로 묶어 줘요.
  - id: empty-node-view
    type: choice
    prompt: 모니터링 화면에서 파드 정보는 보이는데 노드 정보만 비어 있어요. 에이전트 계정으로 kubectl auth can-i list nodes를 물으니 no예요. 알맞은 조치는?
    choices:
      - 에이전트 계정에 노드 읽기 역할을 묶어요
      - 에이전트 파드를 다시 시작해요
      - 노드의 kubelet을 다시 시작해요
      - Metrics Server를 설치해요
    answer: 0
    explain: 권한이 빠진 자원은 에러 화면 없이 그 부분만 비어요. 노드는 클러스터 전체 자원이라 ClusterRole과 ClusterRoleBinding으로 줘요.
  - id: sa-term
    type: input
    prompt: 사람이 아니라 파드 안의 프로그램이 API 서버를 부를 때 쓰는 계정을 뭐라고 부를까요?
    answer: [서비스 계정, ServiceAccount, service account, SA]
    term: kubernetes/service-account
    explain: 네임스페이스마다 default 서비스 계정이 있어요. 권한은 바인딩으로 따로 줘요.
