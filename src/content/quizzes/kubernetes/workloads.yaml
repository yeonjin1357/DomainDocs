questions:
  - id: daemonset-for-agent
    type: choice
    prompt: 노드마다 꼭 하나씩 돌아야 하는 로그 수집기는 어떤 워크로드로 띄울까요?
    choices:
      - DaemonSet
      - Deployment
      - Job
      - StatefulSet
    answer: 0
    explain: DaemonSet은 노드마다 파드를 하나씩 띄우고, 새 노드가 들어오면 그 노드에도 띄워요.
  - id: statefulset-for-db
    type: choice
    prompt: 파드마다 고유한 이름과 저장소가 필요한 데이터베이스에 맞는 워크로드는?
    choices:
      - StatefulSet
      - Deployment
      - DaemonSet
      - CronJob
    answer: 0
    explain: StatefulSet의 파드는 db-0처럼 번호 붙은 이름을 받고, 다시 떠도 같은 이름과 저장소를 이어받아요.
  - id: rolling-min-available
    type: choice
    prompt: 파드 4개짜리 Deployment를 기본 설정으로 롤링 업데이트해요. 떠 있는 파드는 최소 몇 개를 지킬까요?
    choices:
      - 3개
      - 4개
      - 2개
      - 0개
    answer: 0
    explain: 기본 설정에서는 원하는 개수의 25%까지만 모자라도 돼요. 4개의 75%인 3개 아래로는 내려가지 않아요.
  - id: cronjob-not-job-success
    type: ox
    prompt: CronJob이 정상으로 보이면, 일정마다 만들어진 Job도 모두 성공했다고 볼 수 있나요?
    answer: false
    explain: CronJob은 일정마다 Job을 만드는 일만 해요. 만들어진 Job이 성공했는지는 따로 봐야 해요.
  - id: job-backoff-limit
    type: choice
    prompt: Job이 실패로 보기 전에, 기본으로 몇 번까지 다시 시도할까요?
    choices:
      - 6번
      - 3번
      - 끝없이 다시 시도해요
      - 다시 시도하지 않아요
    answer: 0
    explain: 다시 시도하는 횟수는 backoffLimit으로 정하고, 적지 않으면 6이에요.
