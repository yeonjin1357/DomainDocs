questions:
  - id: 4xx-client-side
    type: choice
    prompt: 404와 401 응답이 많이 늘었어요. 이런 응답은 대개 누구 쪽 문제일까요?
    choices:
      - 요청한 쪽
      - 서버 쪽
      - 앞단 게이트웨이
      - DB
    answer: 0
    explain: 4xx는 요청한 쪽이 잘못한 것 같다는 뜻이에요. 서버 에러율과는 나눠서 봐요.
  - id: post-retry
    type: ox
    prompt: 주문을 만드는 POST 요청이 시간 초과로 끝났어요. 그렇다면 서버는 이 요청을 처리하지 않은 건가요?
    answer: false
    explain: 시간 초과는 응답을 제때 못 받았다는 뜻일 뿐, 서버는 처리했을 수 있어요. POST는 멱등이 아니라서 그대로 다시 보내면 주문이 두 번 생길 수 있어요.
  - id: not-idempotent
    type: choice
    prompt: 다음 중 여러 번 보내면 결과가 달라질 수 있는(멱등이 아닌) 메서드는?
    choices:
      - POST
      - GET
      - PUT
      - DELETE
    answer: 0
    explain: 표준은 GET 같은 안전한 메서드와 PUT, DELETE를 멱등으로 정해요. POST는 보낼 때마다 새로 처리될 수 있어요.
  - id: 504-from-gateway
    type: choice
    prompt: 504 응답이 늘었는데 WAS 로그에는 에러가 없어요. 가장 그럴듯한 이유는?
    choices:
      - 앞단 장비가 기다리다 만든 응답이에요
      - 브라우저가 요청을 잘못 보냈어요
      - DB가 시간 초과로 504를 돌려줬어요
      - WAS가 로그 쓰기를 꺼 뒀어요
    answer: 0
    explain: 502와 504는 서버 앞단의 게이트웨이나 프록시가 만드는 코드예요. 웹 서버나 로드 밸런서 쪽 기록을 함께 봐요.
  - id: group-by-template
    type: choice
    prompt: /orders/42, /orders/43 같은 주소를 트랜잭션 이름으로 어떻게 묶어야 할까요?
    choices:
      - ID 자리를 {id}로 묶어요
      - 주소마다 따로 이름을 둬요
      - 경로를 모두 / 하나로 묶어요
      - 메서드 이름만으로 묶어요
    answer: 0
    explain: ID가 든 주소를 그대로 쓰면 이름이 끝없이 늘어요. /orders/{id}처럼 묶어야 같은 기능끼리 모여요.
