questions:
  - id: metaspace-not-heap
    type: ox
    prompt: "OutOfMemoryError: Metaspace가 났어요. -Xmx를 늘리면 이 에러가 풀리나요?"
    answer: false
    explain: 메타스페이스는 클래스 정보를 담는 힙 밖 메모리라, 힙 크기를 늘려도 그대로예요. 에러 뒤의 이름이 어느 메모리가 모자랐는지 알려 줘요.
  - id: container-limit-equals-xmx
    type: choice
    prompt: 컨테이너 메모리 한도를 -Xmx와 똑같이 잡았어요. 생길 수 있는 일은?
    choices:
      - 힙 밖 메모리까지 더해 한도를 넘어요
      - GC가 한도를 몰라 영영 돌지 않아요
      - 힙 크기가 한도에 맞춰 저절로 줄어요
      - 메타스페이스를 힙 안에서 쓰게 돼요
    answer: 0
    explain: 컨테이너 한도는 프로세스 전체 메모리에 걸려요. 힙은 여유가 있어도 메타스페이스, 스레드 스택까지 더해 한도를 넘으면 강제로 끝나요.
  - id: leak-signal
    type: choice
    prompt: 힙 사용량 그래프에서 메모리 누수를 의심할 만한 모습은?
    choices:
      - GC 직후에 남는 바닥이 계속 올라가요
      - 톱니 모양으로 오르내려요
      - GC 직전마다 힙이 90%까지 차올라요
      - GC가 자주 돌아요
    answer: 0
    explain: 오르내리는 톱니는 정상이에요. GC가 치운 뒤에도 바닥이 계속 높아지면 치울 수 없는 객체가 쌓이는 중이에요.
  - id: oom-not-always-leak
    type: choice
    prompt: OutOfMemoryError(Java heap space)가 났는데, GC 직후 바닥은 며칠째 평평해요. 가장 그럴듯한 원인은?
    choices:
      - 앱에 비해 힙이 작아요
      - 메모리 누수가 있어요
      - 메타스페이스가 바닥났어요
      - 스레드 스택이 너무 커요
    answer: 0
    explain: 바닥이 평평하면 쌓이는 객체는 없어요. 앱이 원래 쓰는 양에 비해 힙을 작게 잡은 거예요. 메타스페이스가 모자라면 에러 뒤의 이름이 Metaspace예요.
  - id: heap-name
    type: input
    prompt: 자바 코드가 만든 객체가 담기는 JVM의 메모리 영역은?
    answer: [힙, heap, 자바 힙, Java heap]
    explain: 힙의 최대 크기는 -Xmx로 정해요. 더는 쓰지 않는 객체는 GC가 치워요.
