questions:
  - id: error-page-200
    type: ox
    prompt: 앱이 장애 중에 오류 안내 화면을 200 응답으로 돌려준다면, 응답 코드만 보는 URL 점검은 실패로 판정하나요?
    answer: false
    explain: 기본 판정은 2xx면 성공이라 '정상'으로 나와요. 본문에 꼭 있어야 할 글자를 함께 검사해요.
  - id: one-location-fails
    type: choice
    prompt: 세 위치 중 싱가포르에서만 점검이 계속 실패하고, 서울과 도쿄는 정상이에요. 먼저 의심할 것은?
    choices:
      - 싱가포르 점검 위치 쪽 네트워크
      - 서비스 전체 장애
      - 서버의 TLS 인증서 만료
      - DB 연결 한도
    answer: 0
    explain: 서비스가 죽었다면 모든 위치에서 실패해요. 한 곳만 실패하면 그 위치나 그 경로의 문제일 가능성이 커요.
  - id: slow-phase
    type: choice
    prompt: URL 점검의 구간별 시간에서 서버 처리(첫 바이트까지)만 크게 늘었어요. 어디를 볼까요?
    choices:
      - 앱과 그 뒤의 DB·외부 API
      - DNS 서버
      - TLS 인증서 체인
      - 점검 위치의 회선 속도
    answer: 0
    explain: 서버 처리는 연결을 맺은 뒤 첫 바이트를 받기까지라, 앱이 요청을 처리하는 시간이에요. DNS, 연결, TLS는 그대로예요.
  - id: round-robin-one
    type: ox
    prompt: 서버 세 대가 한 이름(DNS 라운드 로빈)으로 묶여 있으면, blackbox_exporter의 점검 한 번이 세 대를 모두 확인하나요?
    answer: false
    explain: 주소가 여러 개면 그중 하나만 골라 검사해요. 서버마다 따로 점검을 둬요.
  - id: synthetic-term
    type: input
    prompt: 정해 둔 위치에서 주기적으로 주소를 열어 보며 정상 여부와 속도를 재는 감시를 뭐라고 부를까요?
    answer: [외부 감시, URL 모니터링, synthetic monitoring, 합성 모니터링, 신세틱 모니터링]
    term: apm/synthetic-monitoring
    explain: 사용자가 없을 때도 장애를 먼저 알 수 있어요. 실제 사용자 감시(RUM)와 함께 써요.
