questions:
  - id: find-origin
    type: choice
    prompt: 결제 API가 느려진 뒤, 주문 API와 장바구니 API까지 빨개졌어요. 출발점 후보로 볼 곳은?
    choices:
      - 받은 쪽 시간이 오른 맨 아래 서비스
      - 에러 수가 가장 많은 서비스
      - 사용자에게 가장 가까운 맨 앞 서비스
      - 트래픽이 가장 많은 서비스
    answer: 0
    explain: 부르는 쪽은 느린 상대를 기다리느라 함께 나빠져요. 그래서 받은 쪽에서 잰 응답시간이 오른 곳 중 사슬 아래쪽부터 거슬러 올라가요.
  - id: extra-requests-retries
    type: choice
    prompt: 사용자 요청은 그대로인데, 뒷단이 받는 요청만 크게 늘었어요. 늘어난 몫은 무엇일 가능성이 클까요?
    choices:
      - 앞단들이 보낸 재시도
      - 새로 들어온 사용자
      - 예약해 둔 배치 작업
      - 사용자 브라우저의 새로고침
    answer: 0
    explain: 과부하로 실패하는 서비스에 재시도가 몰리면 받는 요청이 불어나요. 재시도 그래프가 원인인데도 증상으로 오해받기 쉬워요.
  - id: shed-more-load
    type: ox
    prompt: 초당 11,000건에서 무너진 서비스는, 9,000건으로만 줄여도 바로 살아나나요?
    answer: false
    explain: 무너지는 동안 건강한 서버가 줄어서 받아 낼 수 있는 양도 함께 줄어요. 그래서 부하를 크게 줄여야 해요.
  - id: heavy-health-check
    type: ox
    prompt: 과부하로 서버 한 대의 헬스 체크가 실패해 빠지면, 남은 서버가 받는 요청은 늘어나나요?
    answer: true
    explain: 빠진 서버의 몫이 남은 서버로 몰려요. 그래서 헬스 체크가 무거우면 과부하가 서버를 차례로 빼며 더 번져요.
  - id: not-load-shedding
    type: choice
    prompt: 연쇄 장애 중에 부하를 줄이는 방법으로 알맞은 것은?
    choices:
      - 재시도를 끄거나 줄여요
      - 재시도 횟수를 늘려요
      - 타임아웃을 더 길게 늘려요
      - 헬스 체크를 더 무겁게 해요
    answer: 0
    explain: 재시도를 늘리면 받는 요청이 불어나고, 타임아웃을 늘리면 자원이 더 오래 묶여요. 재시도 줄이기, 일찍 거절하기, 배치 멈추기가 부하를 줄여요.
