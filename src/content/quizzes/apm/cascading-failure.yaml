questions:
  - id: find-origin
    type: choice
    prompt: 결제 API가 느려진 뒤, 주문 API와 장바구니 API까지 빨개졌어요. 출발점 후보로 볼 곳은?
    choices:
      - 받은 쪽에서 잰 응답시간이 오른 서비스 중 호출 사슬의 가장 아래쪽
      - 에러 수가 가장 많은 서비스
      - 사용자에게 가장 가까운 맨 앞 서비스
      - 트래픽이 가장 많은 서비스
    answer: 0
    explain: 부르는 쪽은 느린 상대를 기다리느라 함께 나빠져요. 그래서 사슬 아래쪽부터 거슬러 올라가요.
  - id: extra-requests-retries
    type: choice
    prompt: 사용자 요청은 그대로인데, 뒷단이 받는 요청만 크게 늘었어요. 늘어난 몫은 무엇일 가능성이 클까요?
    choices:
      - 앞단들이 보낸 재시도
      - 새로 들어온 사용자
      - 예약해 둔 배치 작업
      - 사용자 브라우저의 새로고침
    answer: 0
    explain: 과부하로 실패하는 서비스에 재시도가 몰리면 받는 요청이 불어나요. 재시도 그래프가 원인인데도 증상으로 오해받기 쉬워요.
  - id: shed-more-load
    type: ox
    prompt: 초당 11,000건에서 무너진 서비스는, 9,000건으로만 줄여도 바로 살아나나요?
    answer: false
    explain: 무너지는 동안 건강한 서버가 줄어서 받아 낼 수 있는 양도 함께 줄어요. 그래서 부하를 크게 줄여야 해요.
  - id: heavy-health-check
    type: ox
    prompt: 헬스 체크가 무거운 일을 하면, 과부하 때 서버가 빠지면서 남은 서버의 부하가 더 커질 수 있나요?
    answer: true
    explain: 과부하로 헬스 체크가 실패하면 그 서버가 빠지고, 그 몫이 남은 서버로 몰려 더 무너져요.
  - id: not-load-shedding
    type: choice
    prompt: 연쇄 장애를 멈추려고 부하를 줄이는 방법이 아닌 것은?
    choices:
      - 재시도 횟수를 늘려요
      - 재시도를 끄거나 줄여요
      - 일부 요청을 일찍 거절해요
      - 급하지 않은 배치 작업을 멈춰요
    answer: 0
    explain: 재시도를 늘리면 과부하가 더 커져요. 부하를 줄이는 방법은 재시도 줄이기, 일찍 거절하기, 기능 덜기, 배치 멈추기예요.
