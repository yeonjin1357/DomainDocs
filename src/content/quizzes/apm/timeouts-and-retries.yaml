questions:
  - id: retry-multiplies
    type: choice
    prompt: 세 계층이 실패하면 저마다 3번씩 다시 시도해요(모두 4번 시도). 사용자 동작 한 번이 맨 아래 DB에서는 몇 번이 될까요?
    choices:
      - 64번
      - 12번
      - 27번
      - 9번
    answer: 0
    explain: 계층마다 4번씩 시도하니 4 × 4 × 4 = 64번이에요. 그래서 재시도는 한 계층에서만 해요.
  - id: no-timeout-risk
    type: ox
    prompt: 외부 호출에 타임아웃을 두지 않아도, 상대가 멈췄을 때 우리 스레드 풀은 괜찮나요?
    answer: false
    explain: 상대를 끝없이 기다리는 스레드가 쌓여 스레드 풀이 바닥나요. 상대의 문제가 우리 자원 고갈로 번져요.
  - id: why-jitter
    type: choice
    prompt: 재시도 간격에 무작위 값(jitter)을 더하는 이유는?
    choices:
      - 실패한 요청들이 같은 순간에 다시 몰리지 않게 흩뜨리려고
      - 재시도를 더 빨리 하려고
      - 재시도 횟수를 늘리려고
      - 타임아웃을 없애려고
    answer: 0
    explain: 모두 같은 간격 뒤에 다시 오면 또 한꺼번에 몰려 실패해요. 간격을 늘리고 흩뜨려야 상대가 회복할 틈이 생겨요.
  - id: backend-longer-timeout
    type: choice
    prompt: 앞단은 5초에 포기하는데, 뒷단의 타임아웃은 30초예요. 어떤 일이 생길까요?
    choices:
      - 앞단이 포기한 뒤에도 뒷단은 쓸모없는 일을 계속해요
      - 앞단이 30초까지 기다려 줘요
      - 뒷단이 먼저 포기해요
      - 아무 일도 생기지 않아요
    answer: 0
    explain: 그래서 맨 앞에서 정한 마감 시각을 아래로 넘겨, 남은 시간만큼만 기다리게 해요.
  - id: no-retry-4xx
    type: ox
    prompt: 400 같은 잘못된 요청 오류는 다시 보내면 성공할 가능성이 높나요?
    answer: false
    explain: 요청 자체가 잘못됐으니 다시 보내도 같은 결과예요. 부하만 늘어서 재시도하지 않아요.
