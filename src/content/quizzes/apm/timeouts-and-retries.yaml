questions:
  - id: retry-multiplies
    type: choice
    prompt: 세 계층이 실패하면 저마다 3번씩 다시 시도해요(모두 4번 시도). 사용자 동작 한 번이 맨 아래 DB에서는 몇 번이 될까요?
    choices:
      - 64번
      - 12번
      - 27번
      - 9번
    answer: 0
    explain: 계층마다 4번씩 시도하니 4 × 4 × 4 = 64번이에요. 그래서 재시도는 한 계층에서만 해요.
  - id: no-timeout-risk
    type: choice
    prompt: 외부 결제 API가 멈췄는데, 우리 서비스의 그 호출에는 타임아웃이 없어요. 먼저 바닥날 우리 쪽 자원은?
    choices:
      - 요청 처리 스레드
      - 서버 디스크 공간
      - 서버 CPU
      - 네트워크 대역폭
    answer: 0
    explain: 상대를 끝없이 기다리는 스레드가 쌓여 스레드 풀이 바닥나요. 기다리는 스레드는 CPU를 쓰지 않아서, CPU는 오히려 한가해요.
  - id: why-jitter
    type: choice
    prompt: 재시도 간격에 무작위 값(jitter)을 더하는 이유는?
    choices:
      - 재시도가 한꺼번에 몰리지 않게
      - 재시도를 더 빨리 끝내려고
      - 재시도 횟수를 줄이려고
      - 상대가 재시도를 알아채게
    answer: 0
    explain: 모두 같은 간격 뒤에 다시 오면 또 한꺼번에 몰려 실패해요. 간격을 늘리고 흩뜨려야 상대가 회복할 틈이 생겨요.
  - id: backend-longer-timeout
    type: choice
    prompt: 앞단은 5초에 포기하는데, 뒷단의 타임아웃은 30초예요. 어떤 일이 생길까요?
    choices:
      - 뒷단이 쓸모없는 일을 계속해요
      - 앞단이 30초까지 기다려 줘요
      - 뒷단이 5초에 맞춰 먼저 끊어요
      - 사용자는 30초 뒤에 응답을 받아요
    answer: 0
    explain: 앞단이 포기한 뒤에도 뒷단은 30초까지 일해요. 그래서 맨 앞에서 정한 마감 시각을 아래로 넘겨, 남은 시간만큼만 기다리게 해요.
  - id: no-retry-4xx
    type: ox
    prompt: 400 같은 잘못된 요청 에러는, 같은 요청을 다시 보내도 같은 400이 돌아오나요?
    answer: true
    explain: 요청 자체가 잘못됐으니 다시 보내도 같은 결과예요. 부하만 늘어서, 잘못된 요청이나 영구 실패는 재시도하지 않아요.
