questions:
  - id: warmup
    type: choice
    prompt: 자바 앱을 배포한 직후 5분 동안만 느렸다가 원래대로 돌아왔어요. 가장 그럴듯한 이유는?
    choices:
      - 막 뜬 서버가 데워지는 중이라서
      - 새 코드에 N+1 질의가 생겨서
      - 배포 중 DB 인덱스가 사라져서
      - 새 버전의 커넥션이 새고 있어서
    answer: 0
    explain: JIT 컴파일이 끝나기 전이고 캐시도 비어 있어서 잠깐 느려요. 코드 문제라면 몇 분 뒤에도 계속 느려요.
  - id: by-version
    type: choice
    prompt: 배포 도중 응답시간이 올랐어요. 새 버전 탓인지 가리려면?
    choices:
      - 같은 시간대를 버전별로 나눠요
      - 전체 평균 응답시간을 봐요
      - 에러율이 늘었는지만 봐요
      - 배포가 끝날 때까지 기다려요
    answer: 0
    explain: 롤링 업데이트 중에는 두 버전이 섞여 있어요. 새 버전 인스턴스만 느리면 새 버전 탓이에요.
  - id: service-version
    type: input
    prompt: OpenTelemetry에서 서비스의 배포 버전을 담는 리소스 속성 이름은?
    answer: [service.version]
    explain: 배포 도구가 이 값을 채우게 해 두면, 지표와 트레이스를 버전으로 나눠 볼 수 있어요.
  - id: canary-impact
    type: choice
    prompt: 요청의 20%를 실패시키는 새 버전을 트래픽 5%에만 내보냈어요. 전체 실패율은 대략 얼마가 늘까요?
    choices:
      - 1%
      - 5%
      - 20%
      - 25%
    answer: 0
    explain: 5%의 트래픽에서 20%가 실패하니 전체의 1%예요. 카나리는 나쁜 버전의 영향을 이만큼 줄여 줘요.
  - id: compare-past-week
    type: choice
    prompt: 배포가 이미 끝나 옛 버전 인스턴스가 하나도 없어요. 새 버전의 응답시간을 무엇과 견줄까요?
    choices:
      - 지난주 같은 요일·시간대
      - 배포 직전 5분의 값
      - 다른 서비스의 같은 시간대
      - 개발 환경에서 잰 응답시간
    answer: 0
    explain: 트래픽은 요일과 시간대에 따라 달라서, 배포 전 같은 요일·시간대와 견줘야 공정해요. 5분은 너무 짧고, 다른 서비스나 개발 환경은 조건이 달라요.
