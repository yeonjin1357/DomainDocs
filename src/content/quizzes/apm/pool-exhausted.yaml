questions:
  - id: not-db-failure
    type: ox
    prompt: HikariCP의 Connection is not available, request timed out 예외가 나면 DB가 멈췄다는 뜻인가요?
    answer: false
    explain: 앱의 풀에서 정한 시간 안에 커넥션을 못 빌렸다는 뜻이에요. DB는 한가하고, 커넥션을 쥔 쪽이 돌려주지 않고 있을 수 있어요.
  - id: read-message
    type: choice
    prompt: 예외 끝에 (total=10, active=10, idle=0, waiting=25)가 붙어 있어요. 무엇을 알 수 있나요?
    choices:
      - 커넥션 10개를 모두 빌려 갔고, 25개 스레드가 더 기다려요
      - 커넥션 25개가 쉬고 있어요
      - DB 연결 한도가 10이에요
      - 커넥션 10개가 끊겼어요
    answer: 0
    explain: active가 최대 크기와 같고 idle이 0이면 풀이 바닥난 거예요. waiting은 아직 기다리는 다른 스레드 수예요.
  - id: hold-time-external
    type: choice
    prompt: DB 화면은 한가한데 커넥션을 쥐는 시간만 길어요. 가장 먼저 의심할 코드는?
    choices:
      - 트랜잭션 안에서 외부 API를 부르는 코드
      - 인덱스를 쓰는 SELECT
      - 커넥션 풀 크기 설정
      - 로그를 남기는 코드
    answer: 0
    explain: 트랜잭션을 연 채로 바깥 응답을 기다리면, 그동안 커넥션을 쥐고 있어요. DB는 한가한데 풀은 비어요.
  - id: leak-at-night
    type: ox
    prompt: 요청이 거의 없는 새벽에도 사용 중 커넥션이 최대값에 붙어 있다면 커넥션 누수를 의심할 만한가요?
    answer: true
    explain: 일이 없는데 커넥션이 돌아오지 않는 거예요. leakDetectionThreshold를 켜면 빌린 코드 줄이 스택 트레이스로 남아요.
  - id: leak-setting
    type: input
    prompt: 커넥션이 정한 시간보다 오래 풀 밖에 있으면 경고를 남기는 HikariCP 설정 이름은?
    answer: [leakDetectionThreshold]
    term: apm/connection-leak
    explain: 기본값 0은 꺼짐이고, 켤 때 가장 작은 값은 2초예요. 정상적으로 오래 쥐는 작업보다 길게 잡아요.
