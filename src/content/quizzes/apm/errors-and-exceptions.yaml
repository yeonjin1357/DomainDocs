questions:
  - id: error-rate-calc
    type: choice
    prompt: 5분 동안 요청 10,000건 중 5xx가 50건, 4xx가 400건이었어요. 서버 에러율은?
    choices:
      - 0.5%
      - 4.5%
      - 4%
      - 0.05%
    answer: 0
    explain: 서버 에러율은 5xx로 실패한 요청만 세요. 50 ÷ 10,000 = 0.5%이고, 4xx는 따로 봐요.
  - id: server-404
    type: ox
    prompt: OpenTelemetry HTTP 규약에서, 서버 쪽 span은 404 응답을 에러로 보나요?
    answer: false
    explain: 서버 쪽은 5xx만 에러로 봐요. 4xx는 클라이언트가 잘못한 것으로 보이는 응답이라 서버 span 상태를 비워 둬요.
  - id: client-404
    type: ox
    prompt: 같은 404 응답을, 요청을 보낸 클라이언트 쪽 span은 에러로 보나요?
    answer: true
    explain: 요청을 보낸 쪽에서는 4xx도 원하는 결과를 못 받은 실패예요. 그래서 같은 404가 부른 쪽에서는 에러, 받은 쪽에서는 에러가 아니에요.
  - id: log-lines-inflate
    type: choice
    prompt: 에러 로그 줄 수로 그린 에러율이 실제보다 높게 나와요. 가장 그럴듯한 이유는?
    choices:
      - 처리한 예외도 로그에 남아서
      - 4xx 응답을 빼고 세서
      - 요청 수 카운터가 재시작돼서
      - 트레이스를 샘플링해서
    answer: 0
    explain: 코드가 잡아 처리한 예외는 요청을 실패시키지 않는데도 로그에 남아요. 같은 예외가 계층마다 기록되기도 해서, 에러율은 요청 수를 세는 지표로 계산해요.
  - id: grouping-split
    type: choice
    prompt: 에러 목록에서 같은 에러가 수천 개의 묶음으로 갈라졌어요. 먼저 의심할 것은?
    choices:
      - 메시지에 주문 번호가 붙어서
      - 정말 서로 다른 에러가 수천 가지라서
      - 트레이스 샘플링 비율이 낮아서
      - 서버 대수가 너무 많아서
    answer: 0
    explain: 스택 트레이스 없이 메시지로 묶으면, 값이 든 메시지는 값마다 다른 묶음이 돼요.
