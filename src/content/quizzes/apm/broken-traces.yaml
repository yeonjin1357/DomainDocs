questions:
  - id: separate-trace-started
    type: choice
    prompt: 주문 API 트레이스에서 결제 API 호출 아래가 비었고, 결제 API 쪽에는 같은 시각에 따로 시작한 트레이스가 있어요. 무슨 뜻일까요?
    choices:
      - trace id가 안 넘어가 새로 시작했어요
      - 결제 API가 계측되지 않았어요
      - 결제 API의 span이 샘플링에서 빠졌어요
      - 결제 API가 응답하지 않았어요
    answer: 0
    explain: 결제 API 쪽에 트레이스가 있으니 계측은 됐어요. 부모를 모른 채 새 트레이스를 시작한 거라, 헤더와 스레드를 넘는 곳부터 봐요.
  - id: traceparent-header
    type: choice
    prompt: OpenTelemetry가 기본으로 trace id를 실어 다음 서비스로 보내는 HTTP 헤더는?
    choices:
      - traceparent
      - x-request-id
      - authorization
      - cookie
    answer: 0
    explain: W3C 표준 traceparent 헤더예요. 사이의 프록시나 직접 만든 클라이언트가 이 헤더를 빼먹으면 트레이스가 끊겨요.
  - id: thread-handoff
    type: choice
    prompt: 같은 서비스 안에서, 요청을 받은 스레드가 작업을 스레드 풀로 넘긴 뒤부터 span이 새 트레이스로 찍혀요. 먼저 의심할 것은?
    choices:
      - 넘길 때 컨텍스트를 안 넘김
      - 다음 서비스의 헤더 누락
      - 서비스마다 다른 샘플링 비율
      - Collector가 span을 버림
    answer: 0
    explain: OpenTelemetry Java는 컨텍스트를 스레드 로컬에 둬서, 다른 스레드로 넘긴 작업에는 따라가지 않을 수 있어요. Context.current().wrap()처럼 넘길 때 함께 넘겨요.
  - id: propagator-mismatch
    type: choice
    prompt: 서비스 A는 기본 전파 형식(tracecontext)을 쓰고, 서비스 B는 b3 형식만 써요. 어떤 일이 생길까요?
    choices:
      - 헤더를 못 알아들어 트레이스가 끊겨요
      - 형식만 다를 뿐 그대로 이어져요
      - 두 서비스 모두 샘플링이 꺼져요
      - B가 헤더 때문에 요청을 거부해요
    answer: 0
    explain: 전파 형식이 맞아야 헤더를 읽을 수 있어요. 서비스마다 OTEL_PROPAGATORS 설정을 견줘 봐요.
  - id: user-not-always-broken
    type: ox
    prompt: 계측되지 않은 스케줄러가 우리 API를 부르면, 서비스 맵에서 그 호출은 user에서 오는 선으로 그려지나요?
    answer: true
    explain: 부른 쪽 span이 없으면 user로 그려요. 그래서 user 선이 모두 끊김은 아니고, 내부 서비스끼리 부르는 자리에 있을 때만 의심해요.
