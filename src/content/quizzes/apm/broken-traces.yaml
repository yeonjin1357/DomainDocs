questions:
  - id: separate-trace-started
    type: choice
    prompt: 주문 API 트레이스에서 결제 API 호출 아래가 비었고, 결제 API 쪽에는 같은 시각에 따로 시작한 트레이스가 있어요. 무슨 뜻일까요?
    choices:
      - trace id가 넘어가지 않아 결제 API가 새 트레이스를 시작했어요
      - 결제 API가 계측되지 않았어요
      - 결제 API의 span이 샘플링에서 빠졌어요
      - 결제 API가 응답하지 않았어요
    answer: 0
    explain: 뒷단이 부모를 모르면 새 트레이스를 시작해요. 그래서 헤더와 스레드를 넘는 곳부터 봐요.
  - id: traceparent-header
    type: choice
    prompt: OpenTelemetry가 기본으로 trace id를 실어 다음 서비스로 보내는 HTTP 헤더는?
    choices:
      - traceparent
      - x-request-id
      - authorization
      - cookie
    answer: 0
    explain: W3C 표준 traceparent 헤더예요. 사이의 프록시나 직접 만든 클라이언트가 이 헤더를 빼먹으면 트레이스가 끊겨요.
  - id: thread-handoff
    type: ox
    prompt: 같은 서비스 안에서 작업을 스레드 풀로 넘기면, trace id가 든 컨텍스트가 언제나 저절로 따라가나요?
    answer: false
    explain: OpenTelemetry Java는 컨텍스트를 스레드 로컬에 둬서, 다른 스레드로 넘긴 작업에는 따라가지 않을 수 있어요. 넘길 때 컨텍스트를 함께 넘겨요.
  - id: propagator-mismatch
    type: choice
    prompt: 서비스 A는 기본 전파 형식(tracecontext)을 쓰고, 서비스 B는 b3 형식만 써요. 어떤 일이 생길까요?
    choices:
      - 서로 헤더를 알아듣지 못해 트레이스가 끊겨요
      - 아무 문제 없이 이어져요
      - 샘플링이 꺼져요
      - B가 모든 요청을 거부해요
    answer: 0
    explain: 전파 형식이 맞아야 헤더를 읽을 수 있어요. 서비스마다 OTEL_PROPAGATORS 설정을 견줘 봐요.
  - id: user-not-always-broken
    type: ox
    prompt: 서비스 맵에 user에서 오는 선이 있으면, 언제나 트레이스가 끊겼다는 뜻인가요?
    answer: false
    explain: 계측되지 않은 스케줄러, 프런트엔드, curl 요청도 user로 나와요. 내부 서비스끼리 부르는 자리에 있을 때만 의심해요.
