questions:
  - id: throughput-drop-saturation
    type: choice
    prompt: 처리량이 초당 200건에서 133건으로 줄었는데, 응답시간과 활성 트랜잭션은 함께 늘었어요. 맞는 해석은?
    choices:
      - 처리할 힘이 모자란 포화예요
      - 들어오는 손님이 줄었어요
      - 장애가 끝나 가는 중이에요
      - 계측이 끊겼어요
    answer: 0
    explain: 손님이 줄었다면 활성 트랜잭션도 함께 줄어요. 처리 중인 요청은 늘었는데 끝내는 수가 줄었다면 처리할 힘이 모자란 거예요.
  - id: max-throughput-calc
    type: choice
    prompt: 요청 처리 스레드가 200개뿐인데, 응답시간이 1.5초로 늘었어요. 초당 끝낼 수 있는 요청은 최대 몇 건일까요?
    choices:
      - 약 133건
      - 300건
      - 200건
      - 약 100건
    answer: 0
    explain: 동시에 200개까지만 처리하고 하나에 1.5초가 걸리니, 200 ÷ 1.5 ≈ 133건이에요.
  - id: flat-active-ceiling
    type: choice
    prompt: 요청이 늘수록 응답시간은 길어지는데, 활성 트랜잭션 그래프는 200에 붙어 평평해요. 먼저 의심할 것은?
    choices:
      - 요청 처리 스레드 수의 상한
      - 들어오는 요청이 일정해졌어요
      - 응답시간 계측이 끊겼어요
      - 처리량 카운터가 초기화됐어요
    answer: 0
    explain: 처리 중인 요청 수가 상한에 닿으면 더 늘지 못하고 평평해져요. Tomcat은 따로 정하지 않으면 스레드가 200개예요.
  - id: littles-law
    type: input
    prompt: 평균 동시 처리 수는 평균 처리량 × 평균 응답시간이라는 관계를 무엇이라고 하나요?
    answer: [리틀의 법칙, 리틀 법칙, Little's Law, Littles Law]
    explain: 초당 200건을 0.5초씩 처리하면 늘 100건이 처리 중이에요. 스레드 풀 크기를 정할 때 이 관계로 따져요.
