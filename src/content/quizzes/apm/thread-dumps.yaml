questions:
  - id: runnable-not-cpu
    type: ox
    prompt: DB의 응답을 소켓에서 읽으며 기다리는 스레드도, 스레드 덤프에는 RUNNABLE로 보이나요?
    answer: true
    explain: RUNNABLE은 JVM 안에서 실행 중이라는 뜻이라, 운영체제의 소켓 읽기를 기다리는 중이어도 RUNNABLE이에요. 그래서 RUNNABLE이 많다고 CPU가 바쁜 건 아니에요.
  - id: blocked-same-lock
    type: choice
    prompt: 5초 간격으로 덤프 세 장을 떴더니, 요청 스레드 30개가 세 번 모두 같은 잠금에서 BLOCKED예요. 무슨 뜻일까요?
    choices:
      - 한 스레드가 그 잠금을 오래 쥐고 있어요
      - 스레드 풀이 할 일 없이 쉬고 있어요
      - CPU 코어가 모자라요
      - GC가 앱을 멈춰 세웠어요
    answer: 0
    explain: BLOCKED는 synchronized 잠금을 기다리는 상태예요. 같은 잠금에 몰렸다면 그 잠금을 쥔 스레드부터 찾아요.
  - id: socket-read-pileup
    type: choice
    prompt: 스택 맨 위가 같은 소켓 읽기인 RUNNABLE 스레드가 잔뜩 몰려 있어요. 의심할 곳은?
    choices:
      - 소켓 상대인 DB나 외부 API
      - 앱 코드 안의 무거운 계산
      - synchronized 잠금 경쟁
      - 너무 큰 스레드 풀 크기
    answer: 0
    explain: 소켓을 읽고 있다면 상대의 응답을 기다리는 중이에요. 그 상대가 느려진 거예요.
  - id: one-dump-not-enough
    type: ox
    prompt: 스레드 덤프 한 장만으로도, 어떤 스레드가 계속 멈춰 있는지 알 수 있나요?
    answer: false
    explain: 덤프는 한순간의 사진이에요. 몇 초 간격으로 여러 장을 떠서 계속 같은 자리에 있는 스레드를 찾아요.
  - id: idle-pool-thread
    type: choice
    prompt: 스레드 풀에서 새 일을 기다리며 쉬는 스레드는, 덤프에 보통 어떤 상태로 보일까요?
    choices:
      - WAITING이나 TIMED_WAITING
      - RUNNABLE이나 BLOCKED
      - BLOCKED나 TERMINATED
      - NEW나 RUNNABLE
    answer: 0
    explain: 쉬는 스레드도 WAITING이라서, WAITING이 많다는 것만으로는 문제가 아니에요. 요청을 처리하던 스레드인지 먼저 봐요.
