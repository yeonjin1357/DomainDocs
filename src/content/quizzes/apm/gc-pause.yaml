questions:
  - id: vertical-lines-gc
    type: choice
    prompt: 응답시간 분포도에서 14:03과 14:07에 점들이 세로로 늘어섰어요. 같은 시각에 함께 볼 것은?
    choices:
      - GC 멈춤 기록
      - DNS 응답 시간
      - 디스크 용량
      - 네트워크 카드의 에러 수
    answer: 0
    explain: GC가 앱 스레드를 멈추면 처리 중이던 요청이 함께 멈췄다가, 풀리는 순간 함께 끝나요. 그래서 세로줄이 생겨요.
  - id: g1-goal-not-guarantee
    type: ox
    prompt: G1의 멈춤 목표 200ms는, 모든 멈춤이 200ms를 넘지 않는다는 보장인가요?
    answer: false
    explain: 목표를 높은 확률로 맞추려 할 뿐이에요. G1의 멈춤은 밀리초에서 초 단위까지 갈 수 있어요.
  - id: ratio-hides-pause
    type: choice
    prompt: 1분에 1초짜리 GC 멈춤이 한 번 있어요. GC 시간 비율은 1.7%로 작아 보여요. 비율만 보면 무엇을 놓칠까요?
    choices:
      - 그 1초 동안 처리 중이던 요청이 최대 1초씩 늦어진 것
      - 놓치는 건 없어요
      - 힙의 최대 크기
      - 서버의 CPU 사용률
    answer: 0
    explain: 비율과 평균은 한 번의 긴 멈춤을 지워요. 가장 긴 멈춤(최댓값)을 함께 둬요.
  - id: pause-vs-concurrent
    type: choice
    prompt: GC 시간 중 응답시간을 직접 늘리는 것은?
    choices:
      - 앱 스레드를 모두 세운 채(stop-the-world) 진행한 시간
      - 앱과 함께 돌며 진행한 시간
      - 둘 다 똑같이 늘려요
      - 둘 다 늘리지 않아요
    answer: 0
    explain: 앱을 세운 동안엔 요청도 멈춰요. 그래서 멈춘 시간과 함께 돈 시간을 나눠 봐요.
  - id: g1-full-gc
    type: ox
    prompt: G1을 쓰는데 Full GC가 보인다면, 정상 정리가 객체가 쌓이는 속도를 따라가지 못한 신호인가요?
    answer: true
    explain: G1은 표시 중에 메모리가 바닥나면 대비책으로 힙 전체를 멈추고 정리해요. 이 멈춤은 길어요.
