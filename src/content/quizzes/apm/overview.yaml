questions:
  - id: request-path
    type: choice
    prompt: 브라우저의 요청 하나가 지나가는 순서로 맞는 것은?
    choices:
      - 로드 밸런서 → 웹 서버 → WAS → DB
      - 웹 서버 → 로드 밸런서 → DB → WAS
      - WAS → 웹 서버 → 로드 밸런서 → DB
      - 로드 밸런서 → WAS → DB → 웹 서버
    answer: 0
    explain: 로드 밸런서가 서버 하나를 고르고, 웹 서버가 앱 코드가 필요한 요청을 WAS로 넘겨요. WAS는 필요하면 DB를 불러요.
  - id: static-files
    type: choice
    prompt: 이미지나 CSS 같은 정적 파일을 앱 코드 없이 바로 돌려주는 곳은?
    choices:
      - 웹 서버
      - WAS
      - DB
      - 외부 API
    answer: 0
    explain: 웹 서버는 정적 파일을 바로 주고, 앱 코드가 필요한 요청만 WAS로 넘겨요.
  - id: waterfall-shows
    type: ox
    prompt: APM의 워터폴은 요청 하나 안에서 DB나 외부 API를 부른 구간을 시간 순서로 보여 주나요?
    answer: true
    explain: 워터폴을 보면 요청 하나가 어디에 시간을 썼는지 구간별로 알 수 있어요.
  - id: transaction-name
    type: input
    prompt: APM에서 요청 하나를 처리한 단위를 무엇이라고 부르나요?
    answer: [트랜잭션, transaction]
    explain: APM은 요청을 트랜잭션으로 묶어 응답시간과 오류를 보여 줘요. DB의 트랜잭션과는 다른 뜻이에요.
