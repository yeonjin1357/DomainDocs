questions:
  - id: lag-to-time
    type: choice
    prompt: lag이 60,000건이고 컨슈머가 초당 400건을 처리해요. 방금 들어온 메시지는 대략 얼마나 기다릴까요?
    choices:
      - 약 150초
      - 약 15초
      - 약 400초
      - 약 60초
    answer: 0
    explain: lag을 처리 속도로 나누면 쌓인 몫을 처리하는 시간이에요. 60,000 ÷ 400 = 150초예요.
  - id: in-faster-than-out
    type: choice
    prompt: 메시지는 초당 500건 들어오고, 컨슈머는 초당 400건을 처리해요. lag은 어떻게 될까요?
    choices:
      - 1분에 6,000건씩 늘어요
      - 1분에 6,000건씩 줄어요
      - 지금 크기에서 유지돼요
      - 1분에 100건씩 늘어요
    answer: 0
    explain: 초당 100건씩 더 쌓여서 1분이면 6,000건이에요. 컨슈머를 늘리거나 한 건의 처리 시간을 줄여야 해요.
  - id: nonzero-lag-ok
    type: ox
    prompt: LinkedIn의 Burrow는 lag이 정해 둔 고정 임계값을 넘으면 경고하나요?
    answer: false
    explain: 바쁜 토픽은 잘 돌 때도 lag이 0이 아닐 때가 많아서, Burrow는 고정 임계값을 두지 않아요. lag이 줄어드는지, offset이 앞으로 가는지로 판단해요.
  - id: stalled-consumer
    type: choice
    prompt: 컨슈머가 offset을 계속 기록하는데 값이 그대로이고, lag도 남아 있어요. 의심할 것은?
    choices:
      - 같은 메시지를 계속 실패하고 있어요
      - 아무 문제 없이 잘 돌고 있어요
      - 생산자가 보내기를 멈췄어요
      - 브로커 디스크가 꽉 찼어요
    answer: 0
    explain: offset이 움직이지 않으면 앞으로 나아가지 못하는 거예요. Burrow는 이 상태를 STALLED라고 불러요.
  - id: consumer-metric-vanishes
    type: ox
    prompt: 컨슈머가 내는 records-lag-max는, 컨슈머가 죽으면 0이 되는 게 아니라 값 자체가 사라지나요?
    answer: true
    explain: 컨슈머가 내는 지표라 컨슈머가 없으면 값도 없어요. 그래서 브로커 쪽 offset으로 잰 lag도 함께 둬요.
