questions:
  - id: vertical-line
    type: choice
    prompt: 응답시간 분포도에서 같은 순간에 점들이 세로로 늘어섰어요. 무슨 뜻일까요?
    choices:
      - 잠금이나 GC 멈춤처럼 막혔던 것이 풀리며 기다리던 요청이 함께 끝났어요
      - 타임아웃 값만큼 기다리다 에러로 끝났어요
      - 그 순간 요청이 하나도 없었어요
      - 계측이 잠깐 끊겼어요
    answer: 0
    explain: 세로줄은 끝난 시각이 같은 요청들이에요. 응답시간은 제각각이어도 풀리는 순간 함께 끝나서 세로로 서요.
  - id: horizontal-line
    type: choice
    prompt: 분포도에서 5초 높이에 점들이 가로로 길게 늘어섰어요. 먼저 의심할 것은?
    choices:
      - 5초짜리 타임아웃
      - 잠금이 풀린 순간
      - GC 멈춤
      - 요청이 줄어든 것
    answer: 0
    explain: 가로줄은 끝난 시각은 달라도 응답시간이 같은 요청들이에요. 그 높이가 곧 타임아웃 값이라, 설정과 맞춰 봐요.
  - id: missing-points
    type: ox
    prompt: 분포도에 점이 하나도 없는 시간이 있다면, 그때는 언제나 요청이 없었던 건가요?
    answer: false
    explain: 점은 요청이 끝나야 찍혀요. 멈춰서 끝나지 않은 요청은 안 보이니, 그 시간의 활성 트랜잭션을 함께 봐요.
  - id: bimodal-average
    type: choice
    prompt: 요청 90%는 50ms, 10%는 2,000ms에 끝나요. 평균 응답시간은?
    choices:
      - 245ms
      - 1,025ms
      - 50ms
      - 2,000ms
    answer: 0
    explain: 0.9 × 50 + 0.1 × 2,000 = 245ms예요. 아무도 겪지 않은 값이라, 무리를 나눠 봐야 해요.
  - id: heatmap-for-many
    type: choice
    prompt: 요청이 아주 많아 분포도의 점이 겹쳐 보여요. 어디에 얼마나 몰렸는지 보려면 무엇을 쓸까요?
    choices:
      - 칸마다 요청 수를 색으로 보여 주는 히트맵
      - 요청 하나의 구간을 보여 주는 워터폴
      - 서비스 사이를 이은 서비스 맵
      - 평균 응답시간 선 그래프
    answer: 0
    explain: 히트맵은 시각과 응답시간으로 나눈 칸마다 요청 수를 세요. 대신 요청 하나하나는 칸을 눌러 들어가야 보여요.
