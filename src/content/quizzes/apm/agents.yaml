questions:
  - id: source-unchanged
    type: ox
    prompt: 자바 에이전트를 붙여 바이트코드를 고친 앱에서 에이전트를 빼고 다시 시작하면, 원래 코드대로 돌아가나요?
    answer: true
    explain: 에이전트는 클래스를 메모리에 올릴 때만 바이트코드를 고쳐요. 디스크의 JAR 파일은 그대로라, 빼고 다시 시작하면 원래 코드로 돌아요.
  - id: gap-meaning
    type: choice
    prompt: 900ms 요청의 워터폴에서 첫 질의와 마지막 외부 호출 사이 720ms가 막대 없이 비어 있어요. 가장 먼저 의심할 것은?
    choices:
      - 에이전트가 감싸지 않은 직접 쓴 코드
      - 수집 서버로 기록을 보내는 데 걸린 시간
      - DB 드라이버가 결과를 받는 시간
      - 샘플링으로 버려진 span
    answer: 0
    explain: DB 드라이버나 HTTP 클라이언트는 에이전트가 저절로 감싸서 막대가 생겨요. 이름 없는 빈칸은 감싸지 않은 직접 쓴 코드가 돈 시간인 경우가 많아요.
  - id: premain-order
    type: ox
    prompt: -javaagent로 붙인 에이전트는 앱의 main 메서드가 시작한 뒤에 떠요?
    answer: false
    explain: JVM은 에이전트의 premain을 앱의 main보다 먼저 불러요. 그래야 앱 클래스를 올릴 때부터 끼어들 수 있어요.
  - id: reduce-overhead
    type: choice
    prompt: 에이전트를 붙인 뒤 CPU가 눈에 띄게 늘었어요. JDBC span이 요청마다 수백 개씩 생겨요. OpenTelemetry가 권하는 대처로 알맞은 것은?
    choices:
      - 필요 없으면 JDBC 계측을 꺼요
      - 모든 메서드에 @WithSpan을 붙여요
      - 에이전트를 실행 중에 다시 붙여요
      - JVM 힙을 줄여 GC를 자주 돌려요
    answer: 0
    explain: 부하는 span 수에 따라 커져요. 샘플링으로 줄이거나, span을 많이 만드는 계측을 꺼요.
  - id: agent-option-name
    type: input
    prompt: 자바 앱을 시작할 때 에이전트 JAR 파일을 함께 띄우려면 실행 명령에 어떤 옵션을 넣을까요?
    answer: [-javaagent, javaagent]
    explain: -javaagent:에이전트.jar처럼 적어요. 넣기 어려우면 JAVA_TOOL_OPTIONS 환경 변수에 넣어요.
