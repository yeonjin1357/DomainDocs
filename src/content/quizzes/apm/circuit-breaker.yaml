questions:
  - id: fast-errors
    type: choice
    prompt: 결제 API 호출 에러가 급증했는데, 그 에러 응답은 3ms 만에 끝나요. 가장 그럴듯한 이유는?
    choices:
      - 서킷 브레이커가 열려 호출을 보내지 않고 바로 실패시켜요
      - 결제 API가 아주 빨라졌어요
      - 네트워크가 빨라졌어요
      - 재시도가 늘었어요
    answer: 0
    explain: 열린 동안의 호출은 상대에게 가지 않고 바로 예외로 끝나요. 그래서 에러는 늘고 응답은 짧아져요.
  - id: min-calls
    type: ox
    prompt: Resilience4j 기본 설정에서, 처음 들어온 호출 9번이 모두 실패하면 서킷이 열리나요?
    answer: false
    explain: 기본 최소 호출 수가 100번이라, 그만큼 쌓이기 전에는 실패율을 계산하지 않아요.
  - id: half-open
    type: choice
    prompt: 열린 서킷이 정한 시간을 기다린 뒤 가는 상태에서 하는 일은?
    choices:
      - 시험 호출 몇 개만 보내 보고, 결과에 따라 닫거나 다시 열어요
      - 모든 호출을 다시 보내요
      - 모든 호출을 계속 막아요
      - 실패율을 0으로 되돌려요
    answer: 0
    explain: 반열림에서는 정한 수만큼만 보내요. Resilience4j 기본값은 10번이에요.
  - id: failure-rate-minus-one
    type: ox
    prompt: resilience4j_circuitbreaker_failure_rate가 -1이면 실패가 하나도 없다는 뜻인가요?
    answer: false
    explain: -1은 최소 호출 수가 안 쌓여 아직 계산하지 않았다는 표시예요. 0%와 구분해서 보여 줘요.
  - id: breaker-name
    type: input
    prompt: 바깥 호출의 실패가 쌓이면 한동안 호출을 끊고 바로 실패시키는 장치는?
    answer: [서킷 브레이커, circuit breaker, 회로 차단기]
    term: apm/circuit-breaker
    explain: 아픈 서비스를 더 두드리지 않고, 기다리느라 스레드가 묶이지 않게 해서 장애가 번지는 걸 막아요.
