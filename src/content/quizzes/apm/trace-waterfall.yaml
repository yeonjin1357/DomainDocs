questions:
  - id: n-plus-one
    type: choice
    prompt: 워터폴에 같은 SELECT 막대가 75ms씩 8번 줄지어 이어져요. 무엇일까요?
    choices:
      - 항목마다 질의를 보내는 N+1
      - 잠금을 기다리다 재시도한 질의
      - 커넥션을 8번 다시 맺은 모습
      - GC 멈춤으로 쪼개진 질의
    answer: 0
    explain: 목록을 가져온 뒤 항목마다 질의를 하나씩 보내는 모양이에요. 한 번은 빨라도 8번이면 600ms라, 질의를 하나로 묶어 한 번에 가져와요.
  - id: empty-gap
    type: choice
    prompt: 워터폴에서 자식 막대가 하나도 없는 빈칸 200ms는 무엇일 수 있을까요?
    choices:
      - 앱 코드가 직접 쓴 시간이나 계측되지 않은 작업
      - 아무 일도 하지 않은 시간이라 무시해도 돼요
      - DB가 쓴 시간
      - 네트워크 에러로 생긴 틈
    answer: 0
    explain: 빈칸도 응답시간에 들어가요. 길다면 계측을 더하거나 프로파일러로 무엇을 하는지 봐요.
  - id: overlapping-spans
    type: ox
    prompt: 부모 구간 500ms 안에서 300ms짜리 외부 호출 두 개가 동시에 돌았어요. 자식 구간 시간을 더하면 부모 구간보다 길어지나요?
    answer: true
    explain: 300 + 300 = 600ms라 부모보다 길어요. 겹쳐 돈 시간이 두 번 세어져서, 구간 비중을 낼 때는 겹치는 막대가 있는지 먼저 봐요.
  - id: client-vs-server-span
    type: choice
    prompt: 우리 쪽 CLIENT span은 300ms인데, 상대 서비스가 남긴 SERVER span은 120ms예요. 차이 180ms는 무엇일까요?
    choices:
      - 네트워크와 상대 앞단에서 쓴 시간
      - 우리 앱 코드가 그 사이 쓴 시간
      - 상대 서비스가 DB를 기다린 시간
      - 두 서버의 시계가 어긋난 값
    answer: 0
    explain: 상대의 SERVER span은 상대가 요청을 처리한 시간이라, 상대의 DB 시간도 그 안에 있어요. 두 길이는 각자 자기 시계로 재서 시계 차이와도 상관없어요.
  - id: longest-bar-trap
    type: ox
    prompt: 워터폴에 300ms 막대 하나와, 같은 SQL 막대 50ms가 8번 차례로 있어요. 300ms 막대를 없애면, SQL 8번을 한 번으로 묶을 때보다 응답시간이 더 줄어드나요?
    answer: false
    explain: SQL 8번은 400ms라 한 번(50ms)으로 묶으면 350ms가 줄어요. 300ms 막대를 없애면 300ms만 줄어서, 짧은 막대의 반복이 더 커요.
