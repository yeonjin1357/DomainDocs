questions:
  - id: n-plus-one
    type: choice
    prompt: 워터폴에 같은 SELECT 막대가 75ms씩 8번 줄지어 이어져요. 무엇일까요?
    choices:
      - 목록을 가져온 뒤 항목마다 질의를 하나씩 보내는 N+1 질의
      - DB 잠금을 기다리는 모습
      - 네트워크 재전송
      - GC 멈춤
    answer: 0
    explain: 한 번은 빨라도 8번이면 600ms예요. 질의를 하나로 묶어 한 번에 가져와요.
  - id: empty-gap
    type: choice
    prompt: 워터폴에서 자식 막대가 하나도 없는 빈칸 200ms는 무엇일 수 있을까요?
    choices:
      - 앱 코드가 직접 쓴 시간이나 계측되지 않은 작업
      - 아무 일도 하지 않은 시간이라 무시해도 돼요
      - DB가 쓴 시간
      - 네트워크 오류로 생긴 틈
    answer: 0
    explain: 빈칸도 응답시간에 들어가요. 길다면 계측을 더하거나 프로파일러로 무엇을 하는지 봐요.
  - id: overlapping-spans
    type: ox
    prompt: 동시에 도는 구간이 있으면, 자식 구간의 시간을 모두 더한 값이 부모 구간보다 클 수 있나요?
    answer: true
    explain: 겹쳐 돈 시간이 두 번 세어져서 그래요. 구간 비중을 낼 때는 겹치는 막대가 있는지 먼저 봐요.
  - id: client-vs-server-span
    type: choice
    prompt: 우리 쪽 CLIENT span은 300ms인데, 상대 서비스가 남긴 SERVER span은 120ms예요. 차이 180ms는 무엇일까요?
    choices:
      - 오가는 네트워크와 상대 앞단에서 기다린 시간
      - 우리 앱 코드가 쓴 시간
      - 상대 서비스의 DB 시간
      - 계측 오류
    answer: 0
    explain: 상대의 SERVER span은 상대가 요청을 처리한 시간이에요. 그 바깥에서 쓴 시간이 둘의 차이예요.
  - id: longest-bar-trap
    type: ox
    prompt: 워터폴에서 가장 긴 막대 하나를 줄이면, 언제나 응답시간이 가장 많이 줄어드나요?
    answer: false
    explain: 짧은 막대가 여러 번 반복되면 그 합이 더 클 수 있어요. 동시에 돈 구간 중 짧은 쪽은 줄여도 응답시간이 그대로예요.
