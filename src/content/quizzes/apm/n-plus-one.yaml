questions:
  - id: fast-sql-slow-request
    type: choice
    prompt: 주문 목록 API가 1.2초인데, 그 요청의 SQL은 모두 하나에 2ms 안쪽이에요. 가장 먼저 의심할 것은?
    choices:
      - 같은 SQL을 수백 번 부르는 것
      - 인덱스가 빠진 큰 테이블
      - DB 서버의 CPU 포화
      - SQL 결과를 캐시하지 않은 것
    answer: 0
    explain: SQL 하나는 빨라도 수백 번이면 합이 커요. 이런 N+1은 트레이스에서 같은 SQL 막대가 줄지어 있는지로 봐요.
  - id: top-sql-sign
    type: choice
    prompt: Top SQL에서 N+1을 의심할 만한 SQL은?
    choices:
      - 호출 수는 많고 한 번은 짧은 SQL
      - 호출 수는 적고 한 번이 아주 긴 SQL
      - 읽은 행 수가 가장 많은 SQL
      - 에러가 가장 많은 SQL
    answer: 0
    explain: 호출 수를 같은 시간의 요청 수로 나누면 요청 하나가 몇 번 부르는지 나와요. 100이면 요청마다 100번이에요.
  - id: lazy-hidden
    type: ox
    prompt: 목록을 도는 반복문 안에 SQL 문장이 하나도 없으면, 그 반복문은 SQL을 보내지 않나요?
    answer: false
    explain: ORM의 지연 로딩은 연관 객체를 읽는 순간 SQL을 보내요. 반복문 안에서 order.getCustomer() 같은 연관 객체를 읽는 곳이 범인이에요.
  - id: best-fix
    type: choice
    prompt: Hibernate 문서가 N+1을 피하는 기본 방법으로 권하는 것은?
    choices:
      - 조인으로 함께 가져오기
      - 배치로 묶어 가져오기
      - 연관을 EAGER로 바꾸기
      - 2차 캐시에 담아 두기
    answer: 0
    explain: JPA라면 join fetch예요. 배치는 SQL 수를 줄일 뿐 없애지 못하고, EAGER로 바꿔도 JPQL 질의에서는 연관마다 SQL이 따로 나가요.
  - id: lazy-loading-name
    type: input
    prompt: 연관 객체를 처음 읽는 순간에야 DB에서 가져오는 ORM의 로딩 방식은?
    answer: [지연 로딩, lazy loading, LAZY]
    term: apm/lazy-loading
    explain: JPA 3.2에서는 OneToMany와 ManyToMany의 기본값이에요. 목록을 돌며 읽으면 항목마다 SQL이 나가요.
