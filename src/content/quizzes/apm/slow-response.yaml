questions:
  - id: all-endpoints-slow
    type: choice
    prompt: 모든 엔드포인트가 같은 시각부터 함께 느려졌어요. 먼저 의심할 것은?
    choices:
      - 모두가 함께 쓰는 자원
      - 가장 느린 기능의 코드
      - 한 기능만 부르는 외부 API
      - 사용자 쪽 브라우저
    answer: 0
    explain: 모두가 함께 느려졌다면 함께 쓰는 DB, 네트워크, 서버 자원이 원인일 가능성이 커요. 한 엔드포인트만 느리면 그 기능 쪽을 봐요.
  - id: rollback-first
    type: choice
    prompt: 느려진 시각에 배포가 있었고, 되돌릴 수 있어요. 가장 먼저 할 일은?
    choices:
      - 원인을 찾기 전에 되돌려 피해부터 멈춰요
      - 원인을 끝까지 찾은 뒤 고쳐서 다시 배포해요
      - 서버 대수를 늘려요
      - 응답시간 알림을 잠시 꺼요
    answer: 0
    explain: 문제 해결의 첫째 일은 피해를 멈추는 거예요. 되돌릴 수 있다면 먼저 되돌리고 원인은 그다음에 찾아요.
  - id: service-wide-p95
    type: ox
    prompt: 요청의 3%를 차지하는 엔드포인트만 1.5초로 느려졌고, 나머지 97%는 모두 300ms 안쪽이에요. 서비스 전체 p95도 1.5초 가까이 오르나요?
    answer: false
    explain: 느린 요청이 5%보다 적어서, 전체 p95는 나머지 97% 안에 있는 300ms 안쪽 값이에요. 그래서 알림은 엔드포인트마다 p95를 나눠 걸어요.
  - id: correlation-not-cause
    type: choice
    prompt: 느려진 시각에 DB CPU도 함께 올랐어요. 이걸 원인으로 보고 고쳤다면, 마지막으로 확인할 것은?
    choices:
      - p95가 평소로 돌아왔는지
      - DB CPU가 내려갔는지
      - 응답시간 알림이 멈췄는지
      - 같은 시각의 로그가 줄었는지
    answer: 0
    explain: 함께 움직였다고 원인은 아니에요. DB CPU만 내려가고 응답시간은 그대로일 수 있어서, 엔드포인트별 p95가 돌아오는지까지 봐요.
