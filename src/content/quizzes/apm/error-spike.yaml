questions:
  - id: rate-not-count
    type: choice
    prompt: 에러가 분당 30건에서 300건이 됐는데, 요청도 분당 6,000건에서 60,000건이 됐어요. 에러율은?
    choices:
      - 0.5% 그대로예요
      - 10배로 올랐어요
      - 5%로 올랐어요
      - 0.05%로 내려갔어요
    answer: 0
    explain: 30 ÷ 6,000과 300 ÷ 60,000은 모두 0.5%예요. 이때는 요청이 왜 늘었는지, 늘어난 요청을 감당하는지를 봐요.
  - id: count-alert-miss
    type: ox
    prompt: 에러 알림을 '분당 300건 이상'처럼 에러 수에 걸면, 요청이 분당 200건인 새벽에 모두 실패해도 울리지 않을 수 있나요?
    answer: true
    explain: 요청이 적으면 모두 실패해도 에러 수는 작아요. 그래서 알림은 에러율에 걸어요.
  - id: first-failing-span
    type: choice
    prompt: 에러 트레이스에서 우리 서비스의 span과, 그 아래 결제 API 호출 span이 모두 에러예요. 먼저 볼 곳은?
    choices:
      - 결제 API
      - 우리 서비스 코드
      - 앞단 로드 밸런서
      - 사용자 브라우저
    answer: 0
    explain: 부모의 에러가 자식의 실패에서 왔다면 출발점은 자식이에요. 결제 API가 실패해서 우리도 500을 낸 거예요.
  - id: new-error-type
    type: choice
    prompt: 오후 3시부터 처음 보는 에러 종류가 나타났어요. 먼저 볼 것은?
    choices:
      - 그 시각의 배포나 설정 변경
      - 서버의 CPU 사용률
      - 디스크 용량
      - DNS 레코드의 TTL
    answer: 0
    explain: 최근 변경은 원인 찾기를 시작하기 좋은 곳이에요. 되돌릴 수 있다면 먼저 되돌려 피해부터 멈춰요.
  - id: head-sampling-errors
    type: ox
    prompt: 트레이스를 10%만 남기는 head 샘플링을 쓰면, 에러 요청의 트레이스도 대부분 빠지나요?
    answer: true
    explain: head 샘플링은 요청이 시작할 때 남길지 정해서, 에러가 날지 모른 채 골라요. 그래서 에러 트레이스도 90%가 빠져요.
