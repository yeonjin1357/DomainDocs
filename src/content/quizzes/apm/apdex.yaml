questions:
  - id: apdex-calc
    type: choice
    prompt: T가 0.5초이고, 요청 1,000건 중 만족 800건, 허용 100건, 불만 100건이에요. Apdex 점수는?
    choices:
      - "0.85"
      - "0.80"
      - "0.90"
      - "0.95"
    answer: 0
    explain: 점수는 (만족 + 허용 ÷ 2) ÷ 전체예요. (800 + 50) ÷ 1,000 = 0.85예요.
  - id: tolerating-range
    type: choice
    prompt: T가 0.5초일 때 '허용'으로 세는 응답시간은?
    choices:
      - 0.5초 초과 2초 이하
      - 0.5초 이하
      - 0.5초 초과 1초 이하
      - 2초 초과
    answer: 0
    explain: T 이하는 만족, T 초과 4T 이하는 허용, 4T를 넘으면 불만이에요. 4T는 2초예요.
  - id: compare-needs-same-t
    type: ox
    prompt: T가 서로 다른 두 서비스의 Apdex 점수를 그대로 견줄 수 있나요?
    answer: false
    explain: 같은 요청도 T가 바뀌면 점수가 달라져요. 그래서 점수는 0.85 [0.5]처럼 T와 함께 읽어요.
  - id: slower-same-score
    type: ox
    prompt: 이미 4T를 넘은 요청이 3초에서 30초로 더 느려져도, Apdex 점수는 그대로인가요?
    answer: true
    explain: 4T를 넘으면 3초든 30초든 같은 불만 한 건이에요. 얼마나 느린지는 p99와 함께 봐요.
  - id: weighted-merge
    type: choice
    prompt: 요청 9,000건에 0.95인 서비스와 1,000건에 0.50인 서비스가 있어요. 요청을 모두 모아 계산한 전체 Apdex는?
    choices:
      - "0.905"
      - "0.725"
      - "0.95"
      - "0.50"
    answer: 0
    explain: 0.95 × 9,000 + 0.50 × 1,000 = 9,050이고, 10,000으로 나누면 0.905예요. 두 점수를 그냥 평균 낸 0.725는 틀린 값이에요.
