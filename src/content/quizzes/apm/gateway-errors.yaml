questions:
  - id: who-made-it
    type: ox
    prompt: nginx 뒤의 WAS가 응답을 늦게 줘 nginx가 504를 돌려줬다면, WAS의 에러 로그에도 504가 남나요?
    answer: false
    explain: 504는 기다리다 그만둔 nginx가 만든 응답이라 WAS는 몰라요. 웹 서버의 접근 로그와 오류 로그에서 세요.
  - id: log-to-code
    type: choice
    prompt: nginx 오류 로그에 connect() failed (111 Connection refused)가 가득해요. 무슨 일일까요?
    choices:
      - WAS 포트에 받는 프로그램이 없어 502가 나요
      - WAS가 60초 안에 답하지 않아 504가 나요
      - 클라이언트가 먼저 연결을 끊었어요
      - 인증서가 만료됐어요
    answer: 0
    explain: 연결 거부는 그 포트에 받는 프로그램이 없다는 뜻이에요. WAS가 죽었거나 다시 시작하는 중인지 봐요.
  - id: read-timeout-meaning
    type: ox
    prompt: nginx의 proxy_read_timeout 60초는, WAS가 응답 전체를 60초 안에 다 보내야 한다는 뜻인가요?
    answer: false
    explain: 두 번 읽는 사이에 아무것도 오지 않은 시간이에요. 조금씩이라도 계속 보내면 60초가 넘어도 끊지 않아요.
  - id: next-upstream-retry
    type: choice
    prompt: 느린 GET 요청이 WAS 두 대의 로그에 모두 남았어요. nginx 기본 설정에서 왜 그럴까요?
    choices:
      - 시간 초과 뒤 같은 요청을 다음 WAS로 다시 보내서요
      - 사용자가 버튼을 두 번 눌러서요
      - 로드 밸런서가 요청을 복제해서요
      - WAS가 요청을 서로 넘겨서요
    answer: 0
    explain: 기본값 proxy_next_upstream error timeout 때문이에요. POST 같은 멱등이 아닌 요청은 기본으로 다시 보내지 않아요.
  - id: keepalive-mismatch
    type: choice
    prompt: 502가 트래픽과 상관없이 아주 낮은 비율로 꾸준히 나요. WAS는 Node.js 기본 설정이에요. 무엇을 의심할까요?
    choices:
      - WAS가 쉬는 연결을 웹 서버보다 먼저 닫는 keep-alive 시간 차이
      - WAS의 힙 메모리 부족
      - DNS 조회 실패
      - 디스크 공간 부족
    answer: 0
    explain: Node.js는 기본으로 5초 쉬면 연결을 닫아요. 웹 서버가 그 연결을 다시 쓰려다 502가 나요. WAS 쪽 시간을 더 길게 잡아요.
