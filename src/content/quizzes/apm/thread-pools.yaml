questions:
  - id: concurrency-calc
    type: choice
    prompt: 초당 100건의 요청이 들어오고, 하나에 평균 0.5초가 걸려요. 동시에 처리 중인 요청은 평균 몇 개일까요?
    choices:
      - 50개
      - 200개
      - 0.5개
      - 100개
    answer: 0
    explain: 동시에 처리 중인 수는 처리량 × 응답시간이에요. 100 × 0.5 = 50개예요.
  - id: slow-db-queue
    type: choice
    prompt: 스레드가 200개인 WAS에 초당 100건이 와요. DB가 느려져 응답이 평균 3초가 되면 어떻게 될까요?
    choices:
      - 동시에 300개가 필요해서, 넘치는 요청은 대기열에서 기다려요
      - 스레드가 300개로 저절로 늘어나요
      - 응답시간은 3초 그대로 유지돼요
      - 처리량이 초당 300건으로 늘어요
    answer: 0
    explain: 100 × 3 = 300개가 동시에 필요하지만 스레드는 200개예요. 나머지는 줄을 서고, 기다린 만큼 응답이 더 느려져요.
  - id: waiting-thread-held
    type: ox
    prompt: DB 응답을 기다리느라 CPU를 쓰지 않는 스레드는, 그동안 다른 요청을 처리하러 반납되나요?
    answer: false
    explain: 보통의 WAS 스레드는 기다리는 동안에도 그 요청에 묶여 있어요. 그래서 느린 곳이 스레드를 붙잡아요.
  - id: unbounded-queue-trap
    type: choice
    prompt: 자바 스레드 풀을 기본 10개, 최대 100개, 크기 제한 없는 대기열로 만들었어요. 요청이 몰리면 스레드는 몇 개까지 늘까요?
    choices:
      - 10개
      - 100개
      - 110개
      - 끝없이 늘어요
    answer: 0
    explain: 대기열이 차지 않으니 새 일은 계속 대기열로 가요. 그래서 기본 10개를 넘지 않고, 최대 100은 쓰이지 않아요.
  - id: one-slow-api
    type: choice
    prompt: 외부 API 하나가 느려지자, 그 API를 부르지 않는 요청까지 느려졌어요. 왜일까요?
    choices:
      - 그 API를 기다리는 요청들이 스레드를 붙잡아 스레드가 바닥났어요
      - 외부 API가 우리 DB를 잠갔어요
      - 서버 CPU가 꽉 찼어요
      - 네트워크가 끊겼어요
    answer: 0
    explain: 스레드가 모두 묶이면 상관없는 요청도 대기열에서 기다려요. 외부 호출에 타임아웃을 둬서 묶이는 시간을 줄여요.
