questions:
  - id: tomcat-order
    type: ox
    prompt: Tomcat의 요청 처리 스레드 풀도 자바 표준 풀처럼, 대기열이 다 찬 뒤에야 스레드를 maxThreads까지 늘리나요?
    answer: false
    explain: Tomcat은 순서가 반대예요. 스레드부터 maxThreads까지 늘리고, 스레드가 다 찬 뒤에야 줄을 세워요.
  - id: slow-db-queue
    type: choice
    prompt: 스레드가 200개인 WAS에 초당 100건이 와요. DB가 느려져 응답이 평균 3초가 되면 어떻게 될까요?
    choices:
      - 넘치는 100개가 대기열에서 기다려요
      - 스레드가 300개로 저절로 늘어나요
      - 응답시간은 3초 그대로 유지돼요
      - 처리량이 초당 300건으로 늘어요
    answer: 0
    explain: 100 × 3 = 300개가 동시에 필요하지만 스레드는 200개예요. 나머지는 줄을 서고, 기다린 만큼 응답이 더 느려져요.
  - id: waiting-thread-held
    type: ox
    prompt: DB 응답을 기다리느라 CPU를 쓰지 않는 동안에도, 보통의 WAS 스레드는 그 요청에 묶여 있나요?
    answer: true
    explain: 보통의 WAS 스레드는 기다리는 동안에도 반납되지 않아요. 그래서 느린 곳이 스레드를 붙잡아요.
  - id: unbounded-queue-trap
    type: choice
    prompt: 자바 스레드 풀을 기본 10개, 최대 100개, 크기 제한 없는 대기열로 만들었어요. 요청이 몰리면 스레드는 몇 개까지 늘까요?
    choices:
      - 10개
      - 100개
      - 110개
      - 끝없이 늘어요
    answer: 0
    explain: 자바 표준 풀은 대기열이 차야 스레드를 더 늘려요. 대기열이 차지 않으니 기본 10개를 넘지 않고, 최대 100은 쓰이지 않아요.
  - id: one-slow-api
    type: choice
    prompt: 외부 API 하나가 느려지자, 그 API를 부르지 않는 요청까지 느려졌어요. 왜일까요?
    choices:
      - 기다리는 요청들이 스레드를 다 붙잡아서
      - 외부 API가 우리 DB 연결을 잠가서
      - 기다리는 동안 서버 CPU가 꽉 차서
      - 같은 네트워크 회선을 함께 써서
    answer: 0
    explain: 스레드가 모두 묶이면 상관없는 요청도 대기열에서 기다려요. 기다리는 스레드는 CPU를 쓰지 않아서, CPU는 오히려 한가할 수 있어요.
