questions:
  - id: lcp-threshold
    type: choice
    prompt: Core Web Vitals에서 LCP가 '좋음'인 기준은?
    choices:
      - 2.5초 이하
      - 200ms 이하
      - 0.1 이하
      - 5초 이하
    answer: 0
    explain: LCP는 가장 큰 콘텐츠가 그려지기까지예요. INP는 200ms, CLS는 0.1이 좋음 기준이에요.
  - id: fast-server-slow-page
    type: ox
    prompt: APM이 재는 서버 응답시간에는, 브라우저가 CSS와 자바스크립트를 받아 화면을 그리는 시간이 빠져 있나요?
    answer: true
    explain: 서버 응답은 첫 바이트까지의 일부일 뿐이에요. 그 뒤에 받고 실행하고 그리는 시간이 훨씬 길 수 있어서, 서버가 빨라도 화면은 느릴 수 있어요.
  - id: p75-aggregation
    type: choice
    prompt: Core Web Vitals를 볼 때 web.dev가 권하는 집계 방식은?
    choices:
      - 페이지 로딩의 75번째 백분위수
      - 평균
      - 최댓값
      - 중앙값(50번째 백분위수)
    answer: 0
    explain: 평균은 느린 사용자를 가려요. 75번째 백분위수로 보고, 모바일과 데스크톱도 나눠서 봐요.
  - id: blocking-script
    type: choice
    prompt: 브라우저가 HTML을 읽다가 async나 defer가 없는 script를 만나면 어떻게 할까요?
    choices:
      - 해석을 멈추고 스크립트부터 실행해요
      - 스크립트는 나중에 받고 해석을 이어 가요
      - 스크립트를 건너뛰고 해석을 이어 가요
      - 화면을 다 그린 뒤에 스크립트를 받아요
    answer: 0
    explain: 이런 스크립트는 받아서 실행할 때까지 HTML 해석을 막아요. 그래서 페이지 위쪽의 큰 스크립트 하나가 화면 전체를 늦출 수 있어요.
  - id: rum-name
    type: input
    prompt: 실제 사용자의 브라우저에서 페이지 구간별 시각을 모아 서버로 보내는 모니터링 방식의 약어는?
    answer: [RUM, 실제 사용자 모니터링]
    explain: RUM은 실제 사용자의 기기와 네트워크에서 걸린 시간을 보여 줘요. 정해 둔 곳에서 재는 외부 감시와는 숫자가 달라요.
