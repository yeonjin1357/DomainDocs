questions:
  - id: tombstone
    type: ox
    prompt: 로그 압축 토픽에서, 키는 있고 값이 비어 있는 이벤트는 "이 키를 지워 달라"는 표시인가요?
    answer: true
    explain: 이걸 툼스톤이라고 불러요. 같은 키의 옛 이벤트를 지우게 하고, 일정 시간(기본 1일)이 지나면 툼스톤 자신도 지워져요.
  - id: retention-default
    type: choice
    prompt: 토픽의 retention.ms를 따로 정하지 않으면, 기본 보관 기간은?
    choices:
      - 7일
      - 1일
      - 30일
      - 제한 없음
    answer: 0
    explain: 기본은 7일이에요. 크기 제한인 retention.bytes는 기본으로 없어요.
  - id: segment-granularity
    type: choice
    prompt: 보관 기간을 줄였는데 브로커 디스크가 바로 줄지 않아요. 왜일까요?
    choices:
      - 세그먼트를 통째로 지워서
      - 설정이 아직 저장되지 않아서
      - 컨슈머가 읽는 중이라 못 지워서
      - 복제본마다 하루씩 걸려서
    answer: 0
    explain: 세그먼트 파일 단위로 지워서, 기간이 안 지난 이벤트가 하나라도 있으면 그 세그먼트는 남아요. 활성 세그먼트도 닫히기 전에는 지우지 않아요.
  - id: compact-latest
    type: choice
    prompt: 사용자마다 마지막으로 바뀐 이메일만 있으면 되는 토픽이에요. cleanup.policy를 무엇으로 둘까요?
    choices:
      - compact
      - delete
      - retention.bytes만 걸기
      - retention.ms를 늘리기
    answer: 0
    explain: compact(로그 압축)는 같은 키의 옛 이벤트를 지우고 키마다 마지막 값은 남겨요. 그래서 키가 꼭 있어야 해요.
  - id: skipped-after-stop
    type: choice
    prompt: 오래 멈춰 있던 컨슈머가 다시 뜨자, 일부 이벤트를 건너뛰었어요. 왜일까요?
    choices:
      - 안 읽은 이벤트가 지워져서
      - 그사이 리밸런스가 일어나서
      - 프로듀서 멱등성이 꺼져서
      - 프로듀서가 acks=0이라서
    answer: 0
    explain: 보관 기간은 컨슈머가 읽어야 하는 마감이기도 해요. 그사이 기간이 지나 지워지면 auto.offset.reset에 따라 다른 위치로 건너뛰어요.
