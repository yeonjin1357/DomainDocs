questions:
  - id: slower-processing
    type: choice
    prompt: 들어오는 이벤트 속도는 그대로인데, 컨슈머의 처리 속도가 절반으로 줄었어요. 먼저 볼 것은?
    choices:
      - 컨슈머가 부르는 DB나 바깥 API가 느려졌는지
      - 프로듀서가 이벤트를 더 많이 보내는지
      - 토픽의 보관 기간
      - 프로듀서의 acks 설정
    answer: 0
    explain: 처리 속도가 줄었다면 이벤트 하나를 처리하는 데 더 오래 걸리는 거예요. 컨슈머가 기다리는 쪽부터 봐요.
  - id: one-consumer-behind
    type: choice
    prompt: 한 컨슈머가 맡은 파티션들만 지연이 쌓여요. 먼저 볼 곳은?
    choices:
      - 그 컨슈머가 도는 서버와 프로세스
      - 그룹의 모든 컨슈머
      - 프로듀서 설정
      - 토픽의 파티션 수
    answer: 0
    explain: 파티션 하나는 그룹 안의 컨슈머 하나만 맡아요. 그 컨슈머가 느리면 그 파티션들만 밀려요.
  - id: stuck-offset
    type: choice
    prompt: 지연이 남아 있는데, 한 파티션의 처리 위치가 몇 분째 그대로예요. 무슨 뜻일까요?
    choices:
      - 그 파티션의 컨슈머가 멈췄어요
      - 그 파티션에 이벤트가 더 안 들어와요
      - 아주 잘 처리되고 있어요
      - 보관 기간이 지났어요
    answer: 0
    explain: 같은 이벤트에서 계속 실패하거나, 바깥 호출에서 끝없이 기다리는 경우가 흔해요. 컨슈머 로그를 봐요.
  - id: more-consumers-than-partitions
    type: ox
    prompt: 파티션이 8개인 토픽에서 컨슈머를 8개에서 12개로 늘리면, 처리 능력이 1.5배가 되나요?
    answer: false
    explain: 그룹 안에서 일하는 컨슈머는 파티션 수를 넘지 못해요. 늘린 4개는 맡을 파티션 없이 놀아요.
  - id: catch-up-time
    type: choice
    prompt: 지연이 50만 건이고, 처리 속도가 들어오는 속도보다 초당 100건 빨라요. 따라잡는 데 얼마나 걸릴까요?
    choices:
      - 약 83분
      - 약 8분
      - 약 14시간
      - 영영 따라잡지 못해요
    answer: 0
    explain: 500,000 ÷ 100 = 5,000초, 약 83분이에요. 이 시간이 보관 기간보다 짧은지도 함께 봐요.
