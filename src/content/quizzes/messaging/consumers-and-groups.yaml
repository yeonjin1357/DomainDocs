questions:
  - id: commit-after-process
    type: choice
    prompt: 이벤트를 처리한 뒤에 커밋하는 컨슈머가, 커밋 직전에 죽었어요. 다시 뜨면 어떻게 될까요?
    choices:
      - 그 이벤트를 다시 처리해요
      - 그 이벤트를 건너뛰어요
      - 토픽의 처음부터 모두 다시 읽어요
      - 그룹이 사라져 읽지 못해요
    answer: 0
    explain: 다시 뜨면 커밋된 위치부터 읽어요. 처리는 했지만 커밋을 못 했으니 같은 이벤트를 다시 처리해요.
  - id: latest-default
    type: choice
    prompt: 새 컨슈머 그룹을 띄웠는데, 토픽에 남아 있는 예전 이벤트를 하나도 읽지 않아요. 왜일까요?
    choices:
      - auto.offset.reset 기본값이 latest라서
      - 보관 기간이 지나 모두 지워져서
      - 파티션이 하나뿐이라서
      - 리밸런스가 끝나지 않아서
    answer: 0
    explain: 커밋된 위치가 없으면 기본으로 지금부터 들어오는 이벤트만 읽어요. 예전 것부터 읽으려면 earliest로 둬요.
  - id: slow-processing-rebalance
    type: choice
    prompt: 이벤트 하나를 처리하는 데 오래 걸리자, 리밸런스가 자꾸 일어나요. 관련된 설정은?
    choices:
      - max.poll.interval.ms(기본 5분)
      - session.timeout.ms
      - auto.offset.reset
      - batch.size
    answer: 0
    explain: 다음 이벤트를 이 시간 안에 가져가지 않으면 그룹을 떠나요. 하트비트는 잘 보내도 처리가 길면 빠져요.
  - id: pull-model
    type: ox
    prompt: Kafka는 브로커가 컨슈머에게 이벤트를 밀어주는 방식인가요?
    answer: false
    explain: 컨슈머가 자기 속도로 당겨 가요. 그래서 컨슈머가 느려도 브로커가 덮치지 않고, 뒤처졌다가 따라잡을 수 있어요.
  - id: rebalance-name
    type: input
    prompt: 컨슈머가 죽거나 새로 들어와 그룹 구성원이 바뀌면, 파티션을 다시 나눠요. 이 일을 무엇이라고 하나요?
    answer: [리밸런스, 리밸런싱, rebalance, rebalancing, 재조정]
    explain: 리밸런스 동안에는 파티션을 옮기느라 처리가 잠시 멈출 수 있어요. 너무 잦으면 지연이 늘어요.
