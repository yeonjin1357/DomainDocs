questions:
  - id: poll-interval-exceeded
    type: choice
    prompt: 컨슈머가 죽지 않았는데도 리밸런스가 자꾸 일어나요. 가장 흔한 원인은?
    choices:
      - 가져온 이벤트를 처리하는 데 max.poll.interval.ms(기본 5분)보다 오래 걸려요
      - 토픽의 파티션이 너무 많아요
      - 토픽의 보관 기간이 짧아요
      - 프로듀서가 acks=all로 보내요
    answer: 0
    explain: 다음 이벤트를 제때 가져가지 않으면 하트비트가 살아 있어도 스스로 그룹을 떠나요.
  - id: reduce-poll-records
    type: choice
    prompt: 한 번에 처리하는 시간을 줄여 리밸런스를 막으려면, 어떤 설정을 줄일까요?
    choices:
      - max.poll.records(기본 500)
      - session.timeout.ms
      - retention.ms
      - batch.size
    answer: 0
    explain: 한 번에 가져오는 이벤트 수를 줄이면, 다음에 가져가기까지의 처리 시간이 짧아져요.
  - id: rebalance-duplicates
    type: ox
    prompt: 리밸런스가 잦으면, 같은 이벤트가 다시 처리되는 일도 늘어날 수 있나요?
    answer: true
    explain: 커밋하지 못한 이벤트는 파티션을 넘겨받은 다른 컨슈머가 다시 처리해요.
  - id: static-membership
    type: choice
    prompt: 컨슈머 10개를 하나씩 재시작하는 배포가 리밸런스를 많이 일으켜요. 줄이는 방법은?
    choices:
      - 컨슈머마다 group.instance.id를 줘 고정 멤버로 만들어요
      - 토픽의 파티션을 줄여요
      - 프로듀서의 acks를 1로 낮춰요
      - 토픽의 보관 기간을 늘려요
    answer: 0
    explain: 고정 멤버는 넉넉한 세션 제한 시간과 함께 쓰면, 잠깐의 재시작으로는 리밸런스가 일어나지 않아요.
  - id: gc-pause-leaves
    type: choice
    prompt: 자바 컨슈머가 자주 그룹에서 빠져요. 함께 볼 것은?
    choices:
      - 그 시각의 GC 멈춤
      - 토픽의 보관 기간
      - 프로듀서의 배치 크기
      - 브로커 대수
    answer: 0
    explain: 긴 GC 멈춤은 프로세스를 통째로 세워 하트비트까지 멈추게 해요. 그러면 세션 제한 시간을 넘겨 그룹에서 빠져요.
