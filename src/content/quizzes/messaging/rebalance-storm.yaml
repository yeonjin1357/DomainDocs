questions:
  - id: poll-interval-exceeded
    type: choice
    prompt: 컨슈머가 죽지 않았는데도 리밸런스가 자꾸 일어나요. 가장 흔한 원인은?
    choices:
      - 처리가 poll 간격 한도를 넘겨서
      - 토픽의 파티션이 너무 많아서
      - 토픽의 보관 기간이 짧아서
      - 프로듀서가 acks=all로 보내서
    answer: 0
    explain: max.poll.interval.ms(기본 5분) 안에 다음 이벤트를 가져가지 않으면, 하트비트가 살아 있어도 스스로 그룹을 떠나요.
  - id: reduce-poll-records
    type: choice
    prompt: 한 번에 처리하는 시간을 줄여 리밸런스를 막으려면, 어떤 설정을 줄일까요?
    choices:
      - max.poll.records
      - session.timeout.ms
      - retention.ms
      - batch.size
    answer: 0
    explain: 한 번에 가져오는 이벤트 수(기본 500)를 줄이면, 다음에 가져가기까지의 처리 시간이 짧아져요.
  - id: rebalance-duplicates
    type: ox
    prompt: 리밸런스로 파티션을 넘겨받은 컨슈머는, 앞 컨슈머가 처리했지만 커밋하지 못한 이벤트부터 다시 읽나요?
    answer: true
    explain: 새 컨슈머는 커밋된 위치부터 읽어서, 커밋하지 못한 이벤트를 다시 처리해요. 그래서 리밸런스가 잦을수록 중복 처리도 늘어요.
  - id: static-membership
    type: choice
    prompt: 컨슈머 10개를 하나씩 재시작하는 배포가 리밸런스를 많이 일으켜요. 줄이는 방법은?
    choices:
      - 컨슈머마다 고정 ID를 줘요
      - 토픽의 파티션을 줄여요
      - 프로듀서 acks를 1로 낮춰요
      - 토픽 보관 기간을 늘려요
    answer: 0
    explain: group.instance.id를 준 고정 멤버는 넉넉한 세션 제한 시간과 함께 쓰면, 잠깐의 재시작으로는 리밸런스가 일어나지 않아요.
  - id: gc-pause-leaves
    type: choice
    prompt: 자바 컨슈머가 자주 그룹에서 빠져요. 함께 볼 것은?
    choices:
      - 그 시각의 GC 멈춤
      - 토픽의 보관 기간
      - 프로듀서의 배치 크기
      - 브로커 대수
    answer: 0
    explain: 긴 GC 멈춤은 프로세스를 통째로 세워 하트비트까지 멈추게 해요. 그러면 세션 제한 시간을 넘겨 그룹에서 빠져요.
