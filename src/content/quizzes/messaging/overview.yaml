questions:
  - id: kafka-keeps-events
    type: ox
    prompt: 컨슈머가 읽어 간 이벤트도, 보관 기간 동안 토픽에 그대로 남나요?
    answer: true
    explain: Kafka는 읽어 가도 지우지 않고, 토픽마다 정한 보관 기간 동안 남겨요. 그래서 필요하면 예전 이벤트를 다시 읽을 수 있어요.
  - id: separate-groups
    type: choice
    prompt: 결제 서비스와 알림 서비스가 같은 '주문됨' 이벤트를 각자 모두 받아야 해요. 어떻게 할까요?
    choices:
      - 두 서비스가 서로 다른 컨슈머 그룹을 써요
      - 두 서비스가 같은 컨슈머 그룹을 써요
      - 주문 서비스가 토픽을 두 개 만들어 따로 보내요
      - 파티션을 하나로 줄여요
    answer: 0
    explain: 그룹이 다르면 그룹마다 같은 이벤트를 모두 받아요. 같은 그룹 안에서는 이벤트 하나를 한 컨슈머만 처리해요.
  - id: buffer-when-slow
    type: choice
    prompt: 주문 서비스와 결제 서비스 사이에 메시지 큐를 뒀어요. 결제 서비스가 10분 멈추면 주문 서비스는 어떻게 될까요?
    choices:
      - 이벤트를 큐에 넣고 계속 주문을 받아요
      - 결제가 돌아올 때까지 함께 멈춰요
      - 큐가 결제 서비스로 이벤트를 밀어 넣어요
      - 그동안 넣은 주문 이벤트는 사라져요
    answer: 0
    explain: 보내는 쪽은 이벤트를 넣고 바로 다음 일을 해요. 이벤트는 큐에 쌓여 기다리고, 결제 서비스가 돌아오면 밀린 것을 따라잡아요.
  - id: broker-name
    type: input
    prompt: 이벤트를 저장하고 컨슈머에게 내주는 Kafka 서버를 무엇이라고 하나요?
    answer: [브로커, broker, Kafka broker, 카프카 브로커]
    explain: Kafka는 브로커 여러 대가 하나의 클러스터로 돌고, 이벤트를 여러 브로커에 복사해 둬요.
