questions:
  - id: vacuum-half-size
    type: ox
    prompt: PostgreSQL에서 표 전체에 고르게 흩어진 행 절반(id가 짝수인 행)을 DELETE하고 보통 VACUUM을 돌리면, 표 파일도 절반쯤으로 줄어드나요?
    answer: false
    explain: 보통 VACUUM은 죽은 행 자리를 다시 쓸 수 있게 표시할 뿐이에요. 표 끝의 페이지가 통째로 비었을 때만 줄고, 공간을 돌려받으려면 VACUUM FULL이 필요해요.
  - id: vacuum-full-cost
    type: choice
    prompt: 운영 중인 큰 표에 VACUUM FULL을 돌릴 때 조심할 점은?
    choices:
      - 끝날 때까지 그 표를 읽지도 쓰지도 못해요
      - 죽은 행은 남기고 인덱스만 다시 만들어요
      - 다른 표의 자동 VACUUM이 모두 멈춰요
      - 복제 서버로 가는 WAL이 끊겨요
    answer: 0
    explain: VACUUM FULL은 표를 새로 쓰는 동안 ACCESS EXCLUSIVE 잠금을 잡아요. 새 표를 다 쓸 때까지 옛 표도 남아 공간이 더 들어요.
  - id: what-blocks-cleanup
    type: choice
    prompt: 자동 VACUUM은 도는데 죽은 행이 계속 쌓여요. 무엇을 의심할까요?
    choices:
      - 몇 시간째 열려 있는 트랜잭션
      - VACUUM FULL을 돌리지 않음
      - 낡은 옵티마이저 통계
      - 높은 버퍼 캐시 적중률
    answer: 0
    explain: 누군가 아직 볼 수 있는 옛 행은 VACUUM이 지우지 못해요. VACUUM FULL도 마찬가지라, 오래 열린 트랜잭션이나 멈춘 슬롯부터 찾아요.
  - id: slot-wal-default
    type: ox
    prompt: PostgreSQL 기본 설정에는, 멈춘 복제 슬롯이 붙잡아 둘 수 있는 WAL 크기에 한도가 있나요?
    answer: false
    explain: max_slot_wal_keep_size 기본값이 -1이라 한도가 없어요. 멈춘 슬롯 하나가 디스크를 채울 수 있어요.
  - id: dead-tuple-term
    type: input
    prompt: PostgreSQL에서 바꾸거나 지운 행의 옛 버전으로, VACUUM이 치워야 하는 것을 뭐라고 부를까요?
    answer: [죽은 행, dead tuple, 데드 튜플, dead row, 죽은 튜플]
    explain: 다른 트랜잭션이 아직 볼 수 있어서 바로 지우지 않고 남겨 둔 행이에요. 쌓이면 표가 데이터보다 커져요.
