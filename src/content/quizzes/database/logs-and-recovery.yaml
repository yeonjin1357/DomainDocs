questions:
  - id: why-log-first
    type: choice
    prompt: DB가 커밋할 때 데이터 파일 대신 로그부터 쓰는 이유는?
    choices:
      - 로그는 끝에 이어 붙여 빨리 쓰고, 장애 뒤 그걸로 되살릴 수 있어서
      - 데이터 파일은 커밋 뒤에 지워지기 때문에
      - 로그에 쓰면 실행 계획을 다시 쓸 수 있어서
      - 로그가 버퍼 캐시보다 빨라서 조회도 로그에서 하기 때문에
    answer: 0
    explain: 바뀐 블록은 파일 여기저기에 흩어져 있어 매번 쓰면 느려요. 로그는 차례로 붙이기만 해서 빠르고, 복구의 재료가 돼요.
  - id: log-grows-causes
    type: choice
    prompt: 로그 디스크가 계속 차오를 때 원인이 아닌 것은?
    choices:
      - 버퍼 캐시 적중률이 높아서
      - 오래 열린 트랜잭션이 있어서
      - 로그 보관이나 백업이 계속 실패해서
      - 복제 서버가 로그를 받지 못하고 밀려서
    answer: 0
    explain: 로그는 아직 끝나지 않은 트랜잭션, 보관·백업, 복제에 필요하면 지우지 못해요. 적중률과는 상관없어요.
  - id: delete-big-log
    type: ox
    prompt: 로그 파일이 너무 커졌다면, 파일을 직접 지워 공간을 확보하는 게 안전한가요?
    answer: false
    explain: 아직 복구나 백업, 복제에 필요한 로그를 지우면 DB를 되살릴 수 없어요. 먼저 왜 비워지지 않는지 찾아요.
  - id: commit-per-row
    type: ox
    prompt: 반복문 안에서 행마다 커밋하면, 커밋할 때마다 로그 쓰기를 기다리느라 느려질 수 있나요?
    answer: true
    explain: 커밋은 로그가 디스크에 닿을 때까지 기다려요. 적당한 크기로 묶어 커밋하면 기다림이 줄어요.
  - id: wal-name
    type: input
    prompt: PostgreSQL에서 변경을 데이터 파일보다 먼저 적는 로그를 부르는 이름(약어)은?
    answer: [WAL, write-ahead log, write ahead log]
    explain: WAL은 로그 선행 기록(write-ahead logging)에서 온 이름이에요. Oracle과 MySQL InnoDB에서는 리두 로그라고 불러요.
