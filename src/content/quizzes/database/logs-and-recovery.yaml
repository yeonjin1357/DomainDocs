questions:
  - id: why-log-first
    type: choice
    prompt: DB가 커밋할 때 데이터 파일 대신 로그부터 쓰는 이유는?
    choices:
      - 로그는 끝에 이어 붙여 빨리 쓰고, 복구에도 쓸 수 있어서
      - 로그에 적으면 데이터 파일을 다시 쓸 필요가 없어서
      - 데이터 파일에 쓰면 다른 세션의 읽기를 모두 막아서
      - 로그가 버퍼 캐시보다 빨라서 조회도 로그에서 하기 때문에
    answer: 0
    explain: 바뀐 블록은 파일 여기저기에 흩어져 있어 매번 쓰면 느려요. 데이터 파일은 나중에 쓰고, 그사이 장애는 로그로 되살려요.
  - id: sqlserver-log-backup-ok
    type: choice
    prompt: 전체 복구 모델인 SQL Server의 트랜잭션 로그가 계속 커져요. 로그 백업은 잘 되고, 복제는 쓰지 않아요. 다음으로 볼 것은?
    choices:
      - 오래 열린 트랜잭션이 있는지
      - 버퍼 캐시 적중률이 떨어졌는지
      - 체크포인트가 너무 자주 도는지
      - 실행 계획 캐시가 가득 찼는지
    answer: 0
    explain: 로그 백업을 해도, 아직 끝나지 않은 트랜잭션이 쓴 로그는 비울 수 없어요. 오래 열린 트랜잭션 하나가 그 뒤의 로그를 모두 붙잡아요.
  - id: delete-big-log
    type: ox
    prompt: 체크포인트가 지났어도, 복제 서버가 아직 받지 못한 로그는 DB가 지우지 않고 남겨 두나요?
    answer: true
    explain: 복구·백업·복제에 아직 필요한 로그는 남겨 둬요. 이런 로그를 손으로 지우면 DB를 되살릴 수 없어서, 왜 안 비워지는지부터 찾아요.
  - id: commit-per-row
    type: ox
    prompt: 반복문 안에서 행마다 커밋하면, 커밋할 때마다 로그가 디스크에 닿기를 기다리나요?
    answer: true
    explain: 커밋은 로그가 디스크에 닿을 때까지 기다려요. 적당한 크기로 묶어 커밋하면 기다림이 줄어요.
  - id: wal-name
    type: input
    prompt: PostgreSQL에서 변경을 데이터 파일보다 먼저 적는 로그를 부르는 이름(약어)은?
    answer: [WAL, write-ahead log, write ahead log]
    explain: WAL은 로그 선행 기록(write-ahead logging)에서 온 이름이에요. Oracle과 MySQL InnoDB에서는 리두 로그라고 불러요.
