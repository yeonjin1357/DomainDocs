questions:
  - id: cancel-vs-terminate
    type: choice
    prompt: PostgreSQL에서 오래 도는 쿼리 하나만 멈추고, 앱의 연결은 살려 두려면?
    choices:
      - pg_cancel_backend(pid)
      - pg_terminate_backend(pid)
      - pg_blocking_pids(pid)
      - pg_reload_conf()
    answer: 0
    explain: pg_cancel_backend는 쿼리만 멈춰요. pg_terminate_backend는 연결째 끊어서 커넥션 풀이 새로 연결해야 해요.
  - id: aborted-tx
    type: ox
    prompt: 트랜잭션 안에서 쿼리를 취소당한 연결은, 다음 SQL을 바로 정상적으로 실행할 수 있나요?
    answer: false
    explain: 그 트랜잭션은 실패 상태라 current transaction is aborted 에러가 나요. ROLLBACK을 해야 다시 쓸 수 있어요.
  - id: mysql-rollback
    type: ox
    prompt: MySQL에서 큰 UPDATE를 KILL한 뒤 되돌리기가 오래 걸리면, DB를 재시작해서 빨리 끝낼 수 있나요?
    answer: false
    explain: MySQL 문서는 프로세스를 죽여도 소용없고, 다시 켜질 때 되돌리기가 처음부터 다시 시작된다고 해요.
  - id: idle-in-tx-timeout-target
    type: choice
    prompt: PostgreSQL에서 idle_in_transaction_session_timeout을 30초로 두면 어떤 세션이 끊길까요?
    choices:
      - 트랜잭션을 연 채 30초 넘게 쉬는 세션
      - SQL 하나를 30초 넘게 실행하는 세션
      - 잠금을 30초 넘게 기다리는 세션
      - 트랜잭션 없이 30초 넘게 쉬는 세션
    answer: 0
    explain: 트랜잭션을 연 채 쉬는 세션만 끊어서, 쥔 잠금을 풀어 줘요. 오래 도는 SQL은 statement_timeout, 잠금 대기는 lock_timeout이 맡아요.
  - id: true-means-sent
    type: ox
    prompt: pg_terminate_backend가 true를 돌려주면, 그 세션이 이미 끝났다고 확신해도 되나요?
    answer: false
    explain: 시간 인자를 주지 않으면 true는 신호를 보냈다는 뜻일 뿐이에요. pg_stat_activity에서 다시 확인해요.
