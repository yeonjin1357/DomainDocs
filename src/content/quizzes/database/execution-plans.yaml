questions:
  - id: cost-not-ms
    type: ox
    prompt: EXPLAIN 출력의 cost 값은 밀리초 단위의 예상 실행 시간인가요?
    answer: false
    explain: cost는 디스크 페이지 하나를 차례로 읽는 비용을 1로 둔 임의 단위예요. 실제 시간은 EXPLAIN ANALYZE의 actual time으로 봐요.
  - id: estimate-vs-actual
    type: choice
    prompt: EXPLAIN ANALYZE 결과에서 가장 먼저 찾아볼 곳은?
    choices:
      - 예상 행 수와 실제 행 수가 크게 다른 노드
      - 예상 cost가 가장 크게 찍힌 노드
      - 행 하나의 평균 바이트(width)가 가장 큰 노드
      - 전체 시간이 찍힌 맨 위의 노드
    answer: 0
    explain: 예상이 크게 빗나가면 그 자리에 맞지 않는 방법을 고르기 쉬워요. 8건을 예상하고 고른 Nested Loop가 12,000건 앞에서 느려지는 식이에요.
  - id: loops-multiply
    type: choice
    prompt: 안쪽 Index Scan 노드의 actual time이 0.1ms이고 loops가 12,000이에요. 이 노드에서 쓴 전체 시간은?
    choices:
      - 약 1,200ms
      - 약 0.1ms
      - 약 12,000ms
      - 약 120ms
    answer: 0
    explain: 여러 번 실행된 노드의 시간은 한 번 실행의 평균이에요. loops를 곱하면 0.1ms × 12,000 = 1,200ms예요.
  - id: analyze-runs-dml
    type: ox
    prompt: UPDATE 문 앞에 EXPLAIN ANALYZE를 붙여 실행하면, 표의 데이터도 바뀌나요?
    answer: true
    explain: EXPLAIN ANALYZE는 SQL을 실제로 실행해요. 데이터를 남기지 않으려면 BEGIN과 ROLLBACK 사이에서 실행해요.
  - id: explain-analyze-name
    type: input
    prompt: PostgreSQL에서 SQL을 실제로 실행해, 노드마다 실제 시간과 행 수를 함께 보여 주는 명령은?
    answer: [EXPLAIN ANALYZE]
    explain: EXPLAIN만 쓰면 예상만 보여 주고, ANALYZE를 붙이면 실제로 실행해서 잰 값을 함께 보여 줘요.
