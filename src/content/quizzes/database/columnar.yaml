questions:
  - id: column-read
    type: choice
    prompt: 100열짜리 표에서 3열만 집계하는 질의가 열 지향 DB에서 빠른 이유는?
    choices:
      - 그 3열의 데이터만 읽기 때문이에요
      - 모든 행을 메모리에 미리 올려 두기 때문이에요
      - 모든 열에 인덱스가 저절로 생기기 때문이에요
      - 행마다 다른 서버에 두기 때문이에요
    answer: 0
    explain: 열마다 따로 모아 저장해서, 필요한 열의 데이터만 디스크에서 읽어요.
  - id: best-compress
    type: choice
    prompt: 열 지향 저장에서 가장 작게 줄어드는 열은?
    choices:
      - 200과 500 두 가지 값뿐인 상태 코드 열
      - 0~300 사이 무작위 숫자 열
      - 행마다 다른 시각 열
      - 행마다 다른 긴 무작위 문자열 열
    answer: 0
    explain: 한 열에 같은 값이 모일수록 잘 줄어요. 실험에서 상태 코드 100만 개는 0.7KB가 됐어요.
  - id: small-inserts
    type: ox
    prompt: ClickHouse에 한 행씩 초당 수백 번 넣는 것이 권장되는 방식인가요?
    answer: false
    explain: INSERT마다 조각이 생겨서 조금씩 자주 넣으면 조각이 쌓여요. 문서는 최소 1,000행, 가능하면 1만~10만 행씩 넣으라고 해요.
  - id: queue-wait
    type: choice
    prompt: Redshift의 질의 시간이 늘었는데 실행 시간은 그대로예요. 늘어난 것은?
    choices:
      - WLM 대기열에서 기다린 시간
      - 디스크의 블록 크기
      - 열의 압축률
      - 표의 열 수
    answer: 0
    explain: 질의는 대기열에서 자리가 나길 기다린 뒤 실행돼요. 실행이 그대로라면 자리가 모자란 거예요.
  - id: warehouse-name
    type: input
    prompt: 여러 시스템의 데이터를 모아 분석용으로 쌓아 두는 DB는?
    answer: [데이터 웨어하우스, data warehouse, DW, 웨어하우스]
    term: database/data-warehouse
    explain: 운영 DB의 데이터를 주기적으로 옮겨 쌓아서, 웨어하우스의 숫자는 옮기는 주기만큼 늦어요.
