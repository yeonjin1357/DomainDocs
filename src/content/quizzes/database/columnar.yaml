questions:
  - id: column-read
    type: choice
    prompt: 100열짜리 표에서 3열만 집계하는 질의가 열 지향 DB에서 빠른 이유는?
    choices:
      - 그 3열의 데이터만 읽기 때문이에요
      - 모든 행을 메모리에 미리 올려 두기 때문이에요
      - 모든 열에 인덱스가 저절로 생기기 때문이에요
      - 행마다 다른 서버에 두기 때문이에요
    answer: 0
    explain: 열마다 따로 모아 저장해서, 필요한 열의 데이터만 디스크에서 읽어요.
  - id: best-compress
    type: choice
    prompt: 열 지향 저장에서 가장 작게 줄어드는 열은?
    choices:
      - 값이 200과 500 두 가지뿐인 상태 코드 열
      - 값이 0~300 사이 무작위 정수인 응답시간 열
      - 값이 1,000가지인 요청 경로 열
      - 값이 100만 개 모두 다른 시각 열
    answer: 0
    explain: 값의 종류가 적을수록 잘 줄어요. 실험에서 상태 코드 100만 개는 0.7KB, 시각은 2.6MB가 됐어요.
  - id: small-inserts
    type: ox
    prompt: ClickHouse에 한 행씩 초당 수백 번 넣으면, 조각(part)이 합쳐지는 속도보다 빨리 쌓이나요?
    answer: true
    explain: INSERT마다 조각이 하나씩 생겨서, 조금씩 자주 넣으면 조각이 쌓여요. 문서는 최소 1,000행, 가능하면 1만~10만 행씩 넣으라고 해요.
  - id: queue-wait
    type: choice
    prompt: Redshift의 질의 시간이 늘었는데 실행 시간은 그대로예요. 늘어난 것은?
    choices:
      - WLM 대기열에서 기다린 시간
      - 1MB 블록을 디스크에서 읽은 시간
      - 압축된 열을 풀어내는 데 든 시간
      - 열마다 값을 훑어 집계한 시간
    answer: 0
    explain: 블록 읽기, 압축 풀기, 집계는 모두 실행 시간에 들어요. 실행이 그대로라면 대기열에서 자리가 나길 기다린 거예요.
  - id: warehouse-name
    type: input
    prompt: 여러 시스템의 데이터를 모아 분석용으로 쌓아 두는 DB는?
    answer: [데이터 웨어하우스, data warehouse, DW, 웨어하우스]
    term: database/data-warehouse
    explain: 운영 DB의 데이터를 주기적으로 옮겨 쌓아서, 웨어하우스의 숫자는 옮기는 주기만큼 늦어요.
