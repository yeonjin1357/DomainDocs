questions:
  - id: frequent-under-threshold
    type: ox
    prompt: PostgreSQL에서 기준을 1초로 두었어요. 0.5초 걸리는 SQL이 하루 10만 번 불리면 슬로 쿼리 로그에 남나요?
    answer: false
    explain: 기준을 넘은 실행만 한 건씩 남아요. 한 번 한 번이 0.5초면 10만 번 불려도 한 줄도 없어요. 자주 도는 SQL은 SQL별 부하 순위에서 봐요.
  - id: lock-wait-counted
    type: ox
    prompt: 다른 트랜잭션이 잡은 행을 기다린 시간도 슬로 쿼리 로그의 걸린 시간에 들어가나요?
    answer: true
    explain: 걸린 시간은 시작부터 끝까지 흐른 시간이라 잠금을 기다린 시간도 들어가요. MySQL 8.4는 그 몫을 Lock_time에 따로 보여 줘요.
  - id: running-now
    type: choice
    prompt: PostgreSQL에서 지금 8분째 실행 중인 SQL을 찾으려면 어디를 볼까요?
    choices: [액티브 세션, 슬로 쿼리 로그, SQL별 부하 순위, 실행 계획]
    answer: 0
    explain: 슬로 쿼리 로그는 SQL이 끝난 뒤에야 적혀요. 지금 도는 SQL은 pg_stat_activity 같은 액티브 세션 화면에서 봐요.
  - id: empty-log
    type: choice
    prompt: MySQL에서 slow_query_log만 켰는데, 3초 걸리는 SQL이 한 줄도 안 남아요. 먼저 확인할 값은?
    choices: [long_query_time, Rows_examined, innodb_buffer_pool_size, max_connections]
    answer: 0
    explain: long_query_time의 기본값은 10초예요. 그대로 두면 3초짜리 SQL은 기준을 넘지 못해 남지 않아요.
  - id: name
    type: input
    prompt: 정한 시간보다 오래 걸린 SQL 실행만 한 건씩 남기는 DB 로그를 무엇이라 부르나요?
    answer: [슬로 쿼리 로그, slow query log, 느린 쿼리 로그]
    term: database/slow-query-log
    explain: 슬로 쿼리 로그는 기준을 넘은 실행마다 시각, 걸린 시간, 실행한 SQL을 남겨요.
