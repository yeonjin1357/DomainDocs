questions:
  - id: query-path-order
    type: choice
    prompt: 쿼리 하나가 DB 안을 지나가는 순서로 맞는 것은?
    choices:
      - 연결 → 해석 → 계획 → 실행
      - 연결 → 계획 → 해석 → 실행
      - 해석 → 연결 → 실행 → 계획
      - 연결 → 실행 → 해석 → 계획
    answer: 0
    explain: 먼저 연결을 맺고, SQL의 뜻을 확인한 뒤, 가져올 방법을 정하고, 그대로 실행해요.
  - id: parser-vs-optimizer
    type: ox
    prompt: SQL의 문법이 맞는지, 테이블이 정말 있는지 확인하는 일은 옵티마이저가 맡나요?
    answer: false
    explain: 문법과 이름 확인은 파서가 해요. 옵티마이저는 데이터를 가져올 여러 방법 중 가장 싸 보이는 실행 계획을 골라요.
  - id: commit-then-power-loss
    type: choice
    prompt: UPDATE를 커밋했다는 응답을 받은 직후 DB 서버의 전원이 나갔어요. 다시 켤 때 이 변경은 무엇으로 되살릴까요?
    choices:
      - 커밋 전에 로그에 적어 둔 변경
      - 버퍼 캐시에 남아 있던 블록
      - 커밋 때 데이터 파일에 쓴 블록
      - 앱이 다시 보낸 같은 SQL
    answer: 0
    explain: 커밋은 로그에 확실히 적은 뒤 끝나고, 데이터 파일은 나중에 써요. 메모리인 버퍼 캐시는 전원이 나가면 사라져서, 로그를 다시 적용해 되살려요.
  - id: cache-hit-no-disk
    type: ox
    prompt: 필요한 블록이 버퍼 캐시에 있으면, 그 블록은 디스크를 읽지 않고 가져오나요?
    answer: true
    explain: 버퍼 캐시는 디스크에서 읽은 블록을 담아 두는 메모리예요. 캐시에 있으면 메모리에서 바로 꺼내요.
