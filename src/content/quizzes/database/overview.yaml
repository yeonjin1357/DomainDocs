questions:
  - id: query-path-order
    type: choice
    prompt: 쿼리 하나가 DB 안을 지나가는 순서로 맞는 것은?
    choices:
      - 연결 → 해석 → 계획 → 실행
      - 연결 → 계획 → 해석 → 실행
      - 해석 → 연결 → 실행 → 계획
      - 연결 → 실행 → 해석 → 계획
    answer: 0
    explain: 먼저 연결을 맺고, SQL의 뜻을 확인한 뒤, 가져올 방법을 정하고, 그대로 실행해요.
  - id: parser-vs-optimizer
    type: ox
    prompt: SQL의 문법이 맞는지, 테이블이 정말 있는지 확인하는 일은 옵티마이저가 맡나요?
    answer: false
    explain: 문법과 이름 확인은 파서가 해요. 옵티마이저는 데이터를 가져올 여러 방법 중 가장 싸 보이는 실행 계획을 골라요.
  - id: commit-writes-log-first
    type: choice
    prompt: 데이터를 바꾸는 쿼리를 커밋할 때 DB가 반드시 먼저 해 두는 일은?
    choices:
      - 바뀐 내용을 로그에 적어요
      - 바뀐 블록을 모두 데이터 파일에 써요
      - 버퍼 캐시를 비워요
      - 실행 계획을 새로 세워요
    answer: 0
    explain: 로그에만 확실히 적어 두면 데이터 파일은 나중에 써도 돼요. 그사이 장애가 나도 로그로 되살려요.
  - id: cache-hit-no-disk
    type: ox
    prompt: 필요한 블록이 버퍼 캐시에 있으면, 그 블록은 디스크를 읽지 않고 가져오나요?
    answer: true
    explain: 버퍼 캐시는 디스크에서 읽은 블록을 담아 두는 메모리예요. 캐시에 있으면 메모리에서 바로 꺼내요.
