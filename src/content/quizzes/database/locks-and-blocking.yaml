questions:
  - id: select-behind-alter
    type: ox
    prompt: PostgreSQL에서 평범한 SELECT도, 잠금을 기다리는 ALTER TABLE 뒤에 줄을 서서 기다릴 수 있나요?
    answer: true
    explain: 많은 ALTER TABLE은 모든 잠금과 충돌하는 ACCESS EXCLUSIVE 잠금을 써요. 이 잠금이 기다리는 동안 뒤에 온 SELECT도 그 뒤에 줄을 서요.
  - id: find-chain-head
    type: choice
    prompt: 잠금 때문에 막힌 세션이 수십 개예요. 가장 먼저 찾을 세션은?
    choices:
      - 사슬 맨 앞에서 잠금을 쥐고 있는 세션
      - 가장 오래 기다린 세션
      - 가장 최근에 막힌 세션
      - CPU를 가장 많이 쓰는 세션
    answer: 0
    explain: 뒤의 세션들은 모두 맨 앞 세션 때문에 줄을 서 있어요. 그 하나가 끝나야 줄이 풀려요.
  - id: deadlock-resolution
    type: choice
    prompt: 두 트랜잭션이 서로의 잠금을 기다리는 교착이 생기면 PostgreSQL은 어떻게 할까요?
    choices:
      - 한쪽 트랜잭션을 에러로 끝내고 나머지를 진행시켜요
      - 두 트랜잭션을 모두 커밋해요
      - 관리자가 끊을 때까지 그대로 둬요
      - 두 트랜잭션을 모두 되돌려요
    answer: 0
    explain: PostgreSQL은 교착을 찾아내 한쪽을 끝내요. 어느 쪽이 끝날지는 알 수 없어서, 앱이 그 에러를 다시 시도해야 해요.
  - id: ddl-lock-timeout
    type: choice
    prompt: 운영 중에 ALTER TABLE을 돌릴 때 lock_timeout을 짧게 두는 이유는?
    choices:
      - 잠금을 곧바로 얻지 못하면 포기해서, 뒤의 쿼리를 오래 줄 세우지 않으려고
      - ALTER TABLE 자체를 더 빨리 끝내려고
      - 교착이 생겨도 두 트랜잭션을 모두 살리려고
      - 다른 세션의 잠금을 빼앗아 오려고
    answer: 0
    explain: 기다리는 ALTER TABLE도 뒤의 쿼리를 막아요. 정한 시간 안에 잠금을 못 얻으면 실패하게 해서 줄이 길어지지 않게 해요.
  - id: consistent-lock-order
    type: ox
    prompt: 교착이 되풀이될 때, 여러 행을 바꾸는 코드들이 모두 같은 순서로 잠그게 하면 도움이 되나요?
    answer: true
    explain: 같은 순서로 잠그면 서로의 잠금을 거꾸로 기다릴 일이 없어요. PostgreSQL 문서도 교착을 막는 가장 좋은 방법으로 들어요.
