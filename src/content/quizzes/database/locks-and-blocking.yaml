questions:
  - id: select-behind-alter
    type: ox
    prompt: PostgreSQL에서 ALTER TABLE이 잠금을 기다리는 동안, 뒤에 온 평범한 SELECT도 그 뒤에 줄을 서나요?
    answer: true
    explain: 많은 ALTER TABLE은 모든 잠금과 충돌하는 ACCESS EXCLUSIVE 잠금을 써요. 이 잠금이 기다리는 동안 뒤에 온 SELECT도 그 뒤에 줄을 서요.
  - id: find-chain-head
    type: choice
    prompt: 잠금 때문에 막힌 세션이 수십 개예요. 가장 먼저 찾을 세션은?
    choices:
      - 사슬 맨 앞에서 잠금을 쥐고 있는 세션
      - 잠금을 가장 오래 기다리고 있는 막힌 세션
      - 가장 최근에 줄에 들어와 막힌 세션
      - CPU를 가장 많이 쓰고 있는 액티브 세션
    answer: 0
    explain: 뒤의 세션들은 모두 맨 앞 세션 때문에 줄을 서 있어요. 그 하나가 끝나야 줄이 풀려요.
  - id: deadlock-resolution
    type: choice
    prompt: 두 트랜잭션이 서로의 잠금을 기다리는 교착이 생기면 PostgreSQL은 어떻게 할까요?
    choices:
      - 한쪽을 에러로 끝내고 나머지를 진행시켜요
      - 두 트랜잭션을 모두 에러로 끝내 함께 되돌려요
      - lock_timeout이 지날 때까지 둘 다 기다리게 둬요
      - 관리자가 한쪽을 끊을 때까지 그대로 둬요
    answer: 0
    explain: PostgreSQL은 교착을 찾아내 한쪽을 끝내요. 어느 쪽이 끝날지는 알 수 없어서, 앱이 그 에러를 다시 시도해야 해요.
  - id: ddl-lock-timeout
    type: choice
    prompt: 운영 중에 ALTER TABLE을 돌릴 때 lock_timeout을 짧게 두는 이유는?
    choices:
      - 잠금을 못 얻으면 포기해 뒤의 쿼리를 오래 막지 않으려고
      - ALTER TABLE이 오래 걸리면 중간에 끊어 되돌리려고
      - 교착이 생겨도 두 트랜잭션을 모두 살리려고
      - 다른 세션이 쥔 잠금을 빼앗아 먼저 얻으려고
    answer: 0
    explain: 기다리는 ALTER TABLE도 뒤의 쿼리를 막아요. 정한 시간 안에 잠금을 못 얻으면 실패하게 해서 줄이 길어지지 않게 해요.
  - id: consistent-lock-order
    type: ox
    prompt: 두 트랜잭션이 행 1과 행 2를 모두 1 → 2 순서로 잠그면, 뒤에 온 쪽은 행 1에서 기다리나요?
    answer: true
    explain: 같은 순서로 잠그면 같은 행에서 줄을 설 뿐, 서로의 잠금을 거꾸로 기다리지 않아요. 그래서 교착을 막는 가장 좋은 방법이에요.
