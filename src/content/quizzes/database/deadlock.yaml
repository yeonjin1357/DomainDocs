questions:
  - id: both-fail
    type: ox
    prompt: 교착이 나면 엇갈린 두 트랜잭션이 모두 실패하나요?
    answer: false
    explain: DB는 한쪽만 실패시키고 되돌려요. 남은 쪽은 잠금을 얻어 그대로 끝나요.
  - id: lock-order
    type: choice
    prompt: 이체 코드에서 교착이 자주 나요. 가장 좋은 예방책은?
    choices:
      - 보내는 쪽·받는 쪽과 상관없이 계좌 번호가 작은 행부터 바꿔요
      - 커넥션 풀을 키워요
      - deadlock_timeout을 늘려요
      - 인덱스를 지워요
    answer: 0
    explain: 모든 트랜잭션이 같은 순서로 잠그면 같은 행에서 줄을 설 뿐 엇갈리지 않아요. PostgreSQL 문서가 꼽는 가장 좋은 방법이에요.
  - id: retry-whole
    type: choice
    prompt: 앱이 교착 오류를 받았을 때 알맞은 처리는?
    choices:
      - 트랜잭션 전체를 처음부터 다시 시도해요
      - 실패한 SQL 하나만 다시 보내요
      - 연결을 끊고 사용자에게 실패를 알려요
      - 커밋을 시도해요
    answer: 0
    explain: 실패한 쪽 트랜잭션은 이미 통째로 되돌려졌어요. 그래서 처음부터 다시 해요.
  - id: mysql-all-deadlocks
    type: choice
    prompt: MySQL에서 SHOW ENGINE INNODB STATUS에는 마지막 교착만 보여요. 모든 교착을 오류 로그에 남기는 설정은?
    choices:
      - innodb_print_all_deadlocks
      - innodb_lock_wait_timeout
      - max_execution_time
      - log_lock_waits
    answer: 0
    explain: innodb_print_all_deadlocks를 켜면 교착마다 정보를 오류 로그에 써요. log_lock_waits는 PostgreSQL 설정이에요.
  - id: pg-sqlstate
    type: input
    prompt: PostgreSQL에서 교착으로 실패한 쪽이 받는 SQLSTATE 코드는?
    answer: [40P01]
    explain: 앱은 이 코드를 보고 트랜잭션을 다시 시도해요. MySQL은 1213, SQL Server는 1205예요.
