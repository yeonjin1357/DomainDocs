questions:
  - id: block-unit-read
    type: ox
    prompt: 행 하나만 필요할 때도, DB는 그 행이 든 블록(보통 8KB)을 통째로 읽나요?
    answer: true
    explain: DB는 블록(페이지) 단위로 읽고 써요. 같은 블록에 있는 다른 행도 함께 메모리로 올라와요.
  - id: innodb-page-size
    type: choice
    prompt: 다음 중 기본 블록(페이지) 크기가 나머지와 다른 것은?
    choices:
      - MySQL InnoDB
      - PostgreSQL
      - Oracle
      - SQL Server
    answer: 0
    explain: MySQL InnoDB의 기본 페이지는 16KB이고, 나머지는 기본 8KB예요.
  - id: periodic-write-spike
    type: choice
    prompt: DB 화면에서 디스크 쓰기가 몇 분마다 봉우리처럼 솟아요. 요청 수와 디스크 읽기는 고르게 유지돼요. 가장 그럴듯한 까닭은?
    choices:
      - 체크포인트가 더티 블록을 몰아 써서
      - 캐시에서 못 찾은 블록이 늘어서
      - 커밋마다 데이터 파일에 블록을 써서
      - 인덱스가 쓰이지 않아 전체 스캔해서
    answer: 0
    explain: 바꾼 블록은 메모리에 모였다가 체크포인트 때 디스크에 써요. 커밋은 로그만 적고, 캐시 실패와 전체 스캔은 읽기를 늘려요.
  - id: restart-cold-cache
    type: ox
    prompt: DB를 다시 시작한 직후 한동안은, 평소보다 디스크 읽기가 늘어나나요?
    answer: true
    explain: 다시 시작하면 버퍼 캐시가 비어 있어요. 자주 쓰는 블록이 다시 캐시에 찰 때까지 디스크에서 읽어요.
  - id: dirty-block-name
    type: input
    prompt: 메모리에서 바뀌었지만 아직 디스크에 쓰지 않은 블록을 부르는 이름은?
    answer: [더티 블록, 더티 페이지, dirty page, dirty block]
    term: database/dirty-block
    explain: 더티 블록은 체크포인트 같은 때 디스크에 써요. 그 전에 장애가 나면 로그로 되살려요.
