questions:
  - id: pruning-needs-key
    type: choice
    prompt: 달마다 나눈 events 표에서, 12칸을 모두 읽게 되는 조건은?
    choices:
      - WHERE body = '주문'
      - WHERE created_at >= '2026-03-01' AND created_at < '2026-04-01'
      - WHERE created_at = '2026-05-10'
      - WHERE created_at < '2026-02-01'
    answer: 0
    explain: 기준 열인 created_at으로 걸러야 맞지 않는 칸을 건너뛰어요. 기준 열이 없는 조건은 모든 칸을 읽어요.
  - id: drop-vs-delete
    type: ox
    prompt: 보관 기간이 지난 한 달 치 데이터를 지울 때, 그 달의 파티션을 DROP하면 DELETE보다 VACUUM 뒷정리가 더 필요한가요?
    answer: false
    explain: 칸을 지우거나 떼면 죽은 행이 남지 않아요. DELETE는 지운 행마다 VACUUM이 치울 거리가 남아요.
  - id: missing-partition
    type: choice
    prompt: 1월 1일 0시부터 주문 저장이 no partition of relation found for row 오류로 실패해요. 원인은?
    choices:
      - 새 달의 파티션을 미리 만들어 두지 않았어요
      - 인덱스가 깨졌어요
      - 디스크가 가득 찼어요
      - 기본 키가 중복됐어요
    answer: 0
    explain: 맞는 칸이 없는 행은 넣을 수 없어요. 다음 달 칸을 미리 만드는 작업을 두거나 기본 칸을 둬요.
  - id: pk-includes-key
    type: ox
    prompt: PostgreSQL에서 created_at으로 나눈 표에 id만으로 기본 키를 만들 수 있나요?
    answer: false
    explain: 나눈 표의 기본 키와 고유 제약에는 기준 열이 모두 들어가야 해요. (id, created_at)처럼 만들어요.
  - id: pruning-name
    type: input
    prompt: 조건에 맞지 않는 파티션을 읽지 않고 건너뛰는 최적화를 무엇이라고 할까요?
    answer: [파티션 가지치기, partition pruning, 가지치기, pruning]
    term: database/partition-pruning
    explain: 실행할 때에야 값을 아는 경우에도 일어나서, 계획에 Subplans Removed로 빠진 칸 수가 찍혀요.
