questions:
  - id: pruning-needs-key
    type: choice
    prompt: 달마다 나눈 events 표에서, 12칸을 모두 읽게 되는 조건은?
    choices:
      - WHERE body = '주문'
      - WHERE created_at >= '2026-03-01' AND created_at < '2026-04-01'
      - WHERE created_at = '2026-05-10'
      - WHERE created_at < '2026-02-01'
    answer: 0
    explain: 기준 열인 created_at으로 걸러야 맞지 않는 칸을 건너뛰어요. 기준 열이 없는 조건은 모든 칸을 읽어요.
  - id: drop-frees-space
    type: ox
    prompt: 보관 기간이 지난 한 달 치를 지우려고 그 달의 파티션을 DROP했어요. VACUUM을 기다리지 않고 그 칸이 쓰던 디스크 공간이 바로 비나요?
    answer: true
    explain: 칸을 지우면 그 칸의 파일이 통째로 사라져서 죽은 행이 남지 않아요. DELETE는 지운 행마다 VACUUM이 치울 거리가 남아요.
  - id: missing-partition
    type: choice
    prompt: 1월 1일 0시부터 주문 저장이 no partition of relation found for row 에러로 실패해요. 원인은?
    choices:
      - 1월 칸을 미리 만들어 두지 않았어요
      - 기본 키에 기준 열을 넣지 않고 만들었어요
      - 작년 12월 칸의 범위 끝값이 겹쳐요
      - 디스크가 가득 차 새 행을 못 써요
    answer: 0
    explain: 맞는 칸이 없는 행은 넣을 수 없어요. 기본 키 문제는 표를 만들 때 다른 에러로 나요. 다음 달 칸을 미리 만드는 작업을 둬요.
  - id: pk-includes-key
    type: ox
    prompt: PostgreSQL에서 created_at으로 나눈 표에 기본 키를 두려면, 그 키에 created_at이 들어가야 하나요?
    answer: true
    explain: 나눈 표의 기본 키와 고유 제약에는 기준 열이 모두 들어가야 해요. 그래서 (id, created_at)처럼 만들어요.
  - id: pruning-name
    type: input
    prompt: 조건에 맞지 않는 파티션을 읽지 않고 건너뛰는 최적화를 무엇이라고 할까요?
    answer: [파티션 가지치기, partition pruning, 가지치기, pruning]
    explain: 실행할 때에야 값을 아는 경우에도 일어나서, 계획에 Subplans Removed로 빠진 칸 수가 찍혀요.
