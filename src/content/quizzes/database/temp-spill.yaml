questions:
  - id: sort-on-disk
    type: choice
    prompt: 실행 계획에 Sort Method external merge Disk 99904kB가 보여요. 무슨 뜻일까요?
    choices:
      - work_mem을 넘쳐 임시 파일을 썼어요
      - 인덱스 순서대로 읽어 정렬을 건너뛰었어요
      - 정렬 결과를 디스크 캐시에서 읽었어요
      - 정렬이 실패해 다시 시도했어요
    answer: 0
    explain: 메모리에서 끝났다면 quicksort Memory로 나와요. external merge Disk는 임시 파일로 넘쳤다는 표시예요.
  - id: check-before-fixing-spill
    type: choice
    prompt: 월말 리포트 SQL의 계획에 external merge Disk가 보여요. 이 넘침을 고칠 대상으로 삼기 전에 먼저 확인할 것은?
    choices:
      - SQL이 정말 느리고 디스크가 바쁜지
      - 해시 조인으로 바꾸면 넘치지 않는지
      - 임시 파일 지우기가 밀려 있는지
      - 서버의 swap이 켜져 있는지
    answer: 0
    explain: 넘친 것과 느린 것은 따로 봐요. 임시 파일이 운영체제 캐시에 머물면 시간이 크게 늘지 않기도 해서, 실제로 느리거나 디스크가 바쁠 때 고쳐요.
  - id: work-mem-multiply
    type: choice
    prompt: work_mem을 64MB로 올렸어요. 정렬이 2개 든 SQL을 연결 100개가 동시에 돌리면 최대 얼마까지 쓸 수 있을까요?
    choices:
      - 12.8GB
      - 64MB
      - 128MB
      - 6.4GB
    answer: 0
    explain: work_mem은 SQL이 아니라 정렬·해시 단계 하나의 한도예요. 64MB × 2단계 × 100연결이에요.
  - id: temp-file-limit
    type: choice
    prompt: SQL 하나가 임시 파일로 디스크를 다 채우지 못하게 막는 PostgreSQL 설정은?
    choices:
      - temp_file_limit
      - log_temp_files
      - work_mem
      - statement_timeout
    answer: 0
    explain: 기본값 -1은 제한 없음이에요. 걸어 두면 넘는 순간 그 SQL이 temporary file size exceeds 에러로 끝나요.
  - id: work-mem-name
    type: input
    prompt: PostgreSQL에서 정렬·해시 단계 하나가 디스크로 넘치기 전까지 쓸 수 있는 메모리 설정 이름은?
    answer: [work_mem]
    explain: 기본값은 4MB예요. 해시 단계는 여기에 hash_mem_multiplier를 곱한 만큼까지 써요.
