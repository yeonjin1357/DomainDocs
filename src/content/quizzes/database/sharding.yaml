questions:
  - id: monotonic-key
    type: ox
    prompt: 주문 번호처럼 계속 커지는 값을 범위 샤딩의 키로 두면, 새 주문은 여러 샤드에 고르게 나뉘나요?
    answer: false
    explain: 새 값은 늘 마지막 구간에 들어가서, 새 쓰기가 모두 한 샤드로 가요. 해시 샤딩이나 다른 키를 써야 고르게 나뉘어요.
  - id: hashed-range-query
    type: ox
    prompt: 해시 샤딩에서 키 값의 범위로 찾는 질의는 대개 여러 샤드에 보내지나요?
    answer: true
    explain: 해시를 거치면 가까운 값이 여러 샤드에 흩어져요. 그래서 범위 질의는 모든 샤드에 묻게 되기 쉬워요. 같은 값으로 찾는 질의는 한 샤드로 가요.
  - id: no-shard-key
    type: choice
    prompt: 샤딩한 주문 표에서 샤드 키(user_id) 없이 status로만 찾는 질의는 어떻게 처리되나요?
    choices: [모든 샤드에 묻고 결과를 모아요, 첫 번째 샤드에서만 찾아요, 라우터가 에러를 돌려줘요, 가장 큰 샤드에서만 찾아요]
    answer: 0
    explain: 샤드 키가 없으면 라우터가 어느 샤드에 있는지 몰라 모두에게 물어요. 가장 느린 샤드만큼 느려져요.
  - id: vs-partitioning
    type: choice
    prompt: 샤딩과 테이블 파티셔닝의 가장 큰 차이는?
    choices: [데이터를 여러 DB 서버에 나눠요, 오래된 데이터를 칸째 지워요, 조건에 맞는 칸만 읽어요, 인덱스를 칸마다 따로 둬요]
    answer: 0
    explain: 파티셔닝은 한 서버 안에서 표를 나누고, 샤딩은 여러 서버에 나눠요. 나머지 보기는 파티셔닝으로도 하는 일이에요.
  - id: shard-key-name
    type: input
    prompt: 샤딩에서 행이나 문서를 어느 서버에 둘지 정하는 열을 무엇이라 하나요?
    answer: [샤드 키, shard key, 분산 키]
    explain: 샤드 키가 쓰기가 고르게 나뉘는지와 질의가 한 샤드에서 끝나는지를 정해요.
