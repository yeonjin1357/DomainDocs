questions:
  - id: read-does-not-wait
    type: ox
    prompt: PostgreSQL에서 다른 세션이 바꾸고 있는(아직 커밋 전인) 행을 평범한 SELECT로 읽으면, 그 세션이 끝날 때까지 기다리나요?
    answer: false
    explain: 읽는 쪽은 커밋된 직전 버전을 봐요. 그래서 읽기와 쓰기가 서로를 기다리지 않아요.
  - id: same-row-update
    type: choice
    prompt: 두 세션이 같은 주문 행을 동시에 UPDATE하면 어떻게 될까요?
    choices:
      - 먼저 온 쪽이 행 잠금을 쥐고, 뒤에 온 쪽은 끝날 때까지 기다려요
      - 두 변경이 섞여 한 행에 함께 반영돼요
      - 뒤에 온 쪽이 먼저 온 쪽의 변경을 지우고 바로 반영돼요
      - 둘 다 바로 에러로 끝나요
    answer: 0
    explain: 행을 바꾸는 쪽은 그 행에 잠금을 걸고 트랜잭션이 끝날 때까지 쥐어요. 같은 행을 바꾸려는 쪽은 그동안 기다려요.
  - id: sqlserver-default-read
    type: choice
    prompt: 기본 설정에서 행의 옛 버전을 쓰지 않아, 바뀌는 중인 행을 읽으면 기다리는 DB는?
    choices:
      - SQL Server
      - PostgreSQL
      - Oracle
      - MySQL InnoDB
    answer: 0
    explain: SQL Server는 READ_COMMITTED_SNAPSHOT이 꺼진 기본 설정에서 읽기에도 공유 잠금을 써요. 나머지는 옛 버전을 보여 줘요.
  - id: long-tx-bloat
    type: ox
    prompt: PostgreSQL에서 오래 열린 트랜잭션이 하나 있으면, 데이터는 그대로인데 테이블이 계속 커질 수 있나요?
    answer: true
    explain: 그 트랜잭션이 볼 수도 있는 옛 행을 치우지 못하고 남겨 둬야 해서, 테이블과 인덱스에 옛 행이 쌓여요.
  - id: mvcc-name
    type: input
    prompt: 한 행의 여러 버전을 함께 두고, 읽는 쪽에 커밋된 버전을 보여 주는 방식을 부르는 약어는?
    answer: [MVCC]
    term: database/mvcc
    explain: MVCC 덕분에 읽기가 쓰기를, 쓰기가 읽기를 기다리지 않아요. 옛 버전은 볼 사람이 없을 때 치워요.
