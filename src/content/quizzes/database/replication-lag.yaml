questions:
  - id: idle-night-false-lag
    type: ox
    prompt: 쓰기가 없는 새벽에 복제 서버의 '마지막 재생 뒤 흐른 시간'이 1시간까지 늘었어요. 복제가 1시간만큼 밀린 건가요?
    answer: false
    explain: 이 값은 마지막으로 재생한 트랜잭션 뒤로 흐른 시간이에요. 쓰기가 없으면 다 따라잡아도 계속 늘어요.
  - id: lag-in-bytes
    type: choice
    prompt: 복제가 실제로 얼마나 밀렸는지 보려면 무엇을 함께 봐야 할까요?
    choices:
      - 주 서버의 WAL 위치와 복제 서버가 재생한 위치의 바이트 차이
      - 복제 서버의 연결 수
      - 복제 서버의 버퍼 캐시 적중률
      - 주 서버의 액티브 세션 수
    answer: 0
    explain: 바이트 차이가 0이면 시간 값이 커도 밀린 게 없어요. 그래서 시간과 바이트를 함께 봐요.
  - id: replay-lag-null
    type: ox
    prompt: pg_stat_replication의 replay_lag가 NULL이면 지연이 0이라는 뜻인가요?
    answer: false
    explain: NULL은 최근에 잰 값이 없다는 뜻이에요. 다 따라잡고 WAL 활동이 없으면 마지막 값을 잠시 보여 준 뒤 NULL이 돼요.
  - id: slot-fills-disk
    type: choice
    prompt: 주 서버의 WAL 디스크가 계속 차올라요. 복제 쪽에서 먼저 볼 것은?
    choices:
      - 멈춘 복제 서버가 쓰던 복제 슬롯
      - 복제 서버의 max_connections
      - 주 서버의 shared_buffers
      - 복제 서버의 옵티마이저 통계
    answer: 0
    explain: 복제 슬롯은 복제 서버가 받기 전까지 WAL을 지우지 못하게 잡아 둬요. 복제 서버가 멈추면 그 슬롯이 디스크를 채울 수 있어요.
  - id: long-query-on-replica
    type: choice
    prompt: 복제 서버에서 오래 도는 조회가 재생할 변경과 충돌하면 무슨 일이 생길까요?
    choices:
      - 복제 서버가 재생을 미뤄서 그동안 지연이 늘어요
      - 주 서버의 커밋이 멈춰요
      - 조회가 주 서버로 옮겨 가서 실행돼요
      - 지연과는 아무 상관이 없어요
    answer: 0
    explain: 복제 서버는 조회를 위해 재생을 잠시 미뤄요. 정한 시간까지 기다린 뒤에는 조회를 취소하고 재생을 이어 가요.
