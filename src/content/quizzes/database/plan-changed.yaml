questions:
  - id: calls-vs-mean
    type: choice
    prompt: 한 SQL의 DB 시간이 어제보다 10배 늘었어요. 계획이 바뀐 탓이라면 SQL별 통계는 어떻게 보일까요?
    choices:
      - 호출 수는 그대로인데 1회 평균 시간이 늘어요
      - 호출 수가 10배로 늘고 1회 평균 시간은 그대로예요
      - 호출 수와 1회 평균 시간이 모두 그대로예요
      - SQL별 통계에서 그 SQL이 사라져요
    answer: 0
    explain: 호출 수가 늘었다면 앱 쪽 변화예요. 계획이 바뀌면 같은 횟수를 부르는데 한 번이 느려져요.
  - id: correlated-columns
    type: ox
    prompt: 시와 구처럼 값이 함께 움직이는 두 열로 거르면, PostgreSQL 옵티마이저는 기본으로 두 조건의 비율을 따로 곱해 행 수를 실제보다 적게 예상하나요?
    answer: true
    explain: 옵티마이저는 기본으로 조건끼리 상관없다고 보고 곱해요. 강남구는 늘 서울이라 실제로는 더 많이 나와서, CREATE STATISTICS로 두 열의 관계를 모아요.
  - id: auto-analyze-threshold
    type: choice
    prompt: PostgreSQL 기본 설정에서 100만 행인 표의 자동 ANALYZE는 대략 몇 행이 바뀌어야 돌까요?
    choices:
      - 10만 50행
      - 50행
      - 1만 행
      - 100만 행
    answer: 0
    explain: 기본은 표 행 수의 10%에 50을 더한 값이에요. 그래서 큰 적재 뒤에는 통계가 늦게 새로워질 수 있어요.
  - id: generic-plan-diagnosis
    type: choice
    prompt: 준비된 문장으로 status = 'done'을 여러 번 부른 뒤 'pending'으로 부르면 느려요. plan_cache_mode = force_custom_plan인 세션에서는 빨라요. 원인은?
    choices:
      - 값을 보지 않는 범용 계획을 다시 써서
      - "'pending' 값의 통계가 낡아서"
      - "'pending'에 맞는 인덱스가 없어서"
      - 준비된 문장이 캐시에서 지워져서
    answer: 0
    explain: 값마다 계획을 세우게 하면 빠르니, 통계와 인덱스는 문제가 없어요. PostgreSQL은 다섯 번 뒤 범용 계획이 크게 비싸지 않으면 다시 써서, 드문 값에도 흔한 값에 맞는 계획을 써요.
  - id: analyze-term
    type: input
    prompt: PostgreSQL에서 표의 행 수와 값 분포를 다시 모아 통계를 새로 고치는 명령은?
    answer: [ANALYZE, analyze, VACUUM ANALYZE, 애널라이즈]
    explain: 큰 적재나 삭제 뒤에 돌리면 낡은 통계 때문에 나빠진 계획이 돌아와요. MySQL은 ANALYZE TABLE이에요.
