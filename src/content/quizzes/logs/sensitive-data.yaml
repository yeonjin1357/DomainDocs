questions:
  - id: screen-only
    type: ox
    prompt: 민감 정보를 로그 검색 화면에서만 가리면, 로그 저장소와 백업에도 가려진 값만 남나요?
    answer: false
    explain: 화면에서만 가리면 보는 사람만 못 볼 뿐이에요. 노드의 파일, 저장소, 백업에는 원본이 그대로 있어요.
  - id: allowlist
    type: ox
    prompt: 남겨도 되는 필드만 적어 두고 나머지를 빼는 방식이면, 나중에 새로 생긴 필드도 저절로 빠지나요?
    answer: true
    explain: 허용 목록에 없는 필드는 모두 빠져서, 새 필드가 생겨도 새지 않아요. 뺄 필드를 적는 방식은 새 필드를 놓쳐요.
  - id: plain-hash
    type: choice
    prompt: 로그에 사용자 휴대전화 번호를 SHA-256으로 해시해 남겼어요. 무엇이 문제인가요?
    choices: [경우의 수가 적어 되찾을 수 있어요, 같은 번호끼리 묶을 수 없어요, 해시가 길어 저장이 비싸요, 검색 화면에서 안 보여요]
    answer: 0
    explain: 010으로 시작하는 번호는 1억 개뿐이라, 모두 해시해 맞춰 보는 데 1분쯤이면 돼요. 비밀 키를 넣은 HMAC을 써요.
  - id: best-place
    type: choice
    prompt: 민감 정보를 가리기에 가장 좋은 곳은 어디인가요?
    choices: [로그를 만드는 앱, 수집 파이프라인, 로그 저장소, 검색 화면]
    answer: 0
    explain: 앱에서 처음부터 남기지 않으면 파일, 전송, 저장소, 백업 어디에도 원본이 생기지 않아요. 파이프라인은 두 번째 그물이에요.
  - id: hmac-name
    type: input
    prompt: 비밀 키를 넣어 만드는 해시로, 키를 모르면 모든 값을 만들어 맞춰 볼 수 없는 방식은?
    answer: [HMAC, 에이치맥]
    explain: HMAC은 비밀 키와 값을 함께 넣어 해시해요. 같은 값끼리는 묶어 볼 수 있지만, 키 없이는 거꾸로 찾을 수 없어요.
