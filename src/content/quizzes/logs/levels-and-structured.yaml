questions:
  - id: severity-order
    type: choice
    prompt: OpenTelemetry의 SeverityNumber가 18인 로그의 레벨은?
    choices: [ERROR, WARN, INFO, FATAL]
    answer: 0
    explain: 17~20이 ERROR예요. WARN은 13~16, FATAL은 21~24예요.
  - id: message-with-id
    type: choice
    prompt: 같은 결제 실패를 세려고 해요. 어떤 로그 설계가 세기 쉬울까요?
    choices:
      - 고정 문구에 주문 번호는 필드로
      - 문구에 주문 번호를 넣어 쓰기
      - 주문마다 다른 레벨로 쓰기
      - 서비스 이름에 번호 붙이기
    answer: 0
    explain: 주문 A1042처럼 바뀌는 값을 문구에 넣으면 같은 사건이 주문마다 다른 문구가 돼요. 고정 문구와 필드로 나눠야 한 묶음으로 세요.
  - id: json-size
    type: ox
    prompt: 텍스트로 142바이트인 사건이 JSON으로는 193바이트예요. 초당 2,000줄이면 JSON이 하루에 약 9GB 더 쌓이나요?
    answer: true
    explain: (193 − 142) × 2,000 × 86,400 ≈ 8.8GB예요. 필드 이름이 줄마다 되풀이돼서, 구조화는 찾기 쉬운 대신 저장량이 늘어요.
  - id: level-split
    type: choice
    prompt: 레벨별 그래프에서 ERROR가 반으로 줄었는데, error라는 줄이 따로 생겼어요. 원인은?
    choices:
      - 레벨 이름의 대소문자가 달라요
      - 에러가 실제로 반으로 줄었어요
      - 로그 보관 기간이 짧아졌어요
      - 수집 에이전트가 줄을 두 번 보냈어요
    answer: 0
    explain: 레벨 이름이 다르면 그래프가 갈라져요. 한 이름이나 SeverityNumber로 맞춰야 해요.
  - id: structured-name
    type: input
    prompt: 값을 JSON이나 key=value처럼 필드로 나눠 쓴 로그를 무엇이라고 할까요?
    answer: [구조화 로그, structured log, structured logging, 구조화된 로그]
    term: logs/structured-log
    explain: 필드로 나눠 쓰면 글자 검색 대신 값으로 정확히 찾고 셀 수 있어요.
