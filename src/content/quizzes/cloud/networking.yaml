questions:
  - id: sg-stateful
    type: ox
    prompt: 보안 그룹에서 들어오는 요청을 허용하면, 그 응답은 나가는 규칙과 상관없이 나가나요?
    answer: true
    explain: 보안 그룹은 상태를 기억하는 방화벽이라, 허용한 요청의 응답은 따로 열지 않아도 나가요.
  - id: nacl-stateless
    type: ox
    prompt: 네트워크 ACL에서 들어오는 쪽만 열면, 응답도 알아서 나가나요?
    answer: false
    explain: 네트워크 ACL은 상태를 기억하지 않아요. 그래서 응답이 나가는 방향도 따로 허용해야 해요.
  - id: public-subnet-route
    type: choice
    prompt: 공개 서브넷과 비공개 서브넷을 가르는 것은?
    choices:
      - 인터넷 게이트웨이로 가는 경로
      - 서브넷 IP 범위의 크기
      - 붙은 보안 그룹의 개수
      - 서브넷이 걸친 가용 영역 수
    answer: 0
    explain: 서브넷의 라우팅 테이블에 인터넷 게이트웨이로 바로 가는 경로가 있으면 공개 서브넷이에요. 성격은 길을 어디로 내 주느냐로 정해져요.
  - id: private-egress-nat
    type: choice
    prompt: 비공개 서브넷의 앱 서버가 보안 패치를 받으러 인터넷으로 나가야 해요. 무엇을 거쳐야 할까요?
    choices:
      - NAT 게이트웨이
      - 서버에 바로 붙인 인터넷 게이트웨이
      - 로드 밸런서
      - 네트워크 ACL
    answer: 0
    explain: NAT 게이트웨이를 거치면 안에서 밖으로는 나갈 수 있지만, 밖에서 안으로는 연결을 시작할 수 없어요.
  - id: subnet-one-az
    type: ox
    prompt: 서버를 가용 영역 두 곳에 나눠 두려면, 서브넷도 가용 영역마다 하나씩 만들어야 하나요?
    answer: true
    explain: 서브넷 하나는 가용 영역 하나 안에만 있어서, 여러 가용 영역에 걸칠 수 없어요.
  - id: peering-not-transitive
    type: ox
    prompt: VPC A–B, A–C가 피어링돼 있으면 B에서 A를 거쳐 C로 갈 수 있나요?
    answer: false
    explain: 피어링은 이어진 VPC를 거쳐 그 너머로 가지 못해요. B와 C 사이에도 피어링을 만들거나 Transit Gateway를 써요.
  - id: tunnelstate-half
    type: choice
    prompt: 사이트 간 VPN의 TunnelState가 하루 종일 0과 1 사이에 머물러요. 무엇을 뜻할까요?
    choices:
      - 터널 하나 이상이 끊긴 채예요
      - 대역폭의 절반쯤을 쓰고 있어요
      - 패킷의 절반이 사라지고 있어요
      - 두 터널이 모두 바쁘게 일해요
    answer: 0
    explain: 터널이 모두 살아 있으면 1, 모두 끊기면 0이에요. 그 사이 값이면 남은 터널로만 버티는 중이에요.
  - id: vpc-endpoint-name
    type: input
    prompt: 비공개 서브넷의 서버가 NAT를 거치지 않고 S3나 CloudWatch API에 닿게 하는, VPC 안의 입구는?
    answer: [VPC 엔드포인트, VPC endpoint]
    term: cloud/vpc-endpoint
    explain: S3와 DynamoDB는 무료인 게이트웨이 엔드포인트, 다른 서비스는 인터페이스 엔드포인트를 써요.
