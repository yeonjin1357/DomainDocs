questions:
  - id: sp-hour-carryover
    type: ox
    prompt: 시간당 10달러인 Savings Plans에서 어느 시간에 6달러어치만 썼다면, 남은 4달러는 다음 시간으로 넘어가 쓰이나요?
    answer: false
    explain: 약정은 한 시간 단위로 셈해요. 그 시간에 못 쓴 몫은 넘어가지 않고 버려져요.
  - id: spot-notice
    type: ox
    prompt: AWS는 스팟 인스턴스를 회수하기 전에 EventBridge 이벤트와 서버 안의 메타데이터로 예고를 보내나요?
    answer: true
    explain: 회수 2분 전에 EventBridge로 회수 예고 이벤트를 보내요. 서버 안의 메타데이터 spot/instance-action에도 남겨요.
  - id: utilization-vs-coverage
    type: choice
    prompt: 약정 활용률은 98%인데 커버리지는 61%예요. 무엇을 뜻할까요?
    choices:
      - 약정은 거의 다 쓰는데 온디맨드 몫이 커요
      - 산 약정의 39%가 매시간 버려져요
      - 예약 인스턴스가 끝나 온디맨드 요금으로 돌아갔어요
      - 스팟 서버가 회수돼 사용이 줄었어요
    answer: 0
    explain: 활용률은 산 약정 중 쓴 몫이고, 커버리지는 사용 중 약정이 덮은 몫이에요. 사용의 39%는 온디맨드로 내고 있어요.
  - id: spot-fit
    type: choice
    prompt: 스팟 인스턴스에 올리기 가장 알맞은 일은?
    choices:
      - 상태를 밖에 두는 웹 서버
      - 주문을 저장하는 주 DB 서버
      - 하나뿐인 결제 처리 서버
      - 세션을 메모리에만 두는 서버
    answer: 0
    explain: 스팟은 2분 예고로 회수될 수 있어요. 꺼져도 다른 서버가 바로 이어받는, 상태를 밖에 둔 일이 맞아요.
  - id: savings-plans-name
    type: input
    prompt: 1년이나 3년 동안 시간당 사용 금액을 약정하고, 인스턴스 종류를 바꿔도 할인이 따라가는 AWS 요금제는?
    answer: [Savings Plans, 세이빙스 플랜, 절감형 플랜]
    term: cloud/savings-plans
    explain: Savings Plans는 시간당 금액을 약정해요. 구성을 정해 약정하는 예약 인스턴스보다 바꿀 여지가 커요.
