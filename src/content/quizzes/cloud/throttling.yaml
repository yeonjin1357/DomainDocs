questions:
  - id: token-bucket-sustained
    type: choice
    prompt: 바구니 크기 100개, 초당 20개씩 채워지는 API를 1분 동안 쉬지 않고 불러요. 처음에 몰아 쓴 뒤로 계속 성공하는 속도는?
    choices:
      - 초당 20번
      - 초당 100번
      - 초당 120번
      - 초당 5번
    answer: 0
    explain: 모아 둔 100개는 처음에 몰아 쓰면 바닥나요. 그 뒤로는 채우는 속도만큼, 곧 초당 20번만 성공하고 나머지는 거절돼요.
  - id: retry-immediately
    type: ox
    prompt: AWS SDK의 표준 모드는 스로틀링으로 거절된 요청을 다시 보낼 때, 기다리는 시간을 두 배씩 늘리고 무작위로 흩나요?
    answer: true
    explain: 지수 백오프와 지터예요. 바로 다시 보내면 한도가 풀릴 틈 없이 계속 거절되고, 여러 프로그램이 같은 순간 몰리는 것도 무작위가 막아요.
  - id: quota-vs-throttle
    type: choice
    prompt: 리전 안의 Lambda 함수가 동시에 1,000개 넘게 실행되려 해요. 기본 설정에서 넘치는 호출은 어떻게 될까요?
    choices:
      - 스로틀링되어 거절돼요
      - 자동으로 다른 리전에서 실행돼요
      - 다음 날로 미뤄져요
      - 추가 요금을 내고 그대로 실행돼요
    answer: 0
    explain: 동시 실행 1,000개는 기본 할당량이에요. 늘리려면 Service Quotas에서 미리 요청해요.
  - id: monitoring-throttled
    type: ox
    prompt: CloudWatch GetMetricData의 한도(계정·리전마다 초당 500번)는, 같은 계정에서 지표를 가져가는 여러 도구가 나눠 쓰나요?
    answer: true
    explain: 한도는 도구마다가 아니라 계정과 리전마다예요. 그래서 한 도구가 많이 가져가면 다른 도구가 걸려 그 사이 지표가 빌 수 있어요.
  - id: throttling-term
    type: input
    prompt: 정해 둔 속도보다 요청이 많을 때 넘친 요청을 거절하는 일을 뭐라고 부를까요?
    answer: [스로틀링, throttling, 쓰로틀링, rate limiting, 속도 제한, throttle]
    explain: HTTP에서는 보통 429 Too Many Requests로 돌아와요. 고장이 아니라 천천히 보내라는 뜻이에요.
