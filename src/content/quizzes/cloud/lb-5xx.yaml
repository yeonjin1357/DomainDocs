questions:
  - id: elb-made-5xx
    type: choice
    prompt: 5xx가 늘었는데, 대상이 만든 5xx는 평소 수준이고 로드 밸런서가 만든 5xx만 늘었어요. 맞는 해석은?
    choices:
      - 요청이 대상까지 못 갔거나, 대상이 제대로 답하지 못했어요
      - 앱 안에서 에러가 났어요
      - 사용자가 잘못된 요청을 보냈어요
      - 지표가 잘못 모였어요
    answer: 0
    explain: 로드 밸런서가 대신 만든 5xx는 앱 로그에 남지 않아요. 502, 503, 504 중 무엇인지 나눠 봐요.
  - id: 502-keepalive
    type: choice
    prompt: 로드 밸런서의 502가 낮은 비율로 꾸준히 나요. 먼저 의심할 설정은?
    choices:
      - 대상의 keep-alive 시간이 로드 밸런서의 유휴 시간 제한보다 짧아요
      - 로드 밸런서의 상태 확인 간격이 길어요
      - 대상 그룹에 대상이 하나도 없어요
      - 보안 그룹이 443 포트를 막아요
    answer: 0
    explain: 대상이 먼저 연결을 닫으면 로드 밸런서가 그 연결로 보내다 502를 만나요. 대상의 keep-alive를 더 길게 잡아요.
  - id: 503-meaning
    type: choice
    prompt: 로드 밸런서가 만든 503은 무엇을 뜻할까요?
    choices:
      - 요청을 넘길 수 있는 대상이 없어요
      - 대상이 느려서 시간이 넘었어요
      - 대상이 연결을 거부했어요
      - 사용자가 요청을 취소했어요
    answer: 0
    explain: 대상 그룹에 등록된 대상이 없거나 모두 쓸 수 없는 상태일 때 나요. 시간 초과는 504예요.
  - id: 504-slow-target
    type: choice
    prompt: 로드 밸런서의 504와 함께 대상 응답시간(TargetResponseTime)도 늘었어요. 먼저 볼 것은?
    choices:
      - 앱이 느려진 원인
      - 로드 밸런서의 리스너 설정
      - 보안 그룹 규칙
      - DNS 레코드
    answer: 0
    explain: 대상이 시간 안에 답하지 못한 거예요. 로드 밸런서 설정보다 앱이 느려진 이유를 먼저 찾아요.
  - id: deploy-503
    type: ox
    prompt: 배포할 때마다 503이 잠깐씩 튄다면, 새 대상이 정상으로 들어오기 전에 옛 대상이 빠지는지 볼 만한가요?
    answer: true
    explain: 그 사이 정상 대상이 하나도 없으면 503이 나요. 새 대상이 상태 확인을 통과한 뒤에 옛 대상을 빼요.
