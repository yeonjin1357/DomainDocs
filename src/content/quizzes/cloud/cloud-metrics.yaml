questions:
  - id: rollup-15-days
    type: choice
    prompt: CloudWatch에 1분 간격으로 쌓은 지표는, 15일이 지나면 어떻게 될까요?
    choices:
      - 5분 단위로 묶여 남아요
      - 1분 단위 그대로 남아요
      - 모두 지워져요
      - 1초 단위로 더 잘게 나뉘어요
    answer: 0
    explain: 오래 둘수록 더 큰 단위로 묶어요. 1분 자료는 15일 뒤 5분, 63일 뒤 1시간 단위가 돼요.
  - id: old-graph-max
    type: ox
    prompt: 두 달 전 그래프의 최댓값이 어제보다 낮아요. 그때는 짧은 급등이 없었다고 볼 수 있나요?
    answer: false
    explain: 오래된 자료는 1시간 단위로 묶여서 짧은 급등이 평평하게 지워져요.
  - id: sum-for-counts
    type: choice
    prompt: 에러 수처럼 일어난 횟수를 세는 지표는 어떤 통계로 봐야 할까요?
    choices:
      - 합(Sum)
      - 평균(Average)
      - 최솟값(Minimum)
      - 최댓값(Maximum)
    answer: 0
    explain: 세는 지표는 기간 안에 몇 번 일어났는지가 중요해서 합으로 봐요. CPU 사용률 같은 값은 평균과 최댓값을 함께 봐요.
  - id: insufficient-data
    type: choice
    prompt: CloudWatch 경보의 상태가 INSUFFICIENT_DATA예요. 무슨 뜻일 수 있을까요?
    choices:
      - 지표가 들어오지 않거나 판단할 자료가 모자라요
      - 지표가 정한 기준 안에 있어요
      - 지표가 정한 기준을 벗어났어요
      - 경보가 꺼져 있어요
    answer: 0
    explain: 막 만든 경보이거나 지표가 끊긴 경우예요. 문제없다고 넘기지 말고 지표가 들어오는지 봐요.
  - id: not-an-identifier
    type: choice
    prompt: CloudWatch에서 지표 하나를 가리키는 이름표가 아닌 것은?
    choices:
      - 통계(Average, Sum 같은 것)
      - 네임스페이스
      - 지표 이름
      - 차원
    answer: 0
    explain: 지표는 네임스페이스, 지표 이름, 차원으로 가려요. 통계는 그 지표를 기간마다 묶어 볼 때 고르는 거예요.
