questions:
  - id: rollup-15-days
    type: choice
    prompt: CloudWatch에 1분 간격으로 쌓은 지표는, 15일이 지나면 어떻게 될까요?
    choices:
      - 5분 단위로 묶여 남아요
      - 1분 단위 그대로 남아요
      - 모두 지워져요
      - 1시간 단위로 묶여 남아요
    answer: 0
    explain: 오래 둘수록 더 큰 단위로 묶어요. 1분 자료는 15일 뒤 5분, 63일 뒤 1시간 단위가 돼요.
  - id: old-graph-max
    type: ox
    prompt: CloudWatch에서 석 달 전 하루의 CPU 사용률을 평균으로 그렸어요. 그날 1분만 90%로 튄 값이 그래프에 90% 가까이 찍히나요?
    answer: false
    explain: 63일이 지난 1분 자료는 1시간 단위로 묶여요. 1분만 튄 값은 1시간 평균에 묻혀 평평해져요.
  - id: sum-for-counts
    type: choice
    prompt: 에러 수처럼 일어난 횟수를 세는 지표는 어떤 통계로 봐야 할까요?
    choices:
      - 합(Sum)
      - 평균(Average)
      - 최솟값(Minimum)
      - 최댓값(Maximum)
    answer: 0
    explain: 세는 지표는 기간 안에 몇 번 일어났는지가 중요해서 합으로 봐요. CPU 사용률 같은 값은 평균과 최댓값을 함께 봐요.
  - id: insufficient-data
    type: choice
    prompt: CloudWatch 경보의 상태가 INSUFFICIENT_DATA예요. 무슨 뜻일 수 있을까요?
    choices:
      - 판단할 지표 자료가 모자라요
      - 지표가 정한 기준 안에 있어요
      - 지표가 정한 기준을 벗어났어요
      - 경보가 꺼져 있어요
    answer: 0
    explain: 막 만든 경보이거나 지표가 끊긴 경우예요. 문제없다고 넘기지 말고 지표가 들어오는지 봐요.
  - id: dimension-name
    type: choice
    prompt: CloudWatch에서 InstanceId=i-0abc처럼, 같은 지표를 어느 대상에서 쟀는지 나누는 이름=값을 무엇이라고 하나요?
    choices:
      - 차원
      - 네임스페이스
      - 통계
      - 지표 이름
    answer: 0
    explain: 지표 하나는 네임스페이스, 지표 이름, 차원으로 가려요. 차원 값이 다르면 다른 지표예요. 통계는 기간마다 묶어 볼 때 고르는 거예요.
