questions:
  - id: timed-out-look-outside
    type: choice
    prompt: 함수 로그에 "Task timed out after 3.00 seconds"가 쌓여요. 먼저 볼 것은?
    choices:
      - 함수가 기다리는 바깥 서비스(DB, 다른 API)가 느려졌는지
      - 리전의 동시성 한도
      - 함수의 예약 동시성
      - 배포 패키지의 크기
    answer: 0
    explain: 시간 초과는 함수 자체보다 기다리는 쪽이 원인인 경우가 많아요. 제한 시간을 늘리기 전에 그쪽부터 봐요.
  - id: reserve-concurrency
    type: choice
    prompt: 이미지 변환 함수 하나가 동시성 950을 쓰자 다른 함수들이 스로틀링돼요. 중요한 함수를 지키려면?
    choices:
      - 중요한 함수에 예약 동시성을 걸어요
      - 모든 함수의 제한 시간을 늘려요
      - 함수 메모리를 줄여요
      - 함수 로그를 꺼요
    answer: 0
    explain: 예약 동시성을 건 함수는 늘 그만큼까지는 늘어날 수 있어요. 대신 그 이상은 넘지 않아요.
  - id: async-retries
    type: ox
    prompt: 다른 서비스가 비동기로 부른 함수가 에러를 내면, Lambda가 기본으로 다시 시도하나요?
    answer: true
    explain: 함수 에러면 기본으로 두 번 더 시도해요. 그래서 같은 이벤트가 여러 번 처리될 수 있어요.
  - id: errors-inflated
    type: choice
    prompt: 비동기 함수의 Errors 수가 실제로 실패한 이벤트 수보다 많아 보여요. 왜일까요?
    choices:
      - 자동 재시도로 같은 이벤트가 여러 번 세져서
      - 스로틀링된 요청도 Errors에 들어가서
      - 콜드 스타트가 Errors에 들어가서
      - 지표 서비스의 에러라서
    answer: 0
    explain: 실패한 이벤트 하나가 재시도마다 에러로 찍혀요. 스로틀링은 Errors에 들어가지 않아요.
  - id: code-error-timeline
    type: choice
    prompt: 시간 초과가 아닌 함수 에러가 갑자기 늘었어요. 먼저 맞춰 볼 것은?
    choices:
      - 배포·설정 변경 시각과 에러가 늘기 시작한 시각
      - 리전의 동시성 한도
      - 함수의 메모리 크기
      - 다른 리전의 에러 수
    answer: 0
    explain: 새 코드의 버그, 바뀐 환경 변수, 권한 변경이 흔한 원인이에요. 바뀐 시각과 맞으면 그 변경부터 봐요.
