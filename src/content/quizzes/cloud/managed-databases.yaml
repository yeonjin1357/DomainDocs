questions:
  - id: standby-no-reads
    type: ox
    prompt: RDS 다중 AZ의 대기 서버로 읽기 부하를 나눌 수 있나요?
    answer: false
    explain: 대기 서버는 장애에 대비할 뿐 읽기 요청을 받지 않아요. 읽기를 나누려면 읽기 복제본을 따로 써요.
  - id: customer-tunes-queries
    type: choice
    prompt: RDS를 써도 여전히 고객이 맡아야 하는 일은?
    choices:
      - 쿼리 튜닝
      - OS 패치
      - DB 백업
      - DB 설치
    answer: 0
    explain: 쿼리 성능은 설계와 데이터, 앱의 부하에 달려 있어서 고객 몫이에요. 설치, 패치, 백업은 AWS가 맡아요.
  - id: replica-stale-read
    type: choice
    prompt: 읽기 복제본에서 방금 쓴 데이터가 보이지 않아요. 먼저 볼 지표는?
    choices:
      - ReplicaLag
      - FreeStorageSpace
      - CPUUtilization
      - DatabaseConnections
    answer: 0
    explain: 읽기 복제본은 비동기로 따라와서 조금 늦을 수 있어요. 얼마나 늦는지가 ReplicaLag예요.
  - id: standby-sync
    type: choice
    prompt: 다중 AZ의 대기 서버는 주 서버의 변경을 어떻게 따라갈까요?
    choices:
      - 동기로 복제해요
      - 비동기로 복제해요
      - 하루 한 번 백업으로 받아요
      - 따라가지 않고 장애 때 백업에서 만들어요
    answer: 0
    explain: 대기 서버는 동기로 따라와서 넘겨받을 때 잃는 데이터가 없게 해요. 읽기 복제본은 비동기예요.
  - id: maintenance-window
    type: ox
    prompt: 바로 적용하지 않기로 한 RDS 설정 변경은, 정해 둔 유지 보수 시간에 적용되나요?
    answer: true
    explain: 그래서 유지 보수 시간은 사용자가 가장 적은 시간대로 정해 둬요. 일부 패치는 DB를 잠깐 멈추고 해요.
