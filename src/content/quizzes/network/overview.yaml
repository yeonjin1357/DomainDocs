questions:
  - id: router-between-networks
    type: choice
    prompt: 서버 A와 서버 B가 서로 다른 네트워크에 있어요. 두 네트워크 사이로 데이터를 넘겨 주는 장비는?
    choices:
      - 라우터
      - 스위치
      - 방화벽
      - 로드 밸런서
    answer: 0
    explain: 라우터는 경로표를 보고 받는 곳이 있는 네트워크 쪽으로 넘겨요. 같은 네트워크 안은 스위치가 맡아요.
  - id: same-network-switch
    type: ox
    prompt: 서버 A가 같은 네트워크 안의 서버 B에 보낸 데이터도, 라우터를 거쳐 가나요?
    answer: false
    explain: 같은 네트워크 안은 스위치가 받는 쪽이 있는 포트로 바로 넘겨요. 라우터는 다른 네트워크로 갈 때만 거쳐요.
  - id: packets-split
    type: ox
    prompt: 큰 데이터를 보내면, IP는 그 데이터를 패킷 여러 개로 나눠 보내나요?
    answer: true
    explain: IP는 데이터를 데이터그램(패킷)이라는 덩어리로 나눠 보내요. 패킷마다 다른 길로 갈 수도 있어요.
  - id: interface-name
    type: input
    prompt: 네트워크 장비에서 데이터가 드나드는 구멍(포트) 하나하나를 부르는 이름은?
    answer: [인터페이스, interface]
    explain: 네트워크 장비 모니터링은 대부분 인터페이스마다 무엇이 오가는지 보는 일이에요.
