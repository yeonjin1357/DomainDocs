questions:
  - id: vlan-isolation
    type: ox
    prompt: 같은 스위치에 꽂힌 두 PC가 서로 다른 VLAN에 있어요. 두 PC가 통신하려면 라우터나 L3 스위치를 거쳐야 하나요?
    answer: true
    explain: VLAN이 다르면 다른 네트워크라서, 스위치는 둘 사이로 프레임을 바로 넘기지 않아요.
  - id: trunk-vs-access
    type: choice
    prompt: 스위치 두 대를 이은 선 하나로 VLAN 10, 20, 30을 모두 나르려면 어떤 포트로 설정해야 할까요?
    choices: [트렁크 포트, 액세스 포트, 네이티브 VLAN 포트, 미러링 포트]
    answer: 0
    explain: 트렁크 포트는 프레임마다 VLAN 태그를 붙여 여러 VLAN을 한 선으로 날라요. 액세스 포트는 VLAN 하나에만 속해요.
  - id: svi-traffic
    type: ox
    prompt: VLAN 10 안의 PC 두 대가 서로 큰 파일을 주고받았어요. 이 트래픽은 VLAN 10 인터페이스(SVI)의 그래프에 잡히나요?
    answer: false
    explain: VLAN 인터페이스는 그 VLAN이 라우팅으로 밖과 오간 양을 세요. 같은 VLAN 안에서 스위치가 바로 넘긴 프레임은 거치지 않아요.
  - id: one-vlan-down
    type: choice
    prompt: 트렁크 포트는 up인데 VLAN 30을 쓰는 팀만 다른 층과 통신이 안 돼요. 먼저 볼 것은?
    choices:
      - 트렁크의 허용 VLAN 목록
      - 트렁크 케이블의 연결 상태
      - 그 팀 PC들의 IP 주소
      - 스위치의 MAC 주소 표 크기
    answer: 0
    explain: 허용 목록에서 VLAN 30이 빠지면 링크는 살아 있는데 그 VLAN만 넘어가지 않아요. 포트 상태만 보면 정상으로 보여요.
  - id: native-vlan-name
    type: input
    prompt: 트렁크에서도 태그 없이 오가는 VLAN을 무엇이라고 할까요?
    answer: [네이티브 VLAN, native VLAN, 네이티브]
    term: network/native-vlan
    explain: 네이티브 VLAN은 태그 없이 다녀서, 트렁크 양쪽의 설정이 같아야 해요. Cisco 스위치의 기본값은 VLAN 1이에요.
