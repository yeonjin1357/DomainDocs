questions:
  - id: vlan-isolation
    type: ox
    prompt: 같은 스위치에 꽂힌 두 PC가 서로 다른 VLAN에 있어요. 스위치가 둘 사이로 프레임을 바로 넘겨 주나요?
    answer: false
    explain: VLAN이 다르면 다른 네트워크예요. 둘이 통신하려면 라우터나 L3 스위치를 거쳐야 해요.
  - id: trunk-vs-access
    type: choice
    prompt: 스위치 두 대를 이은 선 하나로 VLAN 10, 20, 30을 모두 나르려면 어떤 포트로 설정해야 할까요?
    choices: [트렁크 포트, 액세스 포트, 네이티브 VLAN 포트, 미러링 포트]
    answer: 0
    explain: 트렁크 포트는 프레임마다 VLAN 태그를 붙여 여러 VLAN을 한 선으로 날라요. 액세스 포트는 VLAN 하나에만 속해요.
  - id: svi-traffic
    type: choice
    prompt: VLAN 10 인터페이스(SVI)의 트래픽 그래프에 잡히지 않는 것은?
    choices:
      - VLAN 10 안의 두 PC끼리 주고받은 파일
      - VLAN 10에서 인터넷으로 나간 요청
      - VLAN 10에서 VLAN 20 서버로 간 요청
      - 다른 네트워크에서 VLAN 10으로 들어온 응답
    answer: 0
    explain: VLAN 인터페이스는 그 VLAN이 라우팅으로 밖과 오간 양을 세요. 같은 VLAN 안에서 스위치가 바로 넘긴 프레임은 거치지 않아요.
  - id: one-vlan-down
    type: choice
    prompt: 트렁크 포트는 up인데 VLAN 30을 쓰는 팀만 다른 층과 통신이 안 돼요. 먼저 볼 것은?
    choices:
      - 트렁크의 허용 VLAN 목록에 30이 있는지
      - 트렁크 포트의 케이블이 빠졌는지
      - 스위치의 전원 상태
      - PC의 화면 해상도
    answer: 0
    explain: 허용 목록에서 VLAN 하나가 빠지면 링크는 살아 있는데 그 VLAN만 넘어가지 않아요. 포트 상태만 보면 정상으로 보여요.
  - id: native-vlan-name
    type: input
    prompt: 트렁크에서도 태그 없이 오가는 VLAN을 무엇이라고 할까요?
    answer: [네이티브 VLAN, native VLAN, 네이티브]
    term: network/native-vlan
    explain: 네이티브 VLAN은 태그 없이 다녀서, 트렁크 양쪽의 설정이 같아야 해요. Cisco 스위치의 기본값은 VLAN 1이에요.
