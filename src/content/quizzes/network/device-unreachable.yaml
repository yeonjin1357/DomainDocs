questions:
  - id: snmp-only-causes
    type: choice
    prompt: 장비가 ping에는 답하는데 SNMP에는 답하지 않아요. 가장 그럴듯한 원인은?
    choices:
      - 커뮤니티 문자열이 바뀌었어요
      - 장비의 전원이 꺼졌어요
      - 관리 서버까지 길이 끊겼어요
      - 장비가 ICMP만 막고 있어요
    answer: 0
    explain: ping에 답하니 장비도 길도 살아 있어요. 커뮤니티 문자열이나 v3 계정, 장비 ACL, 161번 포트를 막는 방화벽처럼 질문 쪽을 봐요.
  - id: moved-monitoring-server
    type: choice
    prompt: 관리 서버를 옮긴 뒤 여러 장비가 한꺼번에 응답 없음이 됐어요. 먼저 볼 곳은?
    choices:
      - 장비 ACL에 든 허용 주소
      - 장비마다 들어온 전원
      - 장비마다 CPU 사용률
      - 장비마다 줄어든 가동 시간
    answer: 0
    explain: 여러 장비가 같은 때 함께 끊겼다면 공통으로 바뀐 것부터 봐요. 장비는 ACL에 없는 주소의 질문에 답하지 않아서, 새 관리 서버 주소가 들어 있는지 봐요.
  - id: uptime-reset
    type: choice
    prompt: 응답 없음이 풀린 뒤, 장비 가동 시간이 41일에서 6분으로 줄었어요. 무슨 일이 있었을까요?
    choices:
      - 그사이 장비가 다시 시작했어요
      - 장비의 시계가 늦어졌어요
      - SNMP 버전이 바뀌었어요
      - 관리 서버가 다시 시작했어요
    answer: 0
    explain: 가동 시간은 다시 시작한 뒤 흐른 시간이에요. 재시작 직전의 Syslog에서 전원, 과열 같은 원인을 찾아봐요.
  - id: busy-cpu-flaps
    type: ox
    prompt: 장비 CPU가 아주 바쁘면, 장비가 살아 있어도 SNMP 답이 제한 시간을 넘겨 응답 없음으로 보이나요?
    answer: true
    explain: 바쁜 장비는 SNMP 답을 늦게 줘요. 그래서 응답 없음이 짧게 났다 풀렸다를 되풀이한다면 장비 CPU와 SNMP 제한 시간을 함께 봐요.
  - id: whole-site-down
    type: choice
    prompt: 같은 지점의 장비 12대가 한꺼번에 응답 없음이에요. 먼저 볼 곳은?
    choices:
      - 그 지점으로 가는 회선
      - 장비마다 SNMP 설정
      - 장비마다 CPU 사용률
      - 장비마다 전원 상태
    answer: 0
    explain: 모두 함께 끊겼다면 장비 하나하나보다 그 지점으로 가는 회선이나 앞단 라우터를 먼저 봐요.
