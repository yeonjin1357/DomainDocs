questions:
  - id: polling-misses-flap
    type: ox
    prompt: 2분마다 읽은 ifOperStatus가 늘 up이에요. 링크가 한 번도 끊기지 않았다고 볼 수 있나요?
    answer: false
    explain: 폴링 사이에 끊겼다 붙으면 읽을 때마다 up으로 보여요. 상태가 바뀐 시각(ifLastChange)이 달라졌는지 함께 봐요.
  - id: last-change
    type: choice
    prompt: 폴링 사이에 인터페이스 상태가 바뀌었는지 알려 주는 값은?
    choices:
      - ifLastChange
      - ifSpeed
      - ifInOctets
      - ifAdminStatus
    answer: 0
    explain: ifLastChange는 지금 상태로 들어간 때의 장비 가동 시간 값이에요. 읽을 때마다 바뀐다면 그사이 상태가 또 바뀐 거예요.
  - id: physical-first
    type: choice
    prompt: 링크가 끊겼다 붙기를 되풀이하고, 받은 오류(ifInErrors)도 함께 늘어요. 먼저 의심할 것은?
    choices:
      - 케이블이나 광 모듈 같은 물리 문제
      - 서버의 DNS 설정
      - 앱의 커넥션 풀 크기
      - SNMP 커뮤니티 문자열
    answer: 0
    explain: 플래핑은 대부분 물리 쪽에서 와요. 케이블, 광 모듈, 양쪽 속도·duplex 설정, 서버 네트워크 카드 순으로 좁혀요.
  - id: group-flap-alerts
    type: choice
    prompt: 플래핑하는 포트 하나가 10분 동안 알림 30개를 만들어요. 알림은 어떻게 보내는 게 좋을까요?
    choices:
      - 같은 포트의 변화를 묶어 "10분 동안 30번 바뀜" 하나로 보내요
      - 바뀔 때마다 하나씩 그대로 보내요
      - 그 포트의 알림을 모두 꺼요
      - linkUp 알림만 보내요
    answer: 0
    explain: 쏟아지는 알림은 다른 중요한 알림을 묻어요. 한 사건으로 묶으면 횟수 정보는 살리면서 소음은 줄여요.
