questions:
  - id: wrong-speed
    type: choice
    prompt: 1Gbps 포트에 100Mbps 회선을 물렸고, 화면의 사용률은 포트 속도 기준으로 10%예요. 실제 회선은 어떤 상태일까요?
    choices:
      - 회선은 꽉 찼어요
      - 회선의 10%만 쓰고 있어요
      - 회선의 1%만 쓰고 있어요
      - 이 정보로는 알 수 없어요
    answer: 0
    explain: 1Gbps의 10%는 100Mbps라서 회선 속도를 다 쓴 거예요. 계산에 쓴 속도가 실제 회선 속도와 같은지 먼저 봐요.
  - id: hidden-bursts
    type: choice
    prompt: 5분 평균 사용률은 70%인데, 보내는 쪽의 버린 패킷(ifOutDiscards)이 계속 늘어요. 의심할 것은?
    choices:
      - 평균에 가려진 몇 초짜리 순간 폭주
      - 케이블이나 커넥터의 손상
      - 바이트 카운터가 한 바퀴 돈 것
      - 관리자가 포트를 꺼 둔 것
    answer: 0
    explain: 평균은 짧은 폭주를 지워요. 몇 초 동안 넘치면 버퍼가 차서 패킷이 버려지니, 짧은 간격으로 다시 봐요.
  - id: full-but-no-drops
    type: ox
    prompt: 회선 사용률이 95%인데 버린 패킷은 늘지 않아요. 당장 문제는 아니라고 볼 수 있나요?
    answer: true
    explain: 꽉 차게 잘 쓰고 있는 거예요. 버린 패킷이 함께 늘 때가 정말 넘치는 때예요.
  - id: who-uses-it
    type: choice
    prompt: 회선을 가득 채운 게 어느 서버와 서비스인지 찾으려면 무엇을 봐야 할까요?
    choices:
      - NetFlow나 sFlow 같은 흐름 정보
      - 인터페이스의 바이트 카운터
      - 인터페이스의 동작 상태(ifOperStatus)
      - 장비의 가동 시간
    answer: 0
    explain: 인터페이스 카운터는 양만 알려 주고 누가 보냈는지는 몰라요. 흐름 정보로 주소와 포트별 양을 줄 세워 봐요.
  - id: realtime-cannot-resend
    type: ox
    prompt: 회선이 넘쳐 패킷이 버려질 때, 화상 회의 트래픽도 잃은 패킷을 다시 보내 끊김 없이 이어지나요?
    answer: false
    explain: 화상 회의처럼 늦게 오면 쓸모없는 트래픽은 다시 보내 메우지 못해 끊겨요. TCP 전송은 다시 보내는 대신 느려져요.
