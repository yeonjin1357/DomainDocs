questions:
  - id: who-starts
    type: choice
    prompt: 스트리밍 텔레메트리(gNMI STREAM 구독)에서 값은 어떻게 오나요?
    choices:
      - 관리 서버가 한 번 구독하면 장비가 정한 규칙대로 계속 보내요
      - 관리 서버가 값마다 주기적으로 물어서 받아요
      - 장비가 문제가 생겼을 때만 Trap으로 보내요
      - 관리 서버가 장비의 로그 파일을 읽어 가요
    answer: 0
    explain: 구독은 한 번이고, 그 뒤로는 장비가 열어 둔 연결로 보내요. 주기마다 묻는 건 SNMP 폴링이에요.
  - id: on-change-silence
    type: ox
    prompt: ON_CHANGE로 구독한 인터페이스 상태가 한 시간째 오지 않는다면, 수집이 끊겼다는 뜻인가요?
    answer: false
    explain: 바뀌지 않으면 보내지 않는 게 ON_CHANGE예요. 끊김과 가리려면 heartbeat_interval을 정해 둬요.
  - id: sample-interval
    type: choice
    prompt: 1분마다 묻는 SNMP 그래프에는 안 보이던 10초짜리 폭주가 스트리밍 그래프에는 보여요. 왜 그럴까요?
    choices:
      - 스트리밍은 더 짧은 간격으로 값을 받아서 짧은 변화가 남아요
      - SNMP가 값을 잘못 읽어서요
      - 스트리밍은 바이트 대신 비트로 세서요
      - SNMP는 받은 쪽만 세서요
    answer: 0
    explain: 1분 간격은 그 사이의 짧은 폭주를 평균에 묻어요. 간격이 다른 그래프를 나란히 둘 때 조심해요.
  - id: counter-still-rate
    type: ox
    prompt: gNMI로 받은 in-octets도 계속 늘어나는 카운터라, 초당 양은 두 값의 차이로 구하나요?
    answer: true
    explain: 받는 방식만 다를 뿐 값은 SNMP의 ifHCInOctets처럼 누적 카운터예요. 사용률 계산도 같아요.
  - id: gnmi-term
    type: input
    prompt: OpenConfig가 정한, gRPC로 장비 설정과 텔레메트리를 주고받는 규약의 이름은?
    answer: [gNMI, gRPC Network Management Interface, 지엔엠아이]
    explain: 값을 YANG 모델의 경로로 고르고, ONCE·POLL·STREAM 방식으로 구독해요.
