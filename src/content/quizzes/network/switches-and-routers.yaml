questions:
  - id: unknown-mac-flood
    type: choice
    prompt: 스위치가 MAC 주소 표에 없는 목적지로 가는 데이터를 받으면 어떻게 할까요?
    choices:
      - 받은 포트만 빼고 모든 포트로
      - 목적지를 모르니 그대로 버려요
      - 라우터인 기본 게이트웨이로 넘겨요
      - 보낸 쪽 포트로 그대로 되돌려요
    answer: 0
    explain: 받는 쪽 자리를 모르니 같은 네트워크의 모든 포트로 내보내는데, 이를 플러딩이라고 해요. 받는 쪽이 답하면 그 포트를 배워 다음부터는 그 포트로만 보내요.
  - id: gateway-first
    type: choice
    prompt: 서버가 IP로 직접 연결해도, 같은 네트워크와는 통신이 되고 다른 네트워크와만 안 돼요. 먼저 볼 곳은?
    choices:
      - 기본 게이트웨이와 그 너머 경로
      - 스위치의 MAC 주소 표 크기
      - 서버의 DNS 리졸버 설정
      - 서버 인터페이스의 속도
    answer: 0
    explain: 다른 네트워크로 가는 데이터는 모두 기본 게이트웨이(라우터)를 거쳐요. 게이트웨이가 멈추면 바깥과만 끊겨요. IP로 직접 연결했으니 DNS는 아니에요.
  - id: mac-aging
    type: ox
    prompt: 스위치의 MAC 주소 표에서, 한동안 데이터가 오지 않은 주소의 항목은 지워지나요?
    answer: true
    explain: 이를 에이징이라고 해요. 지워진 주소로 가는 데이터는 다시 플러딩돼요.
  - id: flooding-symptom
    type: choice
    prompt: 같은 네트워크의 여러 포트에서 상관없는 트래픽이 한꺼번에 늘었어요. 의심할 것은?
    choices:
      - MAC 표가 넘쳐 플러딩이 늘었어요
      - 라우터의 기본 경로가 바뀌었어요
      - DNS 레코드의 TTL이 짧아졌어요
      - 서버들의 포트 번호가 바뀌었어요
    answer: 0
    explain: 표가 다 차면 새 주소를 배우지 못해 그 주소로 가는 데이터를 계속 모든 포트로 내보내요. 그래서 상관없는 포트까지 트래픽이 늘어요.
  - id: default-route
    type: choice
    prompt: 라우터 경로표의 0.0.0.0/0 줄은 무슨 뜻일까요?
    choices:
      - 맞는 줄이 없을 때 가는 기본 경로
      - 어디로도 보내지 말고 버리는 경로
      - 라우터 자신에게 오는 주소
      - 같은 네트워크 안의 주소 전부
    answer: 0
    explain: 0.0.0.0/0은 모든 주소에 맞는 경로예요. 더 맞는 줄이 없을 때 이 경로로 보내요.
