questions:
  - id: middle-hop-loss
    type: choice
    prompt: traceroute에서 4번째 라우터만 손실 60%로 보이고, 그 뒤 구간과 목적지는 손실 0%예요. 맞는 해석은?
    choices:
      - 그 라우터가 답을 아끼는 것뿐이에요
      - 4번째 라우터가 지나가는 패킷을 버리고 있어요
      - 목적지 서버에 문제가 있어요
      - 4번째 구간에서 경로가 끊겼어요
    answer: 0
    explain: 라우터는 지나가는 패킷과 자기에게 온 질문을 다르게 다뤄요. 진짜 손실이라면 그 구간부터 끝까지 이어져요.
  - id: where-delay-starts
    type: choice
    prompt: traceroute에서 3번째 구간부터 늘어난 지연이 목적지까지 그대로 이어져요. 지연은 어디에서 생겼을까요?
    choices:
      - 2번째와 3번째 구간 사이
      - 목적지 서버
      - 1번째 구간
      - 이 정보로는 알 수 없어요
    answer: 0
    explain: 어디서부터 늘어나 그 뒤로 계속 이어지는지를 봐요. 그 경계 구간을 잇는 인터페이스의 사용률과 버림을 확인해요.
  - id: all-sites-slow
    type: choice
    prompt: 여러 지점에서 본사로 가는 길이 모두 느려졌어요. 먼저 볼 곳은?
    choices:
      - 본사 쪽 공통 구간
      - 지점마다 있는 라우터
      - 서버마다 CPU 사용률
      - 사용자 PC의 성능
    answer: 0
    explain: 모두가 함께 나빠졌다면 모두가 지나는 공통 구간(본사 회선, 방화벽)이 원인일 가능성이 커요.
  - id: reverse-path
    type: ox
    prompt: 가는 길과 오는 길을 모두 보려면, 양쪽 끝에서 traceroute를 따로 돌려야 하나요?
    answer: true
    explain: traceroute는 보낸 쪽에서 가는 길만 보여 줘요. 오는 길은 다를 수 있어서 반대쪽에서도 돌려 견줘요.
  - id: traceroute-how
    type: choice
    prompt: traceroute는 어떻게 길 위의 라우터를 알아낼까요?
    choices:
      - TTL을 늘려 가며 시간 초과 답을 받아요
      - 라우터마다 SNMP로 경로표를 읽어요
      - 목적지 서버가 지나온 경로를 알려 줘요
      - DNS 서버에 경로를 물어봐요
    answer: 0
    explain: TTL이 다 된 패킷을 받은 라우터는 "시간 초과"로 답해요. 그래서 TTL을 늘려 가며 한 구간씩 차례로 알아내요.
