questions:
  - id: same-subnet
    type: choice
    prompt: 192.168.10.25/24와 같은 네트워크에 있는 주소는?
    choices:
      - 192.168.10.200
      - 192.168.11.25
      - 192.169.10.25
      - 10.168.10.25
    answer: 0
    explain: /24는 앞 숫자 세 개(24비트)가 네트워크 부분이에요. 192.168.10.으로 시작하는 주소끼리 같은 네트워크예요.
  - id: mac-on-lan
    type: ox
    prompt: 같은 네트워크 안에서 데이터를 실제로 전할 때는 IP 주소만 보고 전하나요?
    answer: false
    explain: 같은 네트워크 안에서는 MAC 주소를 봐요. 그래서 보내는 쪽은 받는 쪽 IP를 MAC 주소로 바꾸는 단계를 거쳐요.
  - id: port-picks-program
    type: choice
    prompt: 한 서버에서 웹 서버와 DB가 함께 돌아요. 들어온 데이터를 어느 프로그램에 줄지 무엇으로 구별할까요?
    choices:
      - 포트 번호
      - MAC 주소
      - IP 주소
      - 서브넷
    answer: 0
    explain: IP 주소는 서버까지, 포트 번호는 그 안의 프로그램까지 가리켜요. 연결 하나는 양쪽의 IP와 포트로 정해져요.
  - id: private-ip-overlap
    type: ox
    prompt: 서로 다른 데이터센터의 서버 두 대가 같은 사설 IP(10.0.0.5)를 가질 수 있나요?
    answer: true
    explain: 사설 IP 대역은 조직과 환경마다 따로 써요. 그래서 IP만으로 장비를 구별하면 서로 섞일 수 있어요.
  - id: arp-name
    type: input
    prompt: 같은 네트워크에서 "이 IP를 가진 장비는 누구예요?"라고 물어 MAC 주소를 알아내는 규약은?
    answer: [ARP]
    term: network/arp
    explain: ARP로 받는 쪽의 MAC 주소를 알아낸 뒤부터는 그 MAC 주소로 보내요.
