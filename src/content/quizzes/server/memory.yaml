questions:
  - id: available-is-headroom
    type: choice
    prompt: 16GB 서버에서 free는 1.2GB, buff/cache는 9.8GB, available은 10.1GB예요. 새 프로그램에 내줄 수 있는 메모리에 가장 가까운 값은?
    choices:
      - 약 10.1GB
      - 약 1.2GB
      - 약 9.8GB
      - 약 14.8GB
    answer: 0
    explain: 리눅스는 남는 메모리를 파일 캐시로 쓰고, 필요하면 비워 줘요. 비울 수 있는 캐시까지 계산한 값이 available이에요.
  - id: used-minus-free
    type: ox
    prompt: (전체 − free) ÷ 전체로 계산한 메모리 사용률이 92%예요. 앱들이 메모리를 92% 쓰고 있다고 볼 수 있나요?
    answer: false
    explain: 이렇게 계산하면 파일 캐시까지 사용으로 잡혀서 늘 꽉 차 보여요. available을 기준으로 계산해야 앱이 실제로 쓰는 몫이에요.
  - id: rss-not-vmsize
    type: choice
    prompt: 프로세스가 실제 메모리에 올려 둔 양을 보려면 어떤 값을 봐야 할까요?
    choices:
      - RSS(VmRSS)
      - 가상 메모리 크기(VmSize)
      - buff/cache
      - 스왑 사용량
    answer: 0
    explain: 가상 메모리 크기는 잡아 둔 주소 공간이라 실제보다 훨씬 커요. 실제로 메모리에 올라온 양은 RSS예요.
  - id: swap-used-not-active
    type: ox
    prompt: 스왑 사용량은 높지만 vmstat의 si·so가 0에 가까워요. 지금 스왑 때문에 서버가 느려지고 있다고 볼 수 있나요?
    answer: false
    explain: 한 번 내보낸 메모리는 다시 쓰이기 전까지 스왑에 남아요. 지금 스왑을 오가는 양이 있어야 느려져요.
  - id: oom-killer-name
    type: input
    prompt: 프로세스가 오류 로그도 없이 사라졌어요. 메모리가 끝내 모자랄 때 커널이 프로세스 하나를 골라 끝내는 기능은?
    answer: [OOM killer]
    term: server/oom-killer
    explain: OOM killer는 프로세스마다 점수를 매겨 가장 높은 쪽을 끝내요. 그 시각의 메모리와 커널 로그를 함께 봐요.
