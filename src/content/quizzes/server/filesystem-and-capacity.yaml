questions:
  - id: inode-full
    type: choice
    prompt: 디스크 용량은 78%인데, 새 파일을 만들 때 공간이 없다는 에러가 나요. 먼저 볼 것은?
    choices:
      - inode가 다 찼는지
      - 열린 채 지워진 파일이 있는지
      - root 몫 예약 공간이 찼는지
      - 디스크 지연이 늘었는지
    answer: 0
    explain: 작은 파일이 아주 많으면 용량이 남아도 inode가 먼저 바닥나요. df -i로 inode 사용률을 봐요.
  - id: deleted-open-file
    type: ox
    prompt: 앱이 계속 쓰고 있는 큰 로그 파일을 rm으로 지우면, 앱이 그 파일을 닫을 때까지 디스크 공간이 그대로 남나요?
    answer: true
    explain: 파일을 연 프로세스가 모두 닫을 때까지 내용은 남아요. 이름만 사라지고, 공간은 앱이 파일을 닫거나 다시 시작해야 돌아와요.
  - id: reserved-blocks
    type: choice
    prompt: ext4에서 일반 사용자로 도는 앱이, 디스크 사용량 95%쯤에서 공간이 없다는 에러를 만났어요. 왜일까요?
    choices:
      - root 몫 예약 공간 때문에
      - 페이지 캐시가 디스크 공간을 차지해서
      - 디스크 지연이 커져 쓰기가 실패해서
      - 스왑이 디스크 공간을 먼저 가져가서
    answer: 0
    explain: ext4는 기본으로 전체 블록의 5%를 root 몫으로 남겨 둬요. 그래서 일반 사용자로 도는 앱은 95%쯤에서 공간이 없다는 에러를 만나요.
  - id: inode-ratio-fixed
    type: ox
    prompt: ext4는 파일 시스템을 만든 뒤에도 inode 비율을 바꿔 inode 수를 늘릴 수 있나요?
    answer: false
    explain: inode 비율은 파일 시스템을 만들 때 정하고, 만든 뒤에는 바꿀 수 없어요. 작은 파일이 많을 서버라면 처음에 넉넉히 잡아요.
  - id: inode-name
    type: input
    prompt: 파일마다 하나씩 있고, 크기·권한·시각과 내용이 든 블록의 위치를 담는 것은?
    answer: [inode]
    term: server/inode
    explain: 파일 이름은 inode를 가리키고, inode가 내용이 든 데이터 블록을 가리켜요. 그래서 용량과 inode가 따로 찰 수 있어요.
