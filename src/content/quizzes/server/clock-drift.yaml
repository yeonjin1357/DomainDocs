questions:
  - id: nine-hours
    type: choice
    prompt: 두 서버의 로그 시각이 정확히 9시간씩 어긋나요. 가장 그럴듯한 원인은?
    choices:
      - 한 서버는 UTC로, 다른 서버는 한국 시간으로 적어요
      - 한 서버의 시간 동기화가 꺼졌어요
      - 두 서버 사이 네트워크가 느려요
      - 한 서버의 시계 배터리가 닳았어요
    answer: 0
    explain: 정확히 몇 시간 단위로 어긋나면 시계가 아니라 시간대 문제예요. 한국 시간은 UTC보다 9시간 빨라요.
  - id: child-span-first
    type: ox
    prompt: 트레이스에서 자식 구간이 부모 구간보다 먼저 시작한 것처럼 보여요. 두 서버의 시계 차이를 의심할 만한가요?
    answer: true
    explain: 구간 시각은 그 구간을 처리한 서버의 시계로 찍혀요. 시계가 어긋나면 순서가 뒤집혀 보여요.
  - id: unsynced-drifts
    type: choice
    prompt: 시간 동기화가 꺼진 서버의 시계는 시간이 지나면 어떻게 될까요?
    choices:
      - 점점 더 어긋나요
      - 처음 맞춘 그대로 정확해요
      - 하루에 한 번 저절로 맞춰져요
      - 재부팅할 때만 어긋나요
    answer: 0
    explain: 서버의 시계는 조금씩 빨라지거나 느려져요. 그래서 시간 서버와 주기적으로 맞춰야 해요.
  - id: no-sudden-step
    type: ox
    prompt: 운영 중인 서버의 시계가 크게 어긋났다면, 한 번에 훌쩍 맞추는 게 언제나 가장 안전한가요?
    answer: false
    explain: 시간이 건너뛰면 시간을 기준으로 동작하는 프로그램이 흔들릴 수 있어요. 그래서 보통은 시계를 조금씩 돌려 서서히 맞춰요.
  - id: ntp-name
    type: input
    prompt: 서버가 시간 서버와 시각을 주기적으로 맞출 때 쓰는 표준 프로토콜의 약어는?
    answer: [NTP, Network Time Protocol]
    explain: 리눅스에서는 chrony나 systemd-timesyncd가 NTP로 시각을 맞춰요. timedatectl로 동기화가 도는지 볼 수 있어요.
