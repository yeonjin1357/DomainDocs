questions:
  - id: no-data-not-down
    type: ox
    prompt: 서버 목록에서 서버 한 대가 '데이터 없음'으로 바뀌었어요. 서버가 꺼졌다는 뜻인가요?
    answer: false
    explain: 데이터 없음은 "모른다"는 뜻이에요. 서버, 네트워크, 에이전트 중 어디가 멈췄는지 바깥에서 안쪽 순서로 가려요.
  - id: ping-ok-no-metrics
    type: choice
    prompt: 그 서버로 ping은 되는데 지표만 들어오지 않아요. 다음에 볼 곳은?
    choices:
      - 재부팅했는지와 에이전트의 상태
      - 그 서버 앞의 네트워크 장비
      - 서버의 전원
      - 모니터링 화면의 시간대 설정
    answer: 0
    explain: ping이 되면 서버는 살아 있고 길도 이어져 있어요. 켜진 시각이 끊긴 시각과 맞는지 보고, 아니면 에이전트가 도는지 봐요.
  - id: ping-blocked
    type: choice
    prompt: ping은 응답이 없는데, 웹 서비스(443 포트)는 잘 응답해요. 가장 그럴듯한 이유는?
    choices:
      - 방화벽이 ping만 막고 있어요
      - 서버가 꺼졌어요
      - 에이전트가 멈췄어요
      - 서버가 재부팅하는 중이에요
    answer: 0
    explain: 서비스가 응답하면 서버는 살아 있어요. ping에 쓰는 메시지만 방화벽에서 막는 곳이 많아요.
  - id: many-at-once
    type: choice
    prompt: 서버 여러 대의 수집이 같은 시각에 함께 끊겼어요. 먼저 볼 곳은?
    choices:
      - 그 서버들이 함께 지나는 네트워크나 모니터링 서버
      - 서버마다 에이전트 로그
      - 서버마다 메모리 사용량
      - 서버마다 디스크 용량
    answer: 0
    explain: 여럿이 한꺼번에 끊겼다면 각 서버보다 공통으로 지나는 곳이 원인일 가능성이 커요.
  - id: gap-not-zero
    type: ox
    prompt: 수집이 끊겼던 구간을 그래프에서 0으로 채워 보여 주는 게 좋나요?
    answer: false
    explain: 0으로 채우면 "그때 아무 일도 없었다"로 잘못 읽혀요. 빈 구간은 비워 두고, 끊긴 사실을 따로 표시해요.
