questions:
  - id: threads-share-memory
    type: ox
    prompt: 같은 프로세스 안의 두 스레드는 서로 다른 메모리 공간을 쓰나요?
    answer: false
    explain: 같은 프로세스의 스레드는 메모리를 함께 써요. 스레드마다 따로 가진 건 어디까지 실행했는지 담은 스택이에요.
  - id: d-state-surge
    type: choice
    prompt: 서버에서 D 상태 프로세스가 갑자기 많아졌어요. 먼저 의심할 것은?
    choices:
      - 디스크나 네트워크 저장소의 응답이 느려졌어요
      - CPU 코어가 모자라 차례를 기다려요
      - 부모 프로세스가 끝난 자식을 거두지 않아요
      - 프로세스들이 다음 요청을 기다리며 쉬고 있어요
    answer: 0
    explain: D 상태는 깨울 수 없는 잠이라, 보통 디스크 입출력을 기다려요. 코어가 모자라 기다리는 건 R, 거두지 않은 건 좀비(Z)예요.
  - id: zombie-fix
    type: choice
    prompt: 좀비 프로세스가 계속 쌓여요. 어디를 고쳐야 할까요?
    choices:
      - 끝난 자식 프로세스를 거두지 않는 부모 프로그램
      - 응답이 느린 디스크
      - 코어 수가 적은 CPU
      - 스왑이 꺼진 메모리 설정
    answer: 0
    explain: 좀비는 이미 끝났지만 부모가 아직 거두지 않은 프로세스예요. 부모 프로그램이 자식을 제대로 거두게 고쳐요.
  - id: thread-leak
    type: ox
    prompt: 앱의 스레드 수가 줄지 않고 계속 늘기만 해도, 스레드는 메모리를 거의 쓰지 않으니 괜찮을까요?
    answer: false
    explain: 스레드마다 스택 메모리를 써요. 만들고 끝내지 않는 스레드가 쌓이면 결국 메모리가 모자라요.
  - id: scheduler-name
    type: input
    prompt: 실행할 준비가 된 스레드가 코어보다 많을 때, 다음에 CPU에서 돌릴 스레드를 고르는 커널의 부분은?
    answer: [스케줄러]
    term: server/scheduler
    explain: 코어 하나는 한 번에 스레드 하나만 실행해요. 스케줄러가 고르지 않은 스레드는 실행 대기 줄에서 기다려요.
