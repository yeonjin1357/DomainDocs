questions:
  - id: df-du-gap
    type: choice
    prompt: 큰 로그를 지웠는데 df 사용량은 그대로이고, du로 센 합계는 df보다 훨씬 작아요. 무엇을 찾아야 할까요?
    choices:
      - 지워졌지만 아직 열려 있는 파일
      - inode가 다 찬 디렉터리
      - 응답이 느려진 디스크
      - root 몫으로 남겨 둔 예약 공간
    answer: 0
    explain: df는 파일 시스템이 쓴 공간을, du는 이름이 남은 파일만 세요. lsof +L1로 열린 채 지워진 파일과 그 프로세스를 찾아요.
  - id: truncate-not-rm
    type: ox
    prompt: 앱이 아직 쓰고 있는 로그 파일을 지우지 않고 내용만 비우면, 앱이 파일을 닫지 않아도 공간이 돌아오나요?
    answer: true
    explain: rm은 이름만 지워서, 앱이 파일을 잡고 있으면 공간이 돌아오지 않아요. 내용을 비우면 열린 파일 그대로 크기가 0이 돼요.
  - id: urgency-by-rate
    type: choice
    prompt: 두 서버 모두 디스크가 95%이고 남은 공간은 20GB예요. 더 급한 쪽은?
    choices:
      - 하루에 10GB씩 늘어나는 서버
      - 하루에 0.1GB씩 늘어나는 서버
      - 둘 다 똑같이 급해요
      - 사용률이 같으니 알 수 없어요
    answer: 0
    explain: 앞 서버는 2일, 뒤 서버는 200일쯤 남았어요. 사용률보다 언제 다 차는지가 무엇부터 손볼지 알려 줘요.
  - id: common-causes
    type: choice
    prompt: /var가 일주일 사이 70%에서 95%가 됐어요. 흔한 원인이 아닌 것은?
    choices:
      - 커진 페이지 캐시
      - 회전(rotation)되지 않는 로그 파일
      - 지우지 않은 백업과 덤프 파일
      - 길게 잡힌 데이터 보관 기간
    answer: 0
    explain: 페이지 캐시는 메모리에 있어서 디스크를 채우지 않아요. 디스크를 채우는 건 쌓이는 파일이라, du로 큰 디렉터리부터 좁혀 가요.
