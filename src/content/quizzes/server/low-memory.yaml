questions:
  - id: fix-alert-basis
    type: choice
    prompt: 메모리 사용률 97% 알림이 왔는데 앱은 멀쩡해요. 같은 서버를 available 기준으로 계산하면 38%예요. 가장 알맞은 조치는?
    choices:
      - 알림의 계산을 available 기준으로 고쳐요
      - 서버 메모리를 바로 늘려요
      - 스왑을 꺼요
      - 메모리를 많이 쓰는 프로세스를 끝내요
    answer: 0
    explain: 97%는 파일 캐시까지 사용으로 센 값이에요. 캐시는 앱이 원하면 비워 주니, 진짜 여유인 available로 알림을 걸어요.
  - id: leak-evidence
    type: choice
    prompt: 앱의 메모리 누수를 의심할 만한 근거는?
    choices:
      - 하루 넘게 RSS의 바닥이 요청이 줄어도 계속 올라가요
      - 몇 분 사이 RSS가 잠깐 올랐다가 내려와요
      - free가 늘 작게 보여요
      - 스왑 사용량이 높은 채로 조용해요
    answer: 0
    explain: 일의 양에 따라 오르내리는 건 정상이에요. 요청이 줄어드는 밤에도 바닥이 계속 높아지면 누수를 의심해요.
  - id: rss-grows-heap-ok
    type: ox
    prompt: 자바 앱에서 힙은 여유로운데 RSS만 계속 오른다면, 힙 밖 메모리가 늘고 있을 수 있나요?
    answer: true
    explain: RSS는 프로세스 전체가 실제 메모리에 올린 양이고, 힙은 그중 일부예요. 둘을 따로 보면 어디가 느는지 갈라져요.
  - id: vanished-process
    type: choice
    prompt: 앱 프로세스가 에러 로그도 없이 사라졌어요. 가장 먼저 볼 곳은?
    choices:
      - 커널 로그의 Killed process 기록
      - 앱의 에러 로그
      - 디스크 사용률 그래프
      - CPU 부하 그래프
    answer: 0
    explain: OOM killer는 앱에 알리지 않고 끝내서 앱 로그에는 흔적이 없어요. dmesg -T 같은 커널 로그에 끝낸 프로세스가 남아요.
  - id: container-oom
    type: ox
    prompt: 컨테이너 안의 앱이 메모리 부족으로 끝났다면, 서버 전체의 메모리가 모자랐다는 뜻인가요?
    answer: false
    explain: 컨테이너는 자기 메모리 한도를 넘어도 끝나요. 서버에 여유가 있어도 그래서, 컨테이너 한도부터 봐요.
