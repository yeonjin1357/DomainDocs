questions:
  - id: fix-alert-basis
    type: choice
    prompt: 메모리 사용률 97% 알림이 왔는데 앱은 멀쩡해요. 같은 서버를 available 기준으로 계산하면 38%예요. 가장 알맞은 조치는?
    choices:
      - 알림을 available 기준으로 고쳐요
      - 서버 메모리를 더 큰 것으로 늘려요
      - 파일 캐시를 비우는 작업을 걸어 둬요
      - 메모리를 가장 많이 쓰는 프로세스를 다시 시작해요
    answer: 0
    explain: 97%는 파일 캐시까지 사용으로 센 값이에요. 캐시는 앱이 원하면 비워 주니, 진짜 여유인 available로 알림을 걸어요.
  - id: leak-evidence
    type: choice
    prompt: 앱의 메모리 누수를 의심할 만한 근거는?
    choices:
      - RSS의 바닥이 밤에도 계속 높아져요
      - 몇 분 사이 RSS가 잠깐 올랐다가 내려와요
      - free가 하루 내내 작게 보여요
      - 스왑 사용량이 높은 채로 조용해요
    answer: 0
    explain: 일의 양에 따라 오르내리는 건 정상이에요. 요청이 줄어드는 밤에도 바닥이 계속 높아지면 누수를 의심해요.
  - id: rss-grows-heap-ok
    type: ox
    prompt: 자바 앱의 RSS에는 JVM 힙 말고 힙 밖에서 쓰는 메모리도 들어가나요?
    answer: true
    explain: RSS는 프로세스 전체가 실제 메모리에 올린 양이고, 힙은 그중 일부예요. 그래서 힙은 여유로운데 RSS만 오르면 힙 밖 메모리가 늘고 있어요.
  - id: vanished-process
    type: choice
    prompt: 앱 프로세스가 에러 로그도 없이 사라졌어요. 가장 먼저 볼 곳은?
    choices:
      - 커널 로그의 Killed process 줄
      - 앱이 남긴 힙 덤프 파일
      - 그 시각 앞뒤의 디스크 사용률 그래프
      - 그 시각 앞뒤의 CPU 부하 그래프
    answer: 0
    explain: OOM killer는 앱에 알리지 않고 끝내서 앱 로그에는 흔적이 없어요. dmesg -T 같은 커널 로그에 끝낸 프로세스가 남아요.
  - id: container-oom
    type: ox
    prompt: 서버 메모리에 여유가 있어도, 컨테이너가 자기 메모리 한도를 넘으면 그 안의 앱이 끝나나요?
    answer: true
    explain: 컨테이너는 자기 메모리 한도를 넘으면 끝나요. 그래서 서버에 여유가 있어도 컨테이너 한도부터 봐요.
