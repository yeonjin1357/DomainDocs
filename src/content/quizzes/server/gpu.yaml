questions:
  - id: util-is-time-share
    type: ox
    prompt: 작은 계산 하나가 SM 두 개만 쓰면서 1초 내내 쉬지 않고 돌았어요. 이때 GPU 사용률은 100%로 나오나요?
    answer: true
    explain: GPU 사용률은 계산이 하나라도 돈 시간의 비율이에요. SM을 몇 개 썼는지는 들어가지 않아서, 쉬지 않고 돌았다면 100%예요.
  - id: fullness-metric
    type: choice
    prompt: GPU 사용률이 100%인데, GPU를 얼마나 꽉 채워 쓰는지 알고 싶어요. 무엇을 봐야 할까요?
    choices:
      - SM 활동
      - 메모리 사용률
      - GPU 온도
      - XID 번호
    answer: 0
    explain: SM 활동은 SM마다 일감이 올라 있던 시간을 평균한 값이라, 몇 개의 SM이 일했는지가 반영돼요. 사용률은 쉬지 않았는지만 알려 줘요.
  - id: memory-util-meaning
    type: ox
    prompt: GPU의 메모리 사용률이 30%라면, GPU 메모리의 30%가 차 있다는 뜻인가요?
    answer: false
    explain: 메모리 사용률은 메모리를 읽고 쓰느라 바빴던 시간의 비율이에요. 얼마나 찼는지는 메모리 사용량(MiB)으로 봐요.
  - id: same-util-slower
    type: choice
    prompt: GPU 사용률은 계속 100%인데 학습 속도가 절반으로 떨어졌어요. 같은 시각에 함께 볼 숫자로 가장 알맞은 것은?
    choices:
      - 온도와 SM 클럭
      - 서버 메모리의 스왑 사용량
      - GPU 메모리 사용량
      - 마지막 XID 번호
    answer: 0
    explain: 온도나 전력이 한도에 닿으면 GPU가 클럭을 낮춰요. 계산은 계속 돌아 사용률은 그대로인데, 같은 일이 더 오래 걸려요.
  - id: driver-error-name
    type: input
    prompt: NVIDIA 드라이버가 GPU 에러를 번호와 함께 커널 로그에 남기는 메시지를 무엇이라고 할까요?
    answer: [XID, Xid, XID 에러, Xid 에러]
    explain: XID예요. 번호마다 뜻이 달라서 NVIDIA의 XID 목록에서 번호로 찾아봐요.
