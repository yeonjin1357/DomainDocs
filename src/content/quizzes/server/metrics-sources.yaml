questions:
  - id: container-proc-meminfo
    type: ox
    prompt: 컨테이너 안에서 /proc/meminfo를 읽으면, 그 컨테이너가 쓰는 메모리와 한도가 나오나요?
    answer: false
    explain: 서버 전체의 값이 나와요. 컨테이너가 쓰는 양과 한도는 cgroup의 memory.current와 memory.max에서 읽어요.
  - id: why-top-differs
    type: choice
    prompt: 같은 서버, 같은 시각인데 top은 CPU 92%, 에이전트 그래프는 41%를 보여요. 가장 그럴듯한 이유는?
    choices:
      - 평균 낸 시간이 달라서, 짧은 폭주가 1분 평균에 깎였어요
      - 에이전트가 고장 나서 값을 잘못 읽었어요
      - top은 다른 서버를 보고 있어요
      - 커널이 도구마다 다른 값을 줘요
    answer: 0
    explain: 둘 다 같은 커널 누적값에서 왔어요. 몇 초 동안의 차이로 계산했는지에 따라 숫자가 달라져요.
  - id: cpu-usage-query
    type: choice
    prompt: node_exporter 지표로 서버 전체 CPU 사용률(0~1)을 구하는 식으로 알맞은 것은?
    choices:
      - 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
      - avg by (instance) (node_cpu_seconds_total{mode="idle"})
      - sum by (instance) (node_cpu_seconds_total)
      - rate(node_cpu_seconds_total{mode="user"}[5m])
    answer: 0
    explain: CPU 시간은 누적값이라 rate로 초당 증가량을 구해요. 쉬는 시간의 비율을 1에서 빼면 사용률이에요.
  - id: double-mount
    type: ox
    prompt: 같은 디스크가 두 곳에 마운트되어 있으면, 파일 시스템 사용량을 모두 더할 때 그 디스크가 두 번 더해질 수 있나요?
    answer: true
    explain: 마운트 위치마다 시계열이 따로 생겨요. 합칠 때는 장치(device)로 묶어 한 번만 세요.
  - id: node-exporter-term
    type: input
    prompt: Prometheus 생태계에서 리눅스 서버의 CPU, 메모리, 디스크 지표를 /proc 등에서 읽어 내보내는 에이전트의 이름은?
    answer: [node_exporter, node exporter, 노드 익스포터]
    explain: 기본으로 9100번 포트에서 지표를 보여 주고, Prometheus가 가져가요.
