questions:
  - id: top-row
    type: choice
    prompt: 서비스 대시보드의 맨 위 줄에 두기 가장 알맞은 것은?
    choices:
      - 에러율과 p99 응답시간
      - 서버별 CPU와 메모리 사용률
      - 커넥션 풀과 스레드 사용량
      - DB와 캐시의 응답시간
    answer: 0
    explain: 사람은 위에서 아래로 읽어요. 사용자가 겪는 증상을 먼저 보여 주고, 원인 후보인 자원 패널은 그 아래에 둬요.
  - id: stacked-caution
    type: ox
    prompt: 서버별 요청 수를 누적 그래프(stacked)로 그리면, 위쪽 서버의 선 높이는 아래 서버들의 값까지 더한 값인가요?
    answer: true
    explain: 누적 그래프는 선마다 아래 선 위에 얹혀 그려져서, 높이가 그 서버만의 값이 아니에요. Grafana 문서도 대부분은 끄라고 해요.
  - id: template-variable
    type: choice
    prompt: 서버 30대마다 같은 모양의 대시보드를 하나씩 복사해 두었어요. 더 나은 방법은?
    choices:
      - 서버를 고르는 변수를 두고 한 벌로 합쳐요
      - 모든 서버를 한 패널에 겹쳐 그려 한 벌로 합쳐요
      - 복사본마다 링크를 달아 서로 오가게 해요
      - 값이 큰 서버 몇 개만 topk로 남겨 그려요
    answer: 0
    explain: 복사본은 하나를 고쳐도 나머지는 그대로라 금방 어긋나요. 템플릿 변수로 한 벌을 바꿔 봐요.
  - id: refresh-rate
    type: ox
    prompt: 1분마다 모으는 지표를 보여 주는 대시보드를 5초마다 새로 고치면, 화면의 값도 5초마다 바뀌나요?
    answer: false
    explain: 값은 1분에 한 번 바뀌어서 화면은 그대로이고 질의만 늘어요. 새로고침은 데이터가 바뀌는 속도에 맞춰요.
  - id: golden-signals-four
    type: choice
    prompt: Google SRE Book이 사용자가 쓰는 시스템에서 네 가지만 잴 수 있다면 집중하라고 한 신호는?
    choices:
      - 지연·트래픽·에러·포화
      - 사용률·포화·에러·지연
      - 요청 수·에러·지연·CPU
      - 지연·트래픽·에러·사용률
    answer: 0
    explain: 네 가지는 지연, 트래픽, 에러, 포화예요. 사용률은 자원을 보는 USE(사용률·포화·에러)의 한 글자예요.
