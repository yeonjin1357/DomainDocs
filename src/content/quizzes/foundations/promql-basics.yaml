questions:
  - id: regex-anchored
    type: ox
    prompt: 상태 코드가 500, 503인 시계열이 있을 때, http_requests_total{status=~"5"}는 이 둘을 고르나요?
    answer: false
    explain: PromQL 정규식은 값 전체와 맞아야 해서 "5"는 값이 정확히 5인 것만 골라요. 5로 시작하는 세 자리는 "5.."로 써요.
  - id: without-keeps-rest
    type: choice
    prompt: job, instance, status 레이블이 붙은 시계열을 sum without (instance)로 묶으면, 결과에 남는 레이블은?
    choices:
      - job과 status
      - instance 하나만
      - 하나도 남지 않아요
      - job 하나만
    answer: 0
    explain: without은 적은 레이블만 빼고 나머지를 남겨요. 반대로 by는 적은 레이블만 남겨서, sum by (job)이면 job 하나만 남아요.
  - id: empty-division
    type: choice
    prompt: sum by (job, status)로 구한 5xx 수를 sum by (job)으로 구한 전체 요청 수로 나눴더니 결과가 비었어요. 왜 그럴까요?
    choices:
      - status 레이블 탓에 짝이 없어서요
      - 5xx 요청이 하나도 없어서요
      - 오른쪽 전체 요청 수가 0이라서요
      - rate 구간이 너무 짧아서요
    answer: 0
    explain: 나누기는 양쪽 레이블이 똑같은 시계열끼리 짝을 지어요. 왼쪽에만 status가 있으면 짝이 없어요. ignoring(status)와 group_left로 짝짓는 법을 바꿀 수 있어요.
  - id: sum-without-by
    type: ox
    prompt: sum(rate(http_requests_total[5m]))처럼 by 없이 sum을 쓰면, 서비스마다 하나씩 결과가 나오나요?
    answer: false
    explain: by나 without이 없으면 모든 시계열이 하나로 합쳐져요. 서비스마다 보려면 by (job)을 적어요.
  - id: range-vector-name
    type: input
    prompt: http_requests_total[5m]처럼 시계열마다 최근 5분 동안의 값들을 모두 가져온 결과를 뭐라고 부를까요?
    answer: [range vector, 레인지 벡터, 범위 벡터, 구간 벡터]
    explain: 이 결과는 바로 그릴 수 없어서 rate나 avg_over_time 같은 함수에 넣어 숫자 하나로 바꿔요.
