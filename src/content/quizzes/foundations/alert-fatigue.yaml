questions:
  - id: no-action-alerts
    type: choice
    prompt: 받은 사람이 할 일이 없었던 CPU 알림이 자주 울려요. 먼저 할 일은?
    choices:
      - 대시보드로 옮기거나 증상 알림으로 바꿔요
      - 지속 시간을 두어, 몇 분 이어질 때만 울리게 해요
      - 사일런스를 걸어, 알림이 오지 않게 막아 둬요
      - 임계값을 낮춰, 문제를 더 일찍 알게 해요
    answer: 0
    explain: 사람을 부르는 알림은 모두 조치할 수 있어야 해요. 원인 지표는 증상 알림이 울렸을 때 이유를 찾는 데 써요.
  - id: slo-threshold-noisy
    type: ox
    prompt: 에러율이 한 달 내내 0.1%로 이어지면, 30일 99.9% SLO는 지켜지나요?
    answer: true
    explain: 에러 버짓 0.1%를 딱 맞게 쓰는 셈이라 SLO는 지켜져요. 그래서 '10분 에러율 0.1% 이상' 알림은 할 일 없이 울려요.
  - id: burn-rate-basis
    type: choice
    prompt: SLO 알림의 임계값을 정할 때, Google SRE Workbook이 권하는 기준은?
    choices:
      - 에러 버짓을 쓰는 속도
      - SLO와 같은 에러율 값
      - 지난 2주 에러율의 최댓값
      - 평소 에러율의 표준편차 3배
    answer: 0
    explain: 버짓을 쓰는 속도(burn rate)로 정해요. 긴 구간과 짧은 구간을 함께 걸면 작은 스파이크는 거르고, 장애가 끝나면 곧 풀려요.
  - id: group-by-cluster
    type: choice
    prompt: 서버 수백 대가 같은 규칙으로 울리는 알림을, Alertmanager에서 클러스터마다 하나로 받으려면?
    choices:
      - group_by에 cluster와 alertname을 적어요
      - group_by에 instance와 alertname을 적어요
      - group_wait를 늘려, 알림을 더 오래 모아 보내요
      - 억제 규칙의 equal에 cluster를 적어 둬요
    answer: 0
    explain: group_by에 적은 레이블 값이 같은 알림을 한 알림으로 묶어요. instance를 넣으면 서버마다 따로 와요.
  - id: silence-not-fix
    type: ox
    prompt: 시끄러운 규칙에 사일런스를 걸어 두면, 끝나는 시각이 지난 뒤 같은 알림이 다시 오나요?
    answer: true
    explain: 사일런스는 정한 시간 동안만 보내기를 막아요. 규칙을 고친 게 아니라서, 끝나면 다시 울려요.
