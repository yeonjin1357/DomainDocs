questions:
  - id: silence-keeps-evaluating
    type: ox
    prompt: 알림에 사일런스를 걸면, 그동안 알림 규칙의 평가도 멈춰서 화면에서도 알림이 사라지나요?
    answer: false
    explain: 사일런스, 점검 시간, 억제는 보내기만 막아요. 알림은 계속 평가되고 화면에는 suppressed 상태로 보여요.
  - id: silence-or-mute-timing
    type: choice
    prompt: 매주 일요일 새벽 2시부터 4시까지 DB 점검을 해요. 이때의 알림을 막기에 가장 알맞은 방법은?
    choices:
      - 점검 시간(mute timing)을 설정에 넣어 그 경로에 붙여요
      - 매주 손으로 2시간짜리 사일런스를 걸어요
      - 그 시간에는 알림 규칙을 지워 둬요
      - 알림을 받는 채팅방을 잠시 나가요
    answer: 0
    explain: 한 번뿐이면 사일런스, 되풀이되면 점검 시간이 맞아요. 손으로 거는 사일런스는 빠뜨리거나 늦게 풀기 쉬워요.
  - id: utc-default
    type: choice
    prompt: Alertmanager 점검 시간을 location 없이 02:00~04:00으로 적었어요. 한국 시간으로는 언제 알림이 꺼질까요?
    choices:
      - 오전 11시~오후 1시
      - 새벽 2시~4시
      - 오후 5시~7시
      - 꺼지지 않아요
    answer: 0
    explain: 시간대를 적지 않으면 UTC로 읽어요. 한국 시간은 UTC보다 9시간 빨라서 11시~13시가 돼요.
  - id: inhibit-equal
    type: ox
    prompt: ClusterDown이 울릴 때 warning 알림을 막는 억제 규칙에 equal [cluster]를 적으면, 다른 클러스터의 warning 알림도 함께 막히나요?
    answer: false
    explain: equal에 적은 레이블 값이 같은 알림만 막아요. 그래서 같은 클러스터의 warning만 조용해져요.
  - id: watchdog-term
    type: input
    prompt: 알림 파이프라인이 살아 있는지 확인하려고 늘 울리게 만들어 두는 알림을 흔히 뭐라고 부를까요?
    answer: [Watchdog, 워치독, dead man's switch, 데드맨 스위치]
    explain: 이 알림이 바깥 시스템에 닿지 않으면 알림 길이 끊긴 거예요. 감시하는 쪽은 다른 곳에 둬요.
