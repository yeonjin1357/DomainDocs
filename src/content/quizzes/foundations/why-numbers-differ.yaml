questions:
  - id: align-range-step
    type: choice
    prompt: 같은 p99가 7일짜리 위젯과 1시간짜리 상세 화면에서 서로 달라요. 먼저 맞춰 볼 것은?
    choices:
      - 두 화면의 시간 범위와 점 간격
      - 서버들의 시계가 어긋났는지
      - 브라우저 캐시에 옛 값이 남았는지
      - 두 화면을 연 사람의 시간대
    answer: 0
    explain: 한 점이 맡는 시간이 다르면 짧은 피크가 빠지거나 묻혀요. 시간 범위와 점 간격(step)부터 같게 맞춰요.
  - id: averaged-p99s
    type: choice
    prompt: 서버 A는 요청 1,000개에 p99 0.5초, 서버 B는 요청 10개에 p99 5초예요. 두 p99의 평균 2.75초에 대해 맞는 말은?
    choices:
      - 전체 p99가 아니라서 다시 계산해야 해요
      - 서비스 전체의 p99예요
      - 요청 수로 가중해 평균 내면 전체 p99가 돼요
      - 둘 중 큰 값인 5초가 전체 p99예요
    answer: 0
    explain: p99는 평균 낼 수 없어서, 요청을 모두 모아 다시 계산해요. 히스토그램이라면 같은 버킷 경계끼리 먼저 더한 뒤 p99를 계산해요.
  - id: rate-window-peak
    type: choice
    prompt: 요청이 평소 초당 100건이다가 1분 동안만 400건이 됐어요. 5분 rate의 가장 높은 값은?
    choices:
      - 초당 160건
      - 초당 400건
      - 초당 100건
      - 초당 500건
    answer: 0
    explain: 5분 구간엔 평소 4분이 섞여요. (4 × 100 + 1 × 400) ÷ 5 = 160이라, 1분 rate로 본 400보다 낮아요.
  - id: utc-2pm-vs-kst-5am
    type: ox
    prompt: UTC로 시각을 읽는 화면의 '오후 2시'는, KST로 읽는 화면의 '오전 5시'와 같은 순간인가요?
    answer: false
    explain: 한국 시간은 UTC보다 9시간 빨라서, UTC 14시에 9시간을 더한 KST 23시가 같은 순간이에요. 하루 합계도 어느 시간대의 0시부터 세는지에 따라 달라져요.
