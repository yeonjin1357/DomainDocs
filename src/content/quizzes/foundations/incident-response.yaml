questions:
  - id: first-priority
    type: choice
    prompt: 배포 직후 결제 에러가 치솟았고, 아직 원인을 몰라요. Google SRE 책이 가장 먼저 할 일로 드는 것은?
    choices:
      - 되돌려서 피해부터 멈추기
      - 원인이 된 코드 줄 찾기
      - 회고 문서 쓰기 시작하기
      - 알림 임계값 다시 정하기
    answer: 0
    explain: 원인을 찾는 사이 사용자 피해가 이어지면 도움이 안 돼요. 피해를 멈추고, 로그와 지표를 남겨 둔 뒤 원인을 찾아요.
  - id: mttr-definition-gap
    type: choice
    prompt: 같은 장애를 A팀은 MTTR 25분, B팀은 40분으로 적었어요. 가장 그럴듯한 까닭은?
    choices:
      - R을 피해 멈춤과 다 고침으로 달리 봐서요
      - 두 팀의 시계가 15분 어긋나서요
      - B팀이 MTTD를 한 번 더 더해서요
      - A팀이 알림을 늦게 받아서요
    answer: 0
    explain: MTTR의 R은 고침, 복구, 종료, 대응 가운데 무엇이든 될 수 있어요. 피해가 멈춘 때까지면 25분, 다 고친 때까지면 40분이에요.
  - id: mean-pulled-by-outlier
    type: ox
    prompt: 장애 10건 중 9건이 20분 안에 끝나고 1건이 240분 걸렸어요. 이때 평균 시간은 9건보다 길게 나오나요?
    answer: true
    explain: 합이 352분이라 평균은 35분쯤이에요. 9건보다 길고 1건보다는 훨씬 짧아서, 어느 장애와도 닮지 않은 숫자예요.
  - id: start-at-alert
    type: ox
    prompt: 장애 시작 시각을 알림이 울린 시각으로 적어도, MTTD는 실제로 알아채는 데 걸린 시간대로 나오나요?
    answer: false
    explain: 시작을 알림 시각으로 적으면 시작부터 알아채기까지가 늘 0이에요. 시작은 지표를 거슬러 실제로 나빠진 때로 적어요.
  - id: blameless-name
    type: input
    prompt: 누가 실수했는지보다 실수가 장애로 번지게 한 시스템과 절차를 찾는 데 집중하는 장애 회고를 영어로 무엇이라고 부를까요?
    answer: [blameless postmortem, blameless, 블레임리스 포스트모템, 블레임리스]
    explain: blameless postmortem이에요. 사람을 탓하면 문제를 숨기게 돼서, 시스템과 절차를 고치는 데 집중해요.
