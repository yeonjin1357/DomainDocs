questions:
  - id: fixed-threshold-gap
    type: choice
    prompt: 새벽 주문이 분당 15건까지 내려가서 '분당 10건 미만'에 알림을 걸었어요. 낮에 300건이 150건으로 줄면?
    choices:
      - 알림이 울리지 않아요
      - 곧바로 울려요
      - 지속 시간이 지나면 울려요
      - 절반으로 줄었으니 경고 단계로 울려요
    answer: 0
    explain: 150건은 10건보다 훨씬 많아서 고정 임계값으로는 조용해요. 시간대마다 평소 값이 다르면 기준선과 견줘야 잡혀요.
  - id: anomaly-not-incident
    type: ox
    prompt: 이상 탐지가 이상을 표시했다면, 사용자가 겪는 장애가 났다는 뜻인가요?
    answer: false
    explain: 이상은 평소와 다르다는 뜻이라, 할인 행사나 배포로도 생겨요. 그래서 사람을 부르는 알림은 증상에 걸어요.
  - id: three-sigma-daily
    type: choice
    prompt: 값이 정규분포를 따르고, 1분마다 ±3σ 범위로 판정해요. 장애가 없어도 하루에 대략 몇 번 범위를 벗어날까요?
    choices:
      - 4번쯤
      - 0번
      - 40번쯤
      - 400번쯤
    answer: 0
    explain: ±3σ 밖은 0.27%예요. 하루 1,440번 판정하면 3.9번쯤 벗어나서, 지속 시간을 함께 걸어요.
  - id: baseline-with-incident
    type: choice
    prompt: 지난주 같은 시각을 기준선으로 쓰는데, 지난주 그 시각에 장애가 있었어요. 오늘은 정상이라면?
    choices:
      - 오늘의 정상 값이 이상으로 표시될 수 있어요
      - 기준선이 장애 구간을 알아서 빼 줘요
      - 그 시각에는 이상 탐지가 꺼져요
      - 고정 임계값으로 저절로 바뀌어요
    answer: 0
    explain: 기준선은 숫자만 봐서 지난주의 장애도 평소로 삼아요. 여러 주의 값으로 만든 예측의 중앙값을 쓰면 이런 일이 줄어요.
  - id: baseline-term
    type: input
    prompt: 이상 탐지에서 '지금 시각에 나올 법한 값과 그 범위'를 뭐라고 부를까요?
    answer: [기준선, baseline, 베이스라인]
    explain: 지난주 같은 시각의 값, 최근 평균과 표준편차, 계절성 모델 등으로 만들어요.
