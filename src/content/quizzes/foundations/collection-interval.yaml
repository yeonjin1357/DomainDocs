questions:
  - id: gauge-misses-spike
    type: ox
    prompt: 15초마다 수집하는 CPU 사용률 게이지에서, 수집 사이에 끝난 3초짜리 100% 스파이크는 기록에서 빠지나요?
    answer: true
    explain: 게이지는 수집하는 순간의 값만 남겨요. 그래서 이 스파이크엔 CPU 90% 초과 알림도 울리지 않아요.
  - id: counter-average
    type: choice
    prompt: 1분 중 57초는 CPU 40%, 3초는 100%였어요. CPU 시간 카운터로 구한 1분 평균은?
    choices:
      - 43%
      - 100%
      - 70%
      - 40%
    answer: 0
    explain: (57 × 40 + 3 × 100) ÷ 60 = 43%예요. 카운터엔 스파이크가 남지만, 평균에 묻혀 100%였다는 건 알 수 없어요.
  - id: rate-window
    type: choice
    prompt: 15초마다 수집할 때, Grafana가 권하는 rate 구간은?
    choices:
      - 수집 주기의 4배인 1분 이상
      - 수집 주기와 같은 15초
      - 수집 주기의 2배인 30초
      - 수집 주기의 절반인 7.5초
    answer: 0
    explain: 구간에 샘플이 2개 이상 들어야 rate가 나와요. 수집이 한 번 빠져도 버티게 4배 이상으로 잡아요.
  - id: interval-changed
    type: ox
    prompt: 수집 주기를 15초에서 1분으로 늘리면, rate(...[1m])로 건 알림은 전처럼 울리나요?
    answer: false
    explain: 이제 1분 구간에 샘플이 대개 하나뿐이라 값이 비고 알림도 울리지 않아요. 구간을 4분 이상으로 다시 잡아요.
  - id: deleted-pod-up
    type: choice
    prompt: Kubernetes에서 지운 파드의 up 지표는 어떻게 될까요?
    choices:
      - stale 표시와 함께 시계열이 사라져요
      - 다음 수집에 실패해 0이 되고 그대로 남아요
      - 마지막 값 1이 5분 동안 남았다가 사라져요
      - 0이 된 뒤, 보관 기간이 지나면 사라져요
    answer: 0
    explain: 수집 대상 목록에서 빠지면 up이 0이 아니라 사라져요. 그래서 up == 0 알림만으로는 이런 대상을 놓쳐요.
