questions:
  - id: gauge-misses-spike
    type: ox
    prompt: 15초마다 수집하는 CPU 사용률 게이지로, 3초짜리 100% 스파이크를 언제나 잡을 수 있나요?
    answer: false
    explain: 게이지는 수집하는 순간의 값만 남겨요. 수집 사이에 끝난 스파이크는 기록에 없어서 알림도 울리지 않아요.
  - id: counter-average
    type: choice
    prompt: 1분 중 57초는 CPU 40%, 3초는 100%였어요. CPU 시간 카운터로 구한 1분 평균은?
    choices:
      - 43%
      - 100%
      - 70%
      - 40%
    answer: 0
    explain: (57 × 40 + 3 × 100) ÷ 60 = 43%예요. 카운터엔 스파이크가 남지만, 평균에 묻혀 100%였다는 건 알 수 없어요.
  - id: rate-window
    type: choice
    prompt: 15초마다 수집할 때, Grafana가 권하는 rate 구간은?
    choices:
      - 1분 이상(수집 주기의 4배)
      - 15초
      - 5초
      - 30초면 언제나 충분해요
    answer: 0
    explain: 구간에 샘플이 2개 이상 들어야 rate가 나와요. 수집이 한 번 빠져도 버티게 4배 이상으로 잡아요.
  - id: interval-changed
    type: ox
    prompt: 수집 주기를 15초에서 1분으로 늘렸어요. rate(...[1m])로 건 알림은 그대로 둬도 되나요?
    answer: false
    explain: 이제 1분 구간에 샘플이 대개 하나뿐이라 값이 비고 알림도 울리지 않아요. 구간을 4분 이상으로 다시 잡아요.
  - id: deleted-pod-up
    type: choice
    prompt: Kubernetes에서 지운 파드의 up 지표는 어떻게 될까요?
    choices:
      - 0이 되지 않고, stale 표시와 함께 사라져요
      - 0이 돼요
      - 1로 계속 남아요
      - 음수가 돼요
    answer: 0
    explain: 수집 대상 목록에서 빠지면 up이 0이 아니라 사라져요. 그래서 up == 0 알림만으로는 이런 대상을 놓쳐요.
