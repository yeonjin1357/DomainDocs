questions:
  - id: mean-calc
    type: choice
    prompt: 요청 100개 중 98개는 0.13초, 2개는 3초 걸렸어요. 평균 응답시간은?
    choices:
      - 0.187초
      - 0.13초
      - 3초
      - 1.5초
    answer: 0
    explain: (98 × 0.13 + 2 × 3) ÷ 100 = 0.187초예요. 0.187초 걸린 요청은 하나도 없어서, 평균만 보면 3초를 기다린 사용자가 안 보여요.
  - id: two-slow-p99
    type: ox
    prompt: 나머지가 모두 0.13초인 요청 100개 중 3초짜리 느린 요청이 2개(2%)면, p99가 3초가 되나요?
    answer: true
    explain: 100개의 p99는 99번째 값이에요. 느린 요청이 1개면 99번째는 0.13초지만, 2개가 되는 순간 99번째가 3초예요.
  - id: p99-tail-count
    type: choice
    prompt: 요청이 초당 1,000건이고 p99가 1.2초예요. 1.2초보다 오래 걸린 요청은 초당 몇 건쯤일까요?
    choices: [약 10건, 약 990건, 약 1건, 약 100건]
    answer: 0
    explain: p99는 요청의 99%가 끝난 시간이라, 나머지 1%인 초당 10건쯤이 그보다 오래 걸려요.
  - id: hourly-p99
    type: choice
    prompt: 1시간 동안의 p99를 구하는 바른 방법은?
    choices:
      - 1시간 동안의 요청을 모두 모아 다시 계산해요
      - 1분짜리 p99 60개를 평균 내요
      - 1분짜리 p99 중 가장 큰 값을 골라요
      - 1시간 평균에 1.99를 곱해요
    answer: 0
    explain: 짧은 구간의 p99를 평균 내도 긴 구간의 p99가 되지 않아요. 원본 값이나 히스토그램으로 다시 계산해요.
  - id: small-sample-p99
    type: choice
    prompt: 요청이 50개뿐일 때, 순위로 값을 고르는 방식(nearest-rank)의 p99는?
    choices:
      - 가장 큰 값이에요
      - 49번째 값이에요
      - 가운데 값이에요
      - 계산할 수 없어요
    answer: 0
    explain: 순위는 올림(0.99 × 50) = 50이라 맨 끝이에요. 그래서 p99 옆에 요청 수를 함께 보여 줘요.
