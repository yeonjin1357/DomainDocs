questions:
  - id: why-from-logs
    type: choice
    prompt: 장애에서 '왜 실패했는지'를 가장 자세히 알려 주는 신호는?
    choices:
      - 로그
      - 메트릭
      - 트레이스
      - 대시보드의 평균선
    answer: 0
    explain: 로그는 에러 메시지처럼 사건의 자세한 내용을 담아요. 메트릭은 얼마나, 트레이스는 어디서를 알려 줘요.
  - id: where-from-traces
    type: choice
    prompt: 요청 하나가 여러 서비스를 지나며 어느 구간이 느렸는지 보여 주는 신호는?
    choices:
      - 트레이스
      - 메트릭
      - 로그
      - 알림
    answer: 0
    explain: 트레이스는 작업 하나마다 시작과 끝 시각이 있는 span을 남겨서, 느린 구간과 실패한 곳을 보여 줘요.
  - id: metric-cost-flat
    type: ox
    prompt: 요청이 10배로 늘면, 요청 수 메트릭 시계열 하나의 저장량도 10배로 늘어나나요?
    answer: false
    explain: 시계열 하나는 수집할 때마다 숫자 하나예요. 레이블 조합이 그대로면 요청이 늘어도 저장량은 그대로예요.
  - id: head-sampling-miss
    type: choice
    prompt: 요청 시작 때 트레이스를 10%만 남겨요. 한 시간에 5번 난 드문 에러의 트레이스가 하나도 안 남을 확률은?
    choices:
      - 약 59%
      - 10%
      - 50%
      - 0%
    answer: 0
    explain: 한 번 빠질 확률이 0.9라서 다섯 번 모두 빠질 확률은 0.9의 5제곱, 약 59%예요.
  - id: link-logs-traces
    type: choice
    prompt: 트레이스에서 본 요청의 로그만 골라 보려면, 로그마다 무엇을 남겨야 할까요?
    choices:
      - trace id와 span id
      - 사용자 이메일
      - 서버 IP만
      - 로그 레벨만
    answer: 0
    explain: 같은 trace id로 로그를 찾으면 시각으로 맞춰 볼 필요가 없어요. 같은 시간대 에러 로그가 많아도 가려져요.
