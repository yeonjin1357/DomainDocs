questions:
  - id: retention-15d
    type: choice
    prompt: 30일 전 구간을 그리는 패널이 비어 있어요. Prometheus를 기본 보관 설정으로 쓴다면 이유는?
    choices:
      - 따로 정하지 않으면 15일 치만 남겨서
      - 질의에 오타가 있어서
      - 지금 수집이 멈춰서
      - 대시보드 시간대가 틀려서
    answer: 0
    explain: 보관 기간이 지난 데이터는 지워져서 아무리 질의해도 비어요.
  - id: regex-full-match
    type: choice
    prompt: route=~"/api"로 /api/users 경로를 고르려 했는데 결과가 비어요. 왜일까요?
    choices:
      - =~도 값 전체가 맞아야 해서 "/api.*"처럼 써야 해요
      - 경로의 대소문자가 달라서
      - 그 경로에 요청이 없어서
      - 레이블을 적는 순서가 틀려서
    answer: 0
    explain: Prometheus 정규식은 값 전체에 맞춰 봐요. 앞부분만 맞추려면 뒤에 .*를 붙여요.
  - id: job-renamed
    type: choice
    prompt: 배포한 시각부터 job="api" 조건의 그래프가 끊겼어요. 먼저 의심할 것은?
    choices:
      - 배포하며 job 값이 다른 이름으로 바뀌었어요
      - 서버가 모두 꺼졌어요
      - 보관 기간이 지났어요
      - rate 구간이 짧아졌어요
    answer: 0
    explain: 조건에 맞는 시계열이 없으면 에러 없이 빈 결과가 나와요. 레이블 조건을 하나씩 빼며 지금 값을 확인해요.
  - id: otlp-no-up
    type: ox
    prompt: OTLP로 지표를 직접 보내는 앱도, up 지표로 수집 상태를 볼 수 있나요?
    answer: false
    explain: up은 Prometheus가 가져가는 대상에만 생겨요. 보내는 앱은 그 앱의 지표나 target_info가 계속 들어오는지 봐요.
  - id: rate-empty-window
    type: choice
    prompt: 원본 지표에는 값이 있는데, 그 지표의 rate만 비어 있어요. 먼저 볼 것은?
    choices:
      - rate 구간이 수집 주기보다 충분히 긴지
      - 레이블 값의 오타
      - 대시보드 시간대
      - 보관 기간
    answer: 0
    explain: rate는 구간에 샘플이 2개 이상 있어야 값을 내요. 수집 주기의 4배 이상으로 잡아요.
