questions:
  - id: retention-15d
    type: choice
    prompt: Prometheus 설정을 하나도 바꾸지 않고 쓰는데, 30일 전 구간을 그리는 패널만 비어 있어요. 가장 그럴듯한 이유는?
    choices:
      - 기본 보관 기간 15일이 지나 지워져서
      - 30일 범위라 점 간격이 넓어져 빠져서
      - 대시보드 시간대가 UTC로 틀려서
      - 그 무렵 수집 대상이 목록에서 빠져서
    answer: 0
    explain: 보관 기간이 지난 데이터는 지워져서 아무리 질의해도 비어요.
  - id: explore-ok-panel-empty
    type: choice
    prompt: 패널의 질의를 Explore에서 그대로 실행하면 결과가 나오는데, 패널만 비어 있어요. 먼저 볼 것은?
    choices:
      - 패널의 Transformations
      - 수집 대상의 up 값
      - Prometheus 보관 기간 설정
      - 질의 속 지표 이름의 오타
    answer: 0
    explain: 같은 질의가 Explore에서 나온다면 데이터와 질의는 멀쩡해요. 질의 결과를 패널에서 가공하는 Transformations가 값을 걸러 냈는지 봐요.
  - id: job-renamed
    type: choice
    prompt: 배포한 시각부터 job="api" 조건의 그래프가 끊겼어요. 먼저 의심할 것은?
    choices:
      - 배포하며 job 값이 바뀌었어요
      - 보관 기간이 지나 옛 데이터가 지워졌어요
      - rate 구간이 수집 주기보다 짧아졌어요
      - 대시보드 시간대가 UTC로 바뀌었어요
    answer: 0
    explain: 조건에 맞는 시계열이 없으면 에러 없이 빈 결과가 나와요. 레이블 조건을 하나씩 빼며 지금 값을 확인해요.
  - id: otlp-no-up
    type: ox
    prompt: OTLP로 지표를 직접 보내는 앱에도, Prometheus가 수집 상태를 담은 up 지표를 만드나요?
    answer: false
    explain: up은 Prometheus가 가져가는 대상에만 생겨요. 보내는 앱은 그 앱의 지표나 target_info가 계속 들어오는지 봐요.
  - id: rate-empty-window
    type: choice
    prompt: 원본 지표에는 값이 있는데, 그 지표의 rate만 비어 있어요. 먼저 볼 것은?
    choices:
      - rate 구간이 수집 주기보다 충분히 긴지
      - rate 안의 레이블 조건에 오타가 있는지
      - 대시보드 시간대가 UTC로 맞춰져 있는지
      - 원본 지표가 카운터가 아니라 게이지인지
    answer: 0
    explain: rate는 구간에 샘플이 2개 이상 있어야 값을 내요. 수집 주기의 4배 이상으로 잡아요.
