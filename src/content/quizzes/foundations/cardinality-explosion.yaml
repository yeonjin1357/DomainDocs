questions:
  - id: suspect-label
    type: choice
    prompt: 배포 뒤 Prometheus의 메모리와 전체 시계열 수가 가파르게 늘어요. 먼저 의심할 것은?
    choices:
      - 값이 끝없이 늘어나는 레이블 하나
      - 수집 주기
      - 보관 기간
      - 대시보드 개수
    answer: 0
    explain: 새 값마다 시계열이 생기고, 시계열마다 메모리와 디스크를 써요. 늘어난 지표와 레이블을 찾아요.
  - id: drop-not-stop
    type: ox
    prompt: metric_relabel_configs로 지표를 버리면, 앱도 그 시계열을 만들어 내보내기를 멈추나요?
    answer: false
    explain: 수집한 뒤에 버리는 거라 앱은 계속 만들어 내보내요. 계측 코드를 고칠 때까지만 쓰는 임시 방법이에요.
  - id: route-template-fix
    type: choice
    prompt: 경로 레이블에 /users/123 같은 실제 경로가 들어가 시계열이 늘어요. 근본적으로 고치는 방법은?
    choices:
      - 라우터가 맞춘 경로 틀(/users/:id)을 넣게 계측 코드를 고쳐요
      - labeldrop으로 경로 레이블을 지워요
      - 보관 기간을 줄여요
      - 수집 주기를 늘려요
    answer: 0
    explain: 레이블에는 값이 몇 개로 정해진 것만 남겨요. 사용자 ID 같은 값은 트레이스나 로그에 남겨요.
  - id: sample-limit-all
    type: ox
    prompt: sample_limit을 넘으면 늘어난 시계열만 버려지고, 그 대상의 나머지 값은 계속 수집되나요?
    answer: false
    explain: 넘으면 그 수집 전체가 실패로 처리돼 대상의 새 값이 모두 끊기고 up은 0이 돼요. 한도는 넉넉하게 잡아요.
  - id: labeldrop-collision
    type: choice
    prompt: 늘어난 레이블만 labeldrop으로 지우면 생길 수 있는 문제는?
    choices:
      - 그 레이블만 달랐던 시계열이 겹쳐, 값 하나만 남고 나머지는 오류 없이 사라져요
      - 아무 문제도 생기지 않아요
      - 그 대상의 모든 지표가 지워져요
      - 오류 메시지가 대시보드에 쌓여요
    answer: 0
    explain: 레이블을 지운 뒤에도 시계열마다 조합이 달라야 해요. 이런 레이블은 계측 코드에서 빼요.
