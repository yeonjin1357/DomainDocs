questions:
  - id: first-match
    type: ox
    prompt: Alertmanager에서 한 알림이 형제 경로 두 개에 모두 맞으면, 기본 설정으로 두 곳 모두에 보내지나요?
    answer: false
    explain: 기본은 처음 맞는 경로에서 멈춰요. 함께 보내려면 앞 경로에 continue true를 적어요.
  - id: label-case
    type: choice
    prompt: 경로 조건이 team="payment"인데, 알림 규칙에는 team="Payment"로 적혀 있어요. 이 알림은 어디로 갈까요?
    choices:
      - 결제 경로에 맞지 않아 기본 경로로 가요
      - 대소문자를 무시하고 결제 경로로 가요
      - 어디에도 가지 않고 버려져요
      - 모든 경로로 가요
    answer: 0
    explain: 레이블 값은 글자 그대로 견줘요. 맞는 경로가 없으면 맨 위 기본 경로가 받아요.
  - id: page-actionable
    type: choice
    prompt: 당직자를 한밤중에 호출하기에 알맞은 알림은?
    choices:
      - 결제 실패율이 SLO를 빠르게 태우고 있어요
      - 인증서가 두 달 뒤 만료돼요
      - 디스크가 일주일 뒤 찰 것 같아요
      - 배포가 끝났어요
    answer: 0
    explain: 호출은 사람이 지금 손써야 하는 일에만 써요. 나머지는 채팅방이나 티켓으로 보내요.
  - id: escalation
    type: ox
    prompt: 에스컬레이션 정책에서 첫 단계 당직자가 정한 시간 안에 확인하지 않으면, 다음 단계의 사람에게 알림이 넘어가나요?
    answer: true
    explain: 확인이나 해결이 없으면 다음 단계로 넘겨요. 누가 확인하면 그 뒤로는 넘기지 않아요.
  - id: notify-failed
    type: input
    prompt: 채팅방 토큰이 만료돼 알림 보내기가 실패하는지 지켜볼 Alertmanager 지표 이름은?
    answer: [alertmanager_notifications_failed_total, notifications_failed_total]
    explain: 받는 곳 종류(integration)마다 보내기 실패 수를 세요. 이 값이 늘면 알림이 사람에게 닿지 않고 있어요.
