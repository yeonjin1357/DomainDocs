<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 304" width="300" height="304">
<rect x="8" y="10" width="128" height="40" rx="8" stroke-width="1.2" style="fill:var(--color-card);stroke:var(--color-line)" />
