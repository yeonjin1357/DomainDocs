<text x="10" y="158" font-size="13" style="fill:var(--color-text-sub)">0ms</text>
<text x="207.1" y="158" font-size="13" text-anchor="middle" style="fill:var(--color-text-sub)">25ms</text>
<text x="286" y="158" font-size="13" text-anchor="end" style="fill:var(--color-text-sub)">35ms</text>
<path d="M10 168 v5 H286 v-5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" style="fill:none;stroke:var(--color-accent)" />
<text x="150" y="192" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-accent)">r_await 35ms = 기다림 + 처리</text>
<text x="150" y="212" font-size="13" text-anchor="middle" style="fill:var(--color-text-sub)">줄이 길어지면 기다림이 늘어 함께 커져요</text>
