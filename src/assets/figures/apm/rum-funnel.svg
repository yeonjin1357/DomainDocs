<rect x="74" y="180" width="152" height="34" rx="8" style="fill:var(--color-accent)" />
<text x="150" y="202" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-card)">RUM 화면의 데이터</text>
