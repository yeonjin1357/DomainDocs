<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
<rect x="8" y="6" width="284" height="34" rx="8" stroke-width="1.2" style="fill:var(--color-bg);stroke:var(--color-line)" />
<text x="150" y="28" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-text)">실제 사용자 전체</text>
<rect x="30" y="64" width="240" height="34" rx="8" style="fill:var(--color-accent-weak)" />
<text x="150" y="86" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-text)">스크립트가 막히지 않은 사용자</text>
<text x="150" y="57" font-size="13" text-anchor="middle" font-weight="400" style="fill:var(--color-warn)">광고·추적 차단에서 빠져요</text>
<rect x="52" y="122" width="196" height="34" rx="8" style="fill:var(--color-accent-weak)" />
