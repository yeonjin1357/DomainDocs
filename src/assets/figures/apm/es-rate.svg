<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 248" width="300" height="248">
<rect x="4" y="4" width="292" height="116" rx="10" stroke-width="1.3" style="fill:var(--color-card);stroke:var(--color-line)" />
<text x="14" y="26" font-size="13" font-weight="700" style="fill:var(--color-text)">요청도 늘었을 때</text>
<text x="14" y="50" font-size="13" style="fill:var(--color-text-sub)">요청(분당)</text>
<text x="120" y="50" font-size="13" font-weight="600" style="fill:var(--color-text)">6,000 → 60,000건</text>
<text x="14" y="70" font-size="13" style="fill:var(--color-text-sub)">에러(분당)</text>
<text x="120" y="70" font-size="13" font-weight="600" style="fill:var(--color-text)">30 → 300건</text>
<text x="14" y="90" font-size="13" style="fill:var(--color-text-sub)">에러율</text>
<text x="120" y="90" font-size="13" font-weight="700" style="fill:var(--color-accent)">0.5% 그대로</text>
<text x="14" y="110" font-size="13" style="fill:var(--color-text-sub)">다음: 요청이 왜 늘었나</text>
<rect x="4" y="128" width="292" height="116" rx="10" stroke-width="1.3" style="fill:var(--color-warn-weak);stroke:var(--color-warn)" />
<text x="14" y="150" font-size="13" font-weight="700" style="fill:var(--color-warn)">에러만 늘었을 때</text>
<text x="14" y="174" font-size="13" style="fill:var(--color-text-sub)">요청(분당)</text>
<text x="120" y="174" font-size="13" font-weight="600" style="fill:var(--color-text)">6,000건 그대로</text>
<text x="14" y="194" font-size="13" style="fill:var(--color-text-sub)">에러(분당)</text>
<text x="120" y="194" font-size="13" font-weight="600" style="fill:var(--color-text)">30 → 300건</text>
<text x="14" y="214" font-size="13" style="fill:var(--color-text-sub)">에러율</text>
<text x="120" y="214" font-size="13" font-weight="700" style="fill:var(--color-warn)">0.5% → 5%</text>
<text x="14" y="234" font-size="13" style="fill:var(--color-text-sub)">다음: 2단계 에러 종류</text>
</svg>
