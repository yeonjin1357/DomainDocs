<text x="14" y="74" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-text)">Host: shop.example.com</text>
<text x="286" y="74" font-size="13" text-anchor="end" font-weight="400" style="fill:var(--color-text-sub)">헤더</text>
<text x="14" y="98" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-text)">Accept: application/json</text>
<text x="286" y="98" font-size="13" text-anchor="end" font-weight="400" style="fill:var(--color-text-sub)">헤더</text>
<text x="14" y="122" font-size="13" style="fill:var(--color-text-weak)">(빈 줄)</text>
