<rect x="4" y="170" width="292" height="132" rx="10" stroke-width="1.4" style="fill:var(--color-card);stroke:var(--color-line)" />
<text x="14" y="190" font-size="13" font-weight="700" style="fill:var(--color-text)">응답</text>
<rect x="8" y="200" width="284" height="22" rx="4" style="fill:var(--color-accent-weak)" />
<text x="14" y="216" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-accent)">HTTP/1.1 200 OK</text>
<text x="286" y="216" font-size="13" text-anchor="end" font-weight="700" style="fill:var(--color-accent)">첫 줄</text>
<text x="14" y="240" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-text)">Content-Type: application/json</text>
<text x="286" y="240" font-size="13" text-anchor="end" font-weight="400" style="fill:var(--color-text-sub)">헤더</text>
<text x="14" y="264" font-size="13" style="fill:var(--color-text-weak)">(빈 줄)</text>
<text x="286" y="264" font-size="13" text-anchor="end" font-weight="400" style="fill:var(--color-text-sub)"></text>
<text x="14" y="288" font-size="13" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-text)">{"id": 42, "status": "paid"}</text>
<text x="286" y="288" font-size="13" text-anchor="end" font-weight="400" style="fill:var(--color-text-sub)">본문</text>
