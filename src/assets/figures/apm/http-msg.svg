<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 306" width="300" height="306">
<rect x="4" y="4" width="292" height="156" rx="10" stroke-width="1.4" style="fill:var(--color-card);stroke:var(--color-line)" />
<text x="14" y="24" font-size="13" font-weight="700" style="fill:var(--color-text)">요청</text>
