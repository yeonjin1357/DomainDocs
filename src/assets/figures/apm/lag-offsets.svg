<text x="200" y="79" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-warn)">3</text>
<rect x="228" y="54" width="48" height="40" rx="6" stroke-width="1.4" stroke-dasharray="4 3" style="fill:none;stroke:var(--color-text-weak)" />
<text x="252" y="79" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-text-weak)">4</text>
