<text x="29.9" y="142.7" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-warn)">UF</text>
<text x="70" y="143" font-size="13" font-weight="600" style="fill:var(--color-text)">연결 실패</text>
<text x="288" y="143" font-size="13" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-warn)">503</text>
<rect x="14" y="157" width="31.8" height="22" rx="11" style="fill:var(--color-warn-weak)" />
<text x="29.9" y="172.7" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-warn)">UH</text>
<text x="70" y="173" font-size="13" font-weight="600" style="fill:var(--color-text)">건강한 대상이 없음</text>
<text x="288" y="173" font-size="13" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-warn)">503</text>
<rect x="14" y="187" width="31.8" height="22" rx="11" style="fill:var(--color-warn-weak)" />
<text x="29.9" y="202.7" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-warn)">UO</text>
<text x="70" y="203" font-size="13" font-weight="600" style="fill:var(--color-text)">서킷 브레이커가 막음</text>
<text x="288" y="203" font-size="13" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-warn)">503</text>
<rect x="14" y="217" width="31.8" height="22" rx="11" style="fill:var(--color-warn-weak)" />
<text x="29.9" y="232.7" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-warn)">NR</text>
<text x="70" y="233" font-size="13" font-weight="600" style="fill:var(--color-text)">맞는 경로가 없음</text>
<text x="288" y="233" font-size="13" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-warn)">404</text>
