<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 244" width="300" height="244">
<text x="8" y="18" font-size="13" font-weight="700" style="fill:var(--color-text-sub)">앱까지 갔어요</text>
<rect x="14" y="31" width="18.9" height="22" rx="11" style="fill:var(--color-accent-weak)" />
<text x="23.4" y="46.7" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-accent)">-</text>
<text x="70" y="47" font-size="13" font-weight="600" style="fill:var(--color-text)">앱이 낸 응답 그대로</text>
<rect x="14" y="61" width="40.8" height="22" rx="11" style="fill:var(--color-warn-weak)" />
<text x="34.4" y="76.7" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-warn)">URX</text>
<text x="70" y="77" font-size="13" font-weight="600" style="fill:var(--color-text)">앱이 계속 실패해 재시도를 다 씀</text>
<line x1="8" y1="92" x2="292" y2="92" stroke-width="1" stroke-linecap="butt" style="stroke:var(--color-line)" />
<text x="8" y="114" font-size="13" font-weight="700" style="fill:var(--color-text-sub)">프록시가 앱에 닿지 못했어요</text>
