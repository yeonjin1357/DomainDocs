<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 214" width="300" height="214">
<text x="8" y="24" font-size="13" font-weight="700" style="fill:var(--color-text)">요청 2코어</text>
<rect x="8" y="34" width="272" height="32" rx="5" stroke-width="1.3" style="fill:var(--color-bg);stroke:var(--color-text-sub)" />
<rect x="8" y="34" width="108.8" height="32" rx="5" style="fill:var(--color-text-sub)" />
<text x="62.4" y="55" font-size="13" text-anchor="middle" font-weight="700" style="fill:var(--color-card)">0.8코어 = 40%</text>
<line x1="171.2" y1="28" x2="171.2" y2="72" stroke-width="2.4" stroke-linecap="butt" style="stroke:var(--color-warn)" />
<text x="176.2" y="24" font-size="13" font-weight="700" style="fill:var(--color-warn)">목표 60%</text>
<text x="8" y="92" font-size="13" font-weight="700" style="fill:var(--color-warn)">목표에 못 닿아, 앱이 느려도 늘리지 않아요</text>
<line x1="8" y1="112" x2="292" y2="112" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" style="stroke:var(--color-line)" />
<text x="8" y="136" font-size="13" font-weight="700" style="fill:var(--color-text)">요청 1코어</text>
<rect x="8" y="146" width="136" height="32" rx="5" stroke-width="1.3" style="fill:var(--color-bg);stroke:var(--color-text-sub)" />
<rect x="8" y="146" width="108.8" height="32" rx="5" style="fill:var(--color-accent)" />
<text x="152" y="167" font-size="13" font-weight="700" style="fill:var(--color-accent)">0.8코어 = 80%</text>
<line x1="89.6" y1="140" x2="89.6" y2="184" stroke-width="2.4" stroke-linecap="butt" style="stroke:var(--color-warn)" />
<text x="94.6" y="136" font-size="13" font-weight="700" style="fill:var(--color-warn)">목표 60%</text>
<text x="8" y="204" font-size="13" font-weight="700" style="fill:var(--color-accent)">같은 사용량, 요청 1코어면 목표를 넘어 늘려요</text>
</svg>
