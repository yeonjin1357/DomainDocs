<text x="34" y="135" font-size="13" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" style="fill:var(--color-text-sub)">+ shop.svc.cluster.local</text>
<rect x="250.6" y="119" width="39.4" height="22" rx="11" style="fill:var(--color-warn-weak)" />
